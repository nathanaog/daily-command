/* ---------------- FOCUS view ---------------- */
const focusMinutes = dk => S.pomoLog.filter(l => Engine.dateKey(new Date(l.start)) === dk).reduce((a, l) => a + l.min, 0);
const todaysSessions = () => S.pomoLog.filter(l => Engine.dateKey(new Date(l.start)) === today());

function weekData(offset = 0) {
  // Monday of the selected week
  const now = new Date(); const dow = (now.getDay() + 6) % 7;
  const mon = Engine.atDay(now, -dow + offset * 7);
  return [...Array(7)].map((_, i) => {
    const d = Engine.atDay(mon, i), dk = Engine.dateKey(d);
    const logs = S.pomoLog.filter(l => Engine.dateKey(new Date(l.start)) === dk);
    return { d, dk, min: logs.reduce((a, l) => a + l.min, 0), n: logs.length };
  });
}
/** Hand-rolled SVG bar chart (no libraries → works offline). */
function weekChart(data) {
  const W = 340, H = 170, top = 22, bottom = 26, bw = 30, gap = (W - 7 * bw) / 8;
  const max = Math.max(60, ...data.map(d => d.min));
  const tk = Engine.dateKey(new Date());
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Focus minutes per day this week">`;
  s += `<line x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--border)"/>`;
  data.forEach((d, i) => {
    const x = gap + i * (bw + gap), h = (H - top - bottom) * d.min / max, y = H - bottom - h;
    const isT = d.dk === tk;
    s += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, d.min ? 2 : 0)}" rx="6" fill="${isT ? 'var(--accent)' : 'var(--m-work)'}" opacity="${isT ? 1 : .75}"><title>${d.min} min, ${d.n} sessions</title></rect>`;
    if (d.min) s += `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.min}</text>`;
    s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${isT ? 'var(--text)' : 'var(--muted)'}" font-weight="${isT ? 700 : 400}">${d.d.toLocaleDateString('en-GB', { weekday: 'narrow' })}</text>`;
  });
  return s + '</svg>';
}
function renderFocus() {
  const p = S.pomo, st = S.settings;
  const total = p.phase === 'idle' ? st.pomoWork * 60000 : p.planned * 60000;
  const rem = p.phase === 'idle' ? total : Pomo.remaining();
  const frac = Math.max(0, Math.min(1, 1 - rem / total)), C = 2 * Math.PI * 100;
  const t = taskById(p.taskId) || R.current.pick?.task;
  let h = `<h2>Focus</h2><div class="card" style="text-align:center">
    <div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--surface2)" stroke-width="12"/>
      <circle id="ringArc" cx="110" cy="110" r="100" fill="none" stroke="${p.phase === 'work' || p.phase === 'idle' ? 'var(--m-work)' : 'var(--m-life)'}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" transform="rotate(-90 110 110)"/></svg>
      <div class="in"><div class="timer num" id="focusTimer">${fmtClock(rem)}</div><div class="muted small">${p.phase === 'idle' ? 'Ready' : p.phase === 'work' ? 'Focus' : p.phase === 'long' ? 'Long break' : 'Break'}${p.paused ? ' · paused' : ''}</div></div></div>
    <div class="muted" style="margin-top:6px">${t ? 'On: <b>' + esc(t.title) + '</b>' : 'No task attached'} <button class="btn sm ghost" data-act="pomoPickTask">change</button></div>
    <div class="actions" style="justify-content:center">`;
  if (p.phase === 'idle') h += `<button class="btn primary" data-act="pomoStart">▶ Start ${st.pomoWork}m</button><button class="btn" data-act="pomoBreak">Break ${st.pomoBreak}m</button>`;
  else h += (p.paused ? `<button class="btn primary" data-act="pomoResume">Resume</button>` : `<button class="btn primary" data-act="pomoPause">Pause</button>`) + `<button class="btn" data-act="pomoStop">Stop</button>`;
  h += `</div><p class="small muted">Session ${((p.count || 0) % st.longEvery) + 1} of ${st.longEvery} before a long break</p></div>`;

  // Settings for lengths (inline, adjustable)
  h += sec('focus-set', 'Timer lengths', `<div class="row"><label class="f" style="flex:1">Work (min)<input type="number" min="5" max="120" value="${st.pomoWork}" data-setting="pomoWork"></label>
    <label class="f" style="flex:1">Break<input type="number" min="1" max="30" value="${st.pomoBreak}" data-setting="pomoBreak"></label></div>
    <div class="row"><label class="f" style="flex:1">Long break<input type="number" min="5" max="60" value="${st.pomoLong}" data-setting="pomoLong"></label>
    <label class="f" style="flex:1">Long every N<input type="number" min="2" max="8" value="${st.longEvery}" data-setting="longEvery"></label></div>
    <label class="row" style="min-height:44px"><input type="checkbox" data-setting="autoBreak" ${st.autoBreak ? 'checked' : ''} style="width:22px;height:22px"> Start breaks automatically</label>`);

  // Weekly chart + the maths behind the totals
  const wk = weekData(focusWeekOffset), sum = wk.reduce((a, d) => a + d.min, 0), n = wk.reduce((a, d) => a + d.n, 0);
  const daysWith = wk.filter(d => d.min).length;
  h += `<h2>Week ${focusWeekOffset ? `(${focusWeekOffset > 0 ? '+' : ''}${focusWeekOffset})` : ''}</h2><div class="card">
    <div class="row" style="justify-content:space-between"><button class="btn sm ghost" data-act="weekPrev">‹ Prev</button>
    <span class="muted small">${wk[0].d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} – ${wk[6].d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>
    <button class="btn sm ghost" data-act="weekNext" ${focusWeekOffset >= 0 ? 'disabled' : ''}>Next ›</button></div>
    ${weekChart(wk)}
    <div class="kpi"><div><b class="num">${fmtDur(sum * 60000)}</b>focused</div><div><b class="num">${n}</b>sessions</div><div><b class="num">${daysWith ? Math.round(sum / daysWith) : 0}m</b>per active day</div></div>
    <div class="math">${wk.map(d => d.min).join(' + ')} = ${sum} min = ${Math.floor(sum / 60)} h ${sum % 60} m
avg per active day = ${sum} ÷ ${daysWith || 1} = ${daysWith ? (sum / daysWith).toFixed(1) : 0} min${n ? `\navg session = ${sum} ÷ ${n} = ${(sum / n).toFixed(1)} min` : ''}</div></div>`;

  // Session log (latest first, last 7 days)
  const cutoff = Date.now() - 7 * 864e5;
  const recent = S.pomoLog.filter(l => l.start > cutoff).sort((a, b) => b.start - a.start);
  h += sec('focus-log', 'Session log (7 days)', recent.length ? `<ul class="list">${recent.map(l => `<li><span class="num muted" style="width:110px">${new Date(l.start).toLocaleDateString('en-GB', { weekday: 'short' })} ${fmtT(new Date(l.start))}</span>
    <span class="grow">${esc(l.taskTitle || '—')}${l.partial ? ' <span class="tag">partial</span>' : ''}</span><span class="num">${l.min}m</span>
    <button class="icon" data-act="logDelete" data-id="${l.id}" aria-label="Delete entry">✕</button></li>`).join('')}</ul>` : '<div class="empty">No sessions yet.</div>');
  $('#view-focus').innerHTML = h;
}

      ${overlaps.has(b.id) ? '<span class="tag warnchip">overlaps</span>' : ''}</span></li>`).join('')}</ul>
    ${overlaps.size ? '<p class="small warnchip">Overlapping blocks: the one that starts later wins while they overlap.</p>' : ''}

function findOverlaps(blocks) {
  // turn each block into [s,e) minute ranges on a 0..2880 line (wrapping ones extend past 1440)
  const r = blocks.map(b => { const s = Engine.parseHM(b.start); let e = Engine.parseHM(b.end); if (e <= s) e += 1440; return { id: b.id, s, e }; });
  const out = new Set();
  for (let i = 0; i < r.length; i++) for (let j = i + 1; j < r.length; j++) {
    const a = r[i], b = r[j];
    const ov = (x, y) => x.s < y.e && y.s < x.e;
    if (ov(a, b) || ov(a, { s: b.s + 1440, e: b.e + 1440 }) || ov({ s: a.s + 1440, e: a.e + 1440 }, b)) { out.add(a.id); out.add(b.id); }
  }
  return out;
}

  <h3>What isn’t possible / reliable</h3>

  <li class="limit"><b>The morning sequence can’t open itself.</b> It starts the first time <i>you</i> open the app in the morning; a web app can’t launch on its own at 07:30.</li>
  <li class="limit"><b>Voice capture</b> uses Chrome’s speech recognition, which sends audio to Google and needs a connection. Offline, type instead.</li>

  <h3>Stage 3 setup — your own feeds (one-off, ~10 min)</h3>
  <ol>
    <li><b>Repo:</b> on github.com create a repository (e.g. <code>daily-command</code>) and upload every file from the zip, keeping the folders (<code>.github/workflows</code>, <code>scripts</code>, <code>tests</code>, <code>icons</code>). Hidden folders: if the web uploader skips <code>.github</code>, create the file via <b>Add file → Create new file</b> and type <code>.github/workflows/digest.yml</code> as the name, then paste its contents.</li>
    <li><b>Pages:</b> Settings → Pages → Build and deployment → Source: <b>GitHub Actions</b>.</li>
    <li><b>Actions:</b> Settings → Actions → General → allow actions, and under Workflow permissions choose <b>Read and write</b>.</li>
    <li><b>First run:</b> Actions tab → “Digest + deploy” → <b>Run workflow</b>. After ~2 minutes your site is live at <code>https://&lt;you&gt;.github.io/&lt;repo&gt;/</code> with a real digest. It then runs every 3 hours by itself.</li>
    <li><b>Check the watchlist:</b> More → Watchlist & lenses shows each feed’s health. YouTube names are found by search — check “found …” is the right channel; if not, edit the feed and paste its <code>@handle</code> or channel link.</li>
  </ol>
  <h3>Editing the watchlist</h3>
  <p>More → Watchlist & lenses: add feeds (YouTube channel, subreddit, Google News search, any RSS URL), give them tags, build lenses from tags, set keyword boosts. Edits are local until you <b>publish</b>:</p>
  <ul><li><b>Easiest:</b> “Download feeds.json”, then in the repo open feeds.json → ✎ edit → paste, or upload it (replace). The push rebuilds the digest.</li>
  <li><b>One tap (optional):</b> create a <b>fine-grained personal access token</b> (GitHub → Settings → Developer settings → Fine-grained tokens) with access to <i>only this repository</i>, permissions <b>Contents: Read and write</b> and <b>Actions: Read and write</b>. Paste it under “Publish to GitHub”. It’s stored only in this browser and never exported — but anyone using this browser profile could read it, so keep the scope that narrow, and set an expiry.</li></ul>

  <p>Video lengths: YouTube usually blocks GitHub’s servers from video pages, so for reliable lengths add a free YouTube Data API key as the repo secret <code>YT_API_KEY</code> (Settings → Secrets and variables → Actions). Without one, items may show no length and the pick falls back to queue order. Until phone–desktop sync (Stage 4), marking something done on one device doesn’t hide it on the other.</p>

  <li class="limit"><b>“Every 3 hours” is approximate.</b> GitHub may delay scheduled runs at busy times. In a <b>public</b> repo, scheduled runs pause after 60 days with no repository activity; re-enable them in the Actions tab (publishing a watchlist edit counts as activity).</li></ul></div>`;

function render(full = true) {
  R = Engine.resolve(new Date(), S);
  renderHeader();
  if (currentView === 'now') renderNow();
  if (morningOpen()) renderMorning();
  if (!full) return;
  ({ tasks: renderTasks, focus: renderFocus, inbox: renderInbox, more: renderMore })[currentView]?.();
}
function go(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + view));
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  render(); scrollTo({ top: 0 });
  if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
}

/** Import a feeds.json (e.g. edited on a computer) as the working watchlist. */
async function importFeeds(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.feeds)) throw new Error('no "feeds" list');
    S.watchlist = d; Watchlist.touch(); render(); toast(`Imported ${d.feeds.length} feeds. Publish to use them.`);
  } catch (e) { toast('Import failed: ' + e.message); }
}
async function importFile(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== 'object' || !d.routine || !Array.isArray(d.tasks)) throw new Error('Not a Daily Command export');
    if (!confirm('Replace current data with this file?')) return;
    S = migrate(d); save(); applyTheme(); render(); toast('Imported.');
  } catch (err) { toast('Import failed: ' + err.message); }
}

/* ---------------- editors ---------------- */
async function editEvent(ev) {
  const now = new Date(), d = ev ? new Date(ev.start) : now;
  const hm = x => fmtT(x);
  const v = await formSheet(ev ? 'Edit event' : 'New event', [
    { name: 'title', label: 'Title', value: ev?.title || '' },
    { name: 'date', label: 'Date', type: 'date', value: Engine.dateKey(d) },
    { name: 'start', label: 'Start', type: 'time', value: ev ? hm(new Date(ev.start)) : hm(new Date(Math.ceil(now / 9e5) * 9e5)) },
    { name: 'end', label: 'End (earlier than start = next day)', type: 'time', value: ev ? hm(new Date(ev.end)) : hm(new Date(Math.ceil(now / 9e5) * 9e5 + 36e5)) },
    { name: 'allDay', label: 'All day', type: 'checkbox', value: ev?.allDay, hint: 'All-day (shown, never overrides)' },
    { name: 'location', label: 'Location (optional)', value: ev?.location || '' },
  ], { deletable: !!ev });
  if (!v) return;
  if (v.__delete) { S.events = S.events.filter(e => e.id !== ev.id); save(); return render(); }
  if (!v.title) return toast('Give it a title.');
  const [y, m, dd] = v.date.split('-').map(Number);
  const sMin = Engine.parseHM(v.start), eMin = Engine.parseHM(v.end);
  const base = new Date(y, m - 1, dd);
  const start = v.allDay ? base : Engine.atDay(base, 0, sMin);
  const end = v.allDay ? Engine.atDay(base, 1) : Engine.atDay(base, eMin > sMin ? 0 : 1, eMin);
  const out = { id: ev?.id || uid(), title: v.title, start: start.toISOString(), end: end.toISOString(), allDay: !!v.allDay, location: v.location, source: 'manual' };
  S.events = S.events.filter(e => e.id !== out.id).concat(out);
  save(); render();
}
async function editBlock(b) {
  const v = await formSheet(b ? 'Edit block' : 'New block', [
    { name: 'name', label: 'Name', value: b?.name || '' },
    { name: 'start', label: 'Start', type: 'time', value: b?.start || '09:00' },
    { name: 'end', label: 'End (earlier than start = past midnight)', type: 'time', value: b?.end || '10:00' },
    { name: 'kind', label: 'Kind', type: 'select', value: b?.kind || 'deep', options: Object.entries(KIND_LABEL).map(([value, label]) => ({ value, label })) },
    { name: 'mode', label: 'Mode', type: 'select', value: b?.mode || 'work', options: Engine.MODES.map(m => ({ value: m, label: MODE_LABEL[m] })) },
  ], { deletable: !!b, note: routineTab === 'weekday' ? 'Applies Monday–Friday.' : 'Applies Saturday & Sunday.' });
  if (!v) return;
  const list = S.routine[routineTab];
  if (v.__delete) S.routine[routineTab] = list.filter(x => x.id !== b.id);
  else {
    if (isNaN(Engine.parseHM(v.start)) || isNaN(Engine.parseHM(v.end)) || v.start === v.end) return toast('Start and end must be valid and different.');
    const nb = { id: b?.id || uid(), name: v.name || KIND_LABEL[v.kind], start: v.start, end: v.end, kind: v.kind, mode: v.mode };
    S.routine[routineTab] = b ? list.map(x => x.id === b.id ? nb : x) : list.concat(nb);
  }
  save(); render();
}
</script>

<script>
/* =====================================================================
   PART 7 — QUICK CAPTURE (text + optional voice)
   ===================================================================== */
function openCapture() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  $('#dlgBody').innerHTML = `<h3>Capture</h3><p class="muted small">Get it out of your head. Sort it tonight.</p>
    <textarea id="capText" placeholder="Idea, task, link, thing to watch…"></textarea>
    ${SR ? `<button class="btn" id="micBtn" style="width:100%;margin-top:8px">🎤 Speak (${S.settings.speechLang})</button>` : '<p class="small muted">Voice input isn’t available in this browser.</p>'}
    <div class="actions"><button class="btn ghost" id="capCancel">Cancel</button><button class="btn primary" id="capSave">Save to inbox</button></div>`;
  const dlg = $('#dlg'); dlg.onclose = null; $('#dlgBody').onclick = null;
  let rec = null;
  const stopRec = () => { try { rec?.stop(); } catch (e) {} rec = null; };
  $('#capCancel').onclick = () => { stopRec(); dlg.close(); };
  $('#capSave').onclick = () => {
    stopRec();
    const text = $('#capText').value.trim();
    if (text) { S.inbox.push({ id: uid(), text, created: Date.now() }); save(); toast('Captured.'); render(); }
    dlg.close();
  };
  if (SR) $('#micBtn').onclick = () => {
    if (rec) return stopRec();
    rec = new SR(); rec.lang = S.settings.speechLang; rec.interimResults = true; rec.continuous = false;
    const before = $('#capText').value;
    rec.onresult = ev => { $('#capText').value = (before ? before + ' ' : '') + [...ev.results].map(r => r[0].transcript).join(''); };
    rec.onerror = ev => toast(ev.error === 'network' ? 'Voice needs a connection.' : 'Voice error: ' + ev.error);
    rec.onend = () => { rec = null; const b = $('#micBtn'); if (b) b.textContent = `🎤 Speak (${S.settings.speechLang})`; };
    rec.start(); $('#micBtn').textContent = '■ Listening… tap to stop';
  };
  dlg.showModal(); setTimeout(() => $('#capText').focus(), 50);
}

/* =====================================================================
   PART 8 — EVENING WRAP-UP (3 steps, ~2 minutes, gentle countdown)
   1. What got done  2. What rolls over (+ sort the inbox)  3. Tomorrow's top 3
   ===================================================================== */
let wrap = null;   // {step, endsAt, roll:Set, tom:[ids]}
function openWrap() {
  const open = top3Ids().filter(id => !taskById(id).done);
  wrap = { step: 1, endsAt: Date.now() + 120000, roll: new Set(open), tom: [] };
  const dlg = $('#dlg'); dlg.onclose = () => { wrap = null; }; $('#dlgBody').onclick = wrapClick;
  renderWrap(); dlg.showModal();
}
function renderWrap() {
  if (!wrap) return;
  const td = today(), doneToday = S.tasks.filter(t => t.done && t.doneAt && Engine.dateKey(Engine.logicalDay(new Date(t.doneAt), S.settings.dayCutoff)) === td);
  const mins = focusMinutes(td), n = todaysSessions().length;
  let h = `<div class="row" style="justify-content:space-between"><h3>Wrap-up · ${wrap.step}/3</h3><span class="num muted" id="wrapClock">${fmtClock(wrap.endsAt - Date.now())}</span></div>`;
  if (wrap.step === 1) {
    h += `<p class="muted">What got done today</p><ul class="list">${doneToday.map(t => `<li class="done"><span class="icon"><span class="chk"></span></span><span class="grow">${esc(t.title)}</span></li>`).join('') || '<li class="empty">Nothing ticked off — that’s data, not a verdict.</li>'}</ul>`;
    const open = top3Ids().filter(id => !taskById(id).done);
    if (open.length) h += `<p class="muted small" style="margin-top:12px">Top 3 still open — tick if actually done:</p><ul class="list">${open.map(id => `<li><button class="icon" data-w="tick" data-id="${id}"><span class="chk"></span></button><span class="grow">${esc(taskById(id).title)}</span></li>`).join('')}</ul>`;
    h += `<div class="math">focus today: ${n} sessions, ${todaysSessions().map(l => l.min).join(' + ') || '0'} = ${mins} min</div>`;
  } else if (wrap.step === 2) {
    const open = top3Ids().filter(id => !taskById(id).done);
    h += `<p class="muted">Rolls over to tomorrow</p><ul class="list">${open.map(id => `<li><button class="icon" data-w="roll" data-id="${id}" aria-label="toggle roll over">${wrap.roll.has(id) ? '↻' : '·'}</button><span class="grow ${wrap.roll.has(id) ? '' : 'muted'}">${esc(taskById(id).title)}</span><span class="tag">${wrap.roll.has(id) ? 'rolls over' : 'drop'}</span></li>`).join('') || '<li class="empty">Top 3 all done (or not set).</li>'}</ul>
      <p class="muted" style="margin-top:14px">Sort the inbox (${S.inbox.length})</p>${inboxHtml()}`;
  } else {
    if (!wrap.tom.length) wrap.tom = [...wrap.roll].slice(0, 3);
    h += `<p class="muted">Tomorrow’s top 3</p>`;
    for (let i = 0; i < 3; i++) {
      const t = taskById(wrap.tom[i]);
      h += t ? `<div class="slot filled"><span class="n">${i + 1}</span><span class="grow">${esc(t.title)}</span><button class="icon" data-w="tomRemove" data-id="${t.id}">✕</button></div>`
        : `<div class="slot" data-w="tomPick"><span class="n">${i + 1}</span><span class="muted">Pick…</span></div>`;
    }
    h += `<form class="row" id="wrapNew"><input type="text" placeholder="…or type a new task"><button class="btn sm">Add</button></form>`;
  }
  h += `<div class="actions">${wrap.step > 1 ? '<button class="btn ghost" data-w="back">Back</button>' : '<button class="btn ghost" data-w="close">Later</button>'}
    <button class="btn primary" data-w="${wrap.step < 3 ? 'next' : 'finish'}">${wrap.step < 3 ? 'Next' : 'Done — good night'}</button></div>`;
  $('#dlgBody').innerHTML = h;
  const f = $('#wrapNew');
  if (f) f.onsubmit = e => {
    e.preventDefault(); const title = f.querySelector('input').value.trim(); if (!title) return;
    if (wrap.tom.length >= 3) return toast('Three is the limit.');
    const pid = S.projects.find(p => p.id === 'p-admin')?.id || S.projects[0]?.id;
    const t = { id: uid(), title, projectId: pid, done: false, created: Date.now() };
    S.tasks.push(t); wrap.tom.push(t.id); save(); renderWrap();
  };
}
async function wrapClick(e) {
  const b = e.target.closest('[data-w]');
  if (!b) { const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a, e); return; }
  const w = b.dataset.w, id = b.dataset.id;
  if (w === 'tick') { const t = taskById(id); t.done = true; t.doneAt = Date.now(); wrap.roll.delete(id); save(); }
  if (w === 'roll') wrap.roll.has(id) ? wrap.roll.delete(id) : wrap.roll.add(id);
  if (w === 'next') wrap.step++;
  if (w === 'back') wrap.step--;
  if (w === 'tomRemove') wrap.tom = wrap.tom.filter(x => x !== id);
  if (w === 'tomPick') {
    const pick = await choose('Tomorrow', S.tasks.filter(t => !t.done && !wrap.tom.includes(t.id)).map(t => ({ value: t.id, label: t.title, tag: projById(t.projectId)?.name })));
    $('#dlg').onclose = () => { wrap = null; }; $('#dlgBody').onclick = wrapClick;
    if (!$('#dlg').open) $('#dlg').showModal();
    if (pick) wrap.tom.push(pick);
  }
  if (w === 'close') { $('#dlg').close(); return; }
  if (w === 'finish') {
    S.top3[tomorrow()] = wrap.tom.slice(0, 3);
    S.wrapups[today()] = { done: S.tasks.filter(t => t.done && t.doneAt && Engine.dateKey(Engine.logicalDay(new Date(t.doneAt), S.settings.dayCutoff)) === today()).map(t => t.id), rolled: [...wrap.roll], at: new Date().toISOString() };
    save(); $('#dlg').close(); toast('Wrapped up. Tomorrow is set.'); render(); return;
  }
  renderWrap();
}

/* =====================================================================
   PART 9 — FIRST-RUN WELCOME
   ===================================================================== */
function openWelcome() {
  const wk = S.routine.weekday.find(b => b.kind === 'wake');
  $('#dlgBody').innerHTML = `<h3>Welcome to Daily Command</h3>
    <p>Open it, see what you’re meant to be doing, do it, come back.</p>
    <ol class="small"><li><b>Now card</b> — one thing to do right now, and what’s next.</li>
    <li><b>+ button</b> — capture any thought in two seconds; sort it tonight.</li>
    <li><b>Wind-down</b> — a 2-minute wrap-up sets tomorrow’s top 3.</li></ol>
    <label class="f">Your first name (optional)</label><input type="text" id="wName" value="${esc(S.settings.name)}">
    <label class="f">Weekday wake-up time</label><input type="time" id="wWake" value="${wk?.start || '07:30'}">
    <label class="f">Theme</label><div class="seg">${['auto', 'dark', 'light', 'sepia'].map(t => `<button data-t="${t}" class="${S.settings.theme === t ? 'on' : ''}">${t}</button>`).join('')}</div>
    <p class="muted small">Everything stays in this browser. Add events and edit your routine under More.</p>
    <div class="actions"><button class="btn primary" id="wGo">Let’s go</button></div>`;
  const dlg = $('#dlg'); dlg.onclose = null;
  $('#dlgBody').onclick = e => {
    const t = e.target.closest('[data-t]');
    if (t) { S.settings.theme = t.dataset.t; applyTheme(); document.querySelectorAll('#dlgBody [data-t]').forEach(b => b.classList.toggle('on', b === t)); }
    if (e.target.id === 'wGo') {
      // shift the wake block (15 min) and start the morning sequence right after it
      const v = $('#wWake').value, m = Engine.parseHM(v);
      if (!isNaN(m) && wk) {
        const hm = x => `${String(Math.floor(x / 60) % 24).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`;
        wk.start = hm(m); wk.end = hm(m + 15);
        const morning = S.routine.weekday.find(b => b.kind === 'morning');
        if (morning) morning.start = wk.end;
      }
      S.settings.name = $('#wName').value.trim();
      S.settings.welcomed = true; save(); dlg.close(); render(); maybeAutoMorning();
    }
  };
  dlg.showModal();
}
</script>

<script>
/* =====================================================================
   PART 10 — BOOT, TICKING, SERVICE WORKER
   ===================================================================== */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
applyTheme();
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', applyTheme);
Pomo.tick();                                   // catch up on anything that ended while closed
const startView = (location.hash || '#now').slice(1);
go(['now', 'tasks', 'focus', 'inbox', 'more'].includes(startView) ? startView : 'now');
if (!S.settings.welcomed) openWelcome();
else maybeAutoMorning();                       // first open of the day → guided morning
Weather.refresh(); Digest.refresh();            // background refresh; cached copies show meanwhile
Watchlist.refresh(); Briefing.refresh();
if (new URLSearchParams(location.search).get('capture')) setTimeout(openCapture, 100);   // home-screen shortcut

// 1s tick: only touches timer text; every 20s a light re-render of header + Now card.
let lastFull = 0;
setInterval(() => {
  if (document.hidden) return;
  if (Pomo.tick()) render();
  const rem = Pomo.remaining();
  const ht = $('#heroTimer'); if (ht && S.pomo.phase !== 'idle') ht.textContent = fmtClock(rem);
  const ft = $('#focusTimer'); if (ft && S.pomo.phase !== 'idle') {
    ft.textContent = fmtClock(rem);
    const arc = $('#ringArc'), C = 2 * Math.PI * 100; if (arc) arc.setAttribute('stroke-dashoffset', C * (rem / (S.pomo.planned * 60000)));
  }
  const dc = $('#dgClock'), ses = S.digestSession;
  if (dc && ses?.endsAt) {
    const left = ses.endsAt - Date.now();
    dc.textContent = left > 0 ? fmtClock(left) : '0:00';
    if (left <= 0 && !dc.classList.contains('over')) render();   // show the "Time's up" banner once
  }
  const wc = $('#wrapClock'); if (wc && wrap) wc.textContent = Date.now() < wrap.endsAt ? fmtClock(wrap.endsAt - Date.now()) : 'time’s up — finish when ready';
  if (Date.now() - lastFull > 20000) {
    lastFull = Date.now();
    // don't re-render under the user's fingers while they're typing or a sheet is open
    const typing = document.activeElement?.matches('input,textarea,select');
    if (!typing && !$('#dlg').open && !morningOpen()) render(currentView === 'now');
  }
}, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  Pomo.tick(); render(); maybeAutoMorning();     // phone left open overnight → next morning still triggers
  Weather.refresh(); if (!C.digest || Date.now() - C.digest.fetchedAt > 30 * 60000) { Digest.refresh(); Watchlist.refresh(); Briefing.refresh(); }
});
addEventListener('online', () => { Weather.refresh(true); Digest.refresh(); });
addEventListener('offline', () => render());
addEventListener('storage', e => { if (e.key === STORE_KEY) { S = load(); render(); } }); // another tab changed data

// Service worker = offline + installable. Shows a toast when a new version is ready.
async function updateSwState() {
  const el = $('#swState'); if (!el) return;
  if (!('serviceWorker' in navigator)) { el.textContent = 'offline cache unsupported'; return; }
  const reg = await navigator.serviceWorker.getRegistration();
  el.textContent = reg?.active ? 'offline ready ✓' : 'offline cache installing…';
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw?.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller)
          toast('New version ready', 'Reload', () => nw.postMessage('skipWaiting'));
      });
    });
  }).catch(err => console.warn('SW registration failed', err));
  // Reload only when an *update* takes over. On the very first visit the new worker
  // also "takes control" (clients.claim) — reloading then would be a pointless jolt.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloading) { reloading = true; location.reload(); }
  });
}
</script>
