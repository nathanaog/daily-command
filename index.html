    if (t.done) toast('Done: ' + t.title, 'Undo', () => { t.done = false; t.doneAt = null; save(); render(); });
  },
  taskDone(el) { ACT.toggleDone(el); },
  async editTask(el) {
    const t = taskById(el.dataset.id); if (!t) return;
    const v = await formSheet('Edit task', [{ name: 'title', label: 'Task', value: t.title },
      { name: 'projectId', label: 'Project', type: 'select', value: t.projectId, options: S.projects.map(p => ({ value: p.id, label: p.name })) },
      ...(Google.on('reminders') && Google.everSignedIn() ? [{ name: 'remind', label: 'Remind me at (optional — your phone will alert you)', type: 'datetime-local', value: '' }] : [])], { deletable: true });
    if (!v) return;
    if (v.__delete) { S.tasks = S.tasks.filter(x => x.id !== t.id); S.projects.forEach(p => { if (p.nextId === t.id) p.nextId = null; }); }
    else Object.assign(t, { title: v.title || t.title, projectId: v.projectId });
    save(); render();
    if (v.remind) {
      try { await Remind.create({ title: '⏰ ' + t.title, at: new Date(v.remind), kind: 'manual', ref: t.id }); toast('Reminder set.'); render(); }
      catch (e) { toast(e.needAuth ? 'Google needs a refresh — tap the chip at the top, then try again.' : 'Couldn’t set reminder: ' + e.message); }
    }
  },
  toggleTop3(el) {
    const ids = (S.top3[today()] ||= []), id = el.dataset.id, i = ids.indexOf(id);
    if (i >= 0) ids.splice(i, 1);
    else if (top3Ids().length >= 3) return toast('Top 3 is full — remove one first.');
    else ids.push(id);
    S.top3[today()] = ids.filter(taskById); save(); render();
  },
  top3Remove(el) { S.top3[today()] = top3Ids().filter(id => id !== el.dataset.id); save(); render(); },
  async top3Pick() {
    const chosen = top3Ids();
    const id = await choose('Pick for today', S.tasks.filter(t => !t.done && !chosen.includes(t.id))
      .map(t => ({ value: t.id, label: t.title, tag: projById(t.projectId)?.name })));
    if (!id) return; S.top3[today()] = [...chosen, id].slice(0, 3); save(); render();
  },
  carryYesterday() {
    const y = Engine.dateKey(Engine.atDay(new Date(today()), -1));
    S.top3[today()] = top3Ids(y).filter(id => !taskById(id).done).slice(0, 3); save(); render();
  },
  setNext(el) { const t = taskById(el.dataset.id), p = projById(t.projectId); p.nextId = p.nextId === t.id ? null : t.id; save(); render(); },
  async addProject() { const v = await formSheet('New project', [{ name: 'name', label: 'Name' }]); if (v?.name) { S.projects.push({ id: uid(), name: v.name, nextId: null }); save(); render(); } },
  async editProject(el) {
    const p = projById(el.dataset.id);
    const v = await formSheet('Project', [{ name: 'name', label: 'Name', value: p.name }], { deletable: true });
    if (!v) return;
    if (v.__delete) return ACT.removeProject(el);
    p.name = v.name || p.name;
    save(); render();
  },
  /** Remove a project, with a confirmation. If it still has tasks you choose:
   *  move them to another project, or delete them along with it. Top-3 slots and
   *  "next action" links to deleted tasks are cleaned up. Undo via the toast. */
  async removeProject(el) {
    const p = projById(el.dataset.id); if (!p) return;
    const mine = S.tasks.filter(t => t.projectId === p.id), open = mine.filter(t => !t.done).length;
    const others = S.projects.filter(x => x.id !== p.id);
    if (!others.length) return toast('Keep at least one project — rename this one instead.');
    const opts = mine.length
      ? [...others.map(o => ({ value: 'move:' + o.id, label: `Remove, move ${mine.length} task${mine.length > 1 ? 's' : ''} to “${o.name}”` })),
         { value: 'delete', label: `Remove and delete its ${mine.length} task${mine.length > 1 ? 's' : ''} (${open} open)` }]
      : [{ value: 'delete', label: `Yes, remove “${p.name}”` }];
    const pick = await choose(`Remove “${p.name}”?`, opts);
    if (!pick) return;
    const before = JSON.stringify({ projects: S.projects, tasks: S.tasks, top3: S.top3 });
    if (pick.startsWith('move:')) { const to = pick.slice(5); mine.forEach(t => { t.projectId = to; }); }
    else {
      const gone = new Set(mine.map(t => t.id));
      S.tasks = S.tasks.filter(t => !gone.has(t.id));
      for (const k in S.top3) S.top3[k] = S.top3[k].filter(id => !gone.has(id));
    }
    S.projects = others;
    save(); render();
    toast(`Removed “${p.name}”.`, 'Undo', () => { Object.assign(S, JSON.parse(before)); save(); render(); });
  },
  toggleShowDone() { showDone = !showDone; render(); },

  // ---- capture & inbox ----
  capture: () => openCapture(),
  async inboxToTask(el) {
    const item = S.inbox.find(i => i.id === el.dataset.id);
    const pid = await choose('Which project?', S.projects.map(p => ({ value: p.id, label: p.name })));

    S.tasks.push({ id: uid(), title: item.text, projectId: pid, done: false, created: Date.now() });

  },
  inboxToWatch(el) {
    const item = S.inbox.find(i => i.id === el.dataset.id);
    const url = (item.text.match(/https?:\/\/\S+/) || [])[0] || '';
    S.watch.push({ id: uid(), title: item.text.replace(url, '').trim() || url, url, created: Date.now() });
    S.inbox = S.inbox.filter(i => i !== item); save(); render(); resumeWrap();
  },
  inboxDelete(el) { S.inbox = S.inbox.filter(i => i.id !== el.dataset.id); save(); render(); resumeWrap(); },
  watchDelete(el) { S.watch = S.watch.filter(i => i.id !== el.dataset.id); save(); render(); },

  // ---- pomodoro ----
  pomoStart() { if (!S.active) setActive(R.current); Pomo.start('work', S.pomo.taskId || R.current.pick?.task.id); askNotifOnce(); render(); FocusAlarm.set(); },
  pomoBreak() { Pomo.start('break'); render(); },
  pomoPause() { Pomo.pause(); render(); FocusAlarm.clear(); },            // paused → the alarm time is wrong, remove it
  pomoResume() { Pomo.resume(); render(); FocusAlarm.set(); },
  pomoStop() { const id = S.pomo.alarmId; Pomo.stop(); render(); FocusAlarm.clear(id); },
  async pomoPickTask() {
    const id = await choose('Attach a task', S.tasks.filter(t => !t.done).map(t => ({ value: t.id, label: t.title, tag: projById(t.projectId)?.name })));
    if (id) { S.pomo.taskId = id; save(); render(); }
  },
  weekPrev() { focusWeekOffset--; render(); },
  weekNext() { if (focusWeekOffset < 0) focusWeekOffset++; render(); },
  logDelete(el) { S.pomoLog = S.pomoLog.filter(l => l.id !== el.dataset.id); save(); render(); },

  // ---- wrap-up ----
  wrapup: () => openWrap(),

  // ---- events ----
  addEvent: () => editEvent(null),
  editEvent: el => editEvent(S.events.find(e => e.id === el.dataset.id)),

  // ---- routine ----
  routineTab(el) { routineTab = el.dataset.tab; render(); },
  editBlock: el => editBlock(S.routine[routineTab].find(b => b.id === el.dataset.id)),
  addBlock: () => editBlock(null),
  copyRoutine() {
    const to = routineTab === 'weekday' ? 'weekend' : 'weekday';
    if (!confirm(`Replace the ${to} routine with a copy of this one?`)) return;
    S.routine[to] = S.routine[routineTab].map(b => ({ ...b, id: uid() })); save(); toast('Copied.');
  },
  resetRoutine() { if (confirm('Reset both routines to the defaults?')) { S.routine = defaultRoutine(); save(); render(); } },

  // ---- settings & data ----
  theme(el) { S.settings.theme = el.dataset.theme; save(); applyTheme(); render(); },
  async notifPerm() { if ('Notification' in window) { await Notification.requestPermission(); render(); } else toast('Notifications not supported here.'); },
  welcome: () => openWelcome(),
  export() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `daily-command-${today()}.json` });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  resetAll() { if (confirm('Erase ALL data in this browser? Export first if unsure.')) { localStorage.removeItem(STORE_KEY); S = defaultState(); S.settings.welcomed = true; save(); render(); } },
};

Object.assign(ACT, ACT2, ACT3, ACT4, ACT5, ACT6, ACT7, ACT8, ACT9);   // + Watch next & player, Spotify (Stage 4.5)   // + Google (Stage 4)   // + listen while working   // Stage 2 (morning, digest, weather) and Stage 3 (lenses, watchlist) actions

function setActive(item) {
  if (!item || !item.end) { S.active = null; return save(); }
  S.active = { id: item.id, title: item.title, plannedEnd: item.end.toISOString(), startedAt: new Date().toISOString() };
  save();
}
let askedNotif = false;
function askNotifOnce() {
  if (askedNotif || !('Notification' in window) || Notification.permission !== 'default') return;
  askedNotif = true;
  toast('Get a notification when focus ends?', 'Allow', () => Notification.requestPermission());
}

document.addEventListener('click', e => {
  const nav = e.target.closest('nav.bottom button'); if (nav) return go(nav.dataset.view);
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
// remember open/closed state of collapsible sections
document.addEventListener('toggle', e => {
  const d = e.target; if (d.matches?.('details[data-sec]')) { S.ui.open[d.dataset.sec] = d.open; save(); }
}, true);
// inline "add task" forms
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form=addTask]'); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'), title = inp.value.trim(); if (!title) return;
  S.tasks.push({ id: uid(), title, projectId: f.dataset.proj, done: false, created: Date.now() });
  save(); render();

// settings inputs (data-setting="key")
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') return importFile(el.files[0]);
  if (el.id === 'feedsFile') return importFeeds(el.files[0]);
  if (el.dataset?.actChange === 'watchLens') { S.ui.watchLens = el.value; save(); return render(); }
  const k = el.dataset?.setting; if (!k) return;
  if (k.startsWith('lens.')) { S.settings.lensByMode = { ...S.settings.lensByMode, [k.slice(5)]: el.value }; save(); return render(); }
  let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
  if (el.type === 'number') { const mn = +el.min, mx = +el.max; v = Math.min(mx, Math.max(mn, v || mn)); }
  S.settings[k] = v; save(); render();
});

/** Import a feeds.json (e.g. edited on a computer) as the working watchlist. */
async function importFeeds(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.feeds)) throw new Error('no "feeds" list');
    S.watchlist = d; Watchlist.touch(); render(); toast(`Imported ${d.feeds.length} feeds. Publish to use them.`);
  } catch (e) { toast('Import failed: ' + e.message); }
}
async function importFile(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== 'object' || !d.routine || !Array.isArray(d.tasks)) throw new Error('Not a Natto App export');
    if (!confirm('Replace current data with this file?')) return;
    S = migrate(d); save(); applyTheme(); render(); toast('Imported.');
  } catch (err) { toast('Import failed: ' + err.message); }
}

/* ---------------- editors ---------------- */
async function editEvent(ev) {
  const now = new Date(), d = ev ? new Date(ev.start) : now;
  const hm = x => fmtT(x);
  const v = await formSheet(ev ? 'Edit event' : 'New event', [
    { name: 'title', label: 'Title', value: ev?.title || '' },
    { name: 'date', label: 'Date', type: 'date', value: Engine.dateKey(d) },
    { name: 'start', label: 'Start', type: 'time', value: ev ? hm(new Date(ev.start)) : hm(new Date(Math.ceil(now / 9e5) * 9e5)) },
    { name: 'end', label: 'End (earlier than start = next day)', type: 'time', value: ev ? hm(new Date(ev.end)) : hm(new Date(Math.ceil(now / 9e5) * 9e5 + 36e5)) },
    { name: 'allDay', label: 'All day', type: 'checkbox', value: ev?.allDay, hint: 'All-day (shown, never overrides)' },
    { name: 'location', label: 'Location (optional)', value: ev?.location || '' },
  ], { deletable: !!ev });
  if (!v) return;
  if (v.__delete) { S.events = S.events.filter(e => e.id !== ev.id); save(); return render(); }
  if (!v.title) return toast('Give it a title.');
  const [y, m, dd] = v.date.split('-').map(Number);
  const sMin = Engine.parseHM(v.start), eMin = Engine.parseHM(v.end);
  const base = new Date(y, m - 1, dd);
  const start = v.allDay ? base : Engine.atDay(base, 0, sMin);
  const end = v.allDay ? Engine.atDay(base, 1) : Engine.atDay(base, eMin > sMin ? 0 : 1, eMin);
  const out = { id: ev?.id || uid(), title: v.title, start: start.toISOString(), end: end.toISOString(), allDay: !!v.allDay, location: v.location, source: 'manual' };
  S.events = S.events.filter(e => e.id !== out.id).concat(out);
  save(); render();
}
async function editBlock(b) {
  const v = await formSheet(b ? 'Edit block' : 'New block', [
    { name: 'name', label: 'Name', value: b?.name || '' },
    { name: 'start', label: 'Start', type: 'time', value: b?.start || '09:00' },
    { name: 'end', label: 'End (earlier than start = past midnight)', type: 'time', value: b?.end || '10:00' },
    { name: 'kind', label: 'Kind', type: 'select', value: b?.kind || 'deep', options: Object.entries(KIND_LABEL).map(([value, label]) => ({ value, label })) },
    { name: 'mode', label: 'Mode', type: 'select', value: b?.mode || 'work', options: Engine.MODES.map(m => ({ value: m, label: MODE_LABEL[m] })) },
  ], { deletable: !!b, note: routineTab === 'weekday' ? 'Applies Monday–Friday.' : 'Applies Saturday & Sunday.' });
  if (!v) return;
  const list = S.routine[routineTab];
  if (v.__delete) S.routine[routineTab] = list.filter(x => x.id !== b.id);
  else {
    if (isNaN(Engine.parseHM(v.start)) || isNaN(Engine.parseHM(v.end)) || v.start === v.end) return toast('Start and end must be valid and different.');
    const nb = { id: b?.id || uid(), name: v.name || KIND_LABEL[v.kind], start: v.start, end: v.end, kind: v.kind, mode: v.mode };
    S.routine[routineTab] = b ? list.map(x => x.id === b.id ? nb : x) : list.concat(nb);
  }
  save(); render();
}

<script>
/* =====================================================================
   PART 7 — QUICK CAPTURE (text + optional voice)
   ===================================================================== */
function openCapture() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  $('#dlgBody').innerHTML = `<h3>Capture</h3><p class="muted small">Get it out of your head. Sort it tonight.</p>
    <textarea id="capText" placeholder="Idea, task, link… or an event: “Drinks with Tom Sat 7pm”"></textarea>
    <div id="qaPrev" class="qaprev hidden"></div>
    ${SR ? `<button class="btn" id="micBtn" style="width:100%;margin-top:8px">🎤 Speak (${S.settings.speechLang})</button>` : '<p class="small muted">Voice input isn’t available in this browser.</p>'}
    <div class="actions"><button class="btn ghost" id="capCancel">Cancel</button><button class="btn primary" id="capSave">Save to inbox</button></div>`;
  const dlg = $('#dlg'); dlg.onclose = null; $('#dlgBody').onclick = null;
  let rec = null;
  const stopRec = () => { try { rec?.stop(); } catch (e) {} rec = null; };
  $('#capCancel').onclick = () => { stopRec(); dlg.close(); };
  $('#capSave').onclick = () => {
    stopRec();
    const text = $('#capText').value.trim();
    if (text) { S.inbox.push({ id: uid(), text, created: Date.now() }); save(); toast('Captured.'); render(); }
    dlg.close();
  };
  // Quick calendar add: if the text has a day/time, show what we understood + a one-tap "Add to calendar"
  let qa = null;
  const qaUpdate = () => {
    qa = QuickAdd.parse($('#capText').value);
    const el = $('#qaPrev'); if (!el) return;
    el.classList.toggle('hidden', !qa);
    if (qa) el.innerHTML = `<div class="small muted">📅 Looks like an event</div><b>${esc(qa.title)}</b> <span class="small">${qaWhen(qa)}</span>
      <div class="actions" style="margin-top:8px"><button class="btn primary sm" id="qaAdd">Add to calendar</button><button class="btn sm ghost" id="qaEdit">Adjust…</button></div>
      <div class="small muted">${QuickCal.canWrite() ? 'Goes straight into your Google Calendar.' : isAndroid() ? 'Opens your calendar app pre-filled. Tap Save there.' : 'Opens Google Calendar pre-filled.'}</div>`;
  };
  $('#capText').oninput = qaUpdate;
  $('#dlgBody').onclick = async e => {             // one handler, replaced on every open (no stacking)
    if (e.target.id === 'qaAdd' && qa) { stopRec(); dlg.close(); await qaCommit(qa); }
    if (e.target.id === 'qaEdit' && qa) { stopRec(); const r = await qaEdit(qa); if (r) await qaCommit(r); }
  };
  if (SR) $('#micBtn').onclick = () => {
    if (rec) return stopRec();
    rec = new SR(); rec.lang = S.settings.speechLang; rec.interimResults = true; rec.continuous = false;
    const before = $('#capText').value;
    rec.onresult = ev => { $('#capText').value = (before ? before + ' ' : '') + [...ev.results].map(r => r[0].transcript).join(''); qaUpdate(); };
    rec.onerror = ev => toast(ev.error === 'network' ? 'Voice needs a connection.' : 'Voice error: ' + ev.error);
    rec.onend = () => { rec = null; const b = $('#micBtn'); if (b) b.textContent = `🎤 Speak (${S.settings.speechLang})`; };
    rec.start(); $('#micBtn').textContent = '■ Listening… tap to stop';
  };
  dlg.showModal(); setTimeout(() => $('#capText').focus(), 50);
}

/* =====================================================================
   PART 8 — EVENING WRAP-UP (3 steps, ~2 minutes, gentle countdown)
   1. What got done  2. What rolls over (+ sort the inbox)  3. Tomorrow's top 3
   ===================================================================== */
let wrap = null;   // {step, endsAt, roll:Set, tom:[ids]}
function openWrap() {
  const open = top3Ids().filter(id => !taskById(id).done);
  wrap = { step: 1, endsAt: Date.now() + 120000, roll: new Set(open), tom: [] };
  resumeWrap();
}
/** (Re)attach the wrap-up to the shared dialog. Pickers (choose/ask) borrow the
 *  same <dialog> and close it; its "close" event arrives a tick later — after we
 *  have already reopened it — so only forget the wrap-up if the dialog is really
 *  closed by then. (Bug fix: picking a task for tomorrow used to freeze the wrap-up.) */
function resumeWrap() {
  if (!wrap) return;
  const dlg = $('#dlg');
  dlg.onclose = () => { if (!dlg.open) wrap = null; };
  $('#dlgBody').onclick = wrapClick;
  if (!dlg.open) dlg.showModal();
  renderWrap();
}
function renderWrap() {
  if (!wrap) return;
  const td = today(), doneToday = S.tasks.filter(t => t.done && t.doneAt && Engine.dateKey(Engine.logicalDay(new Date(t.doneAt), S.settings.dayCutoff)) === td);
  const mins = focusMinutes(td), n = todaysSessions().length;
  let h = `<div class="row" style="justify-content:space-between"><h3>Wrap-up · ${wrap.step}/3</h3><span class="num muted" id="wrapClock">${fmtClock(wrap.endsAt - Date.now())}</span></div>`;
  if (wrap.step === 1) {
    h += `<p class="muted">What got done today</p><ul class="list">${doneToday.map(t => `<li class="done"><span class="icon"><span class="chk"></span></span><span class="grow">${esc(t.title)}</span></li>`).join('') || '<li class="empty">Nothing ticked off — that’s data, not a verdict.</li>'}</ul>`;
    const open = top3Ids().filter(id => !taskById(id).done);
    if (open.length) h += `<p class="muted small" style="margin-top:12px">Top 3 still open — tick if actually done:</p><ul class="list">${open.map(id => `<li><button class="icon" data-w="tick" data-id="${id}"><span class="chk"></span></button><span class="grow">${esc(taskById(id).title)}</span></li>`).join('')}</ul>`;
    h += habitWrapHtml();
    h += `<div class="math">focus today: ${n} sessions, ${todaysSessions().map(l => l.min).join(' + ') || '0'} = ${mins} min</div>`;
  } else if (wrap.step === 2) {
    const open = top3Ids().filter(id => !taskById(id).done);
    h += `<p class="muted">Rolls over to tomorrow</p><ul class="list">${open.map(id => `<li><button class="icon" data-w="roll" data-id="${id}" aria-label="toggle roll over">${wrap.roll.has(id) ? '↻' : '·'}</button><span class="grow ${wrap.roll.has(id) ? '' : 'muted'}">${esc(taskById(id).title)}</span><span class="tag">${wrap.roll.has(id) ? 'rolls over' : 'drop'}</span></li>`).join('') || '<li class="empty">Top 3 all done (or not set).</li>'}</ul>
      <p class="muted" style="margin-top:14px">Sort the inbox (${S.inbox.length})</p>${inboxHtml()}`;
  } else {
    if (!wrap.tom.length) wrap.tom = [...wrap.roll].slice(0, 3);
    h += `<details class="sec" ${eventsOnDay(tomorrow()).length ? 'open' : ''}><summary><span>${tomorrowTitle()}</span>${tomorrowCalBadge()}</summary><div class="body">${tomorrowCalHtml()}</div></details>`;
    h += `<p class="muted">Tomorrow’s top 3</p>`;
    for (let i = 0; i < 3; i++) {
      const t = taskById(wrap.tom[i]);
      h += t ? `<div class="slot filled"><span class="n">${i + 1}</span><span class="grow">${esc(t.title)}</span><button class="icon" data-w="tomRemove" data-id="${t.id}">✕</button></div>`
        : `<div class="slot" data-w="tomPick"><span class="n">${i + 1}</span><span class="muted">Pick…</span></div>`;
    }
    h += `<form class="row" id="wrapNew"><input type="text" placeholder="…or type a new task"><button class="btn sm">Add</button></form>`;
  }
  h += `<div class="actions">${wrap.step > 1 ? '<button class="btn ghost" data-w="back">Back</button>' : '<button class="btn ghost" data-w="close">Later</button>'}
    <button class="btn primary" data-w="${wrap.step < 3 ? 'next' : 'finish'}">${wrap.step < 3 ? 'Next' : 'Done — good night'}</button></div>`;
  $('#dlgBody').innerHTML = h;
  const f = $('#wrapNew');
  if (f) f.onsubmit = e => {
    e.preventDefault(); const title = f.querySelector('input').value.trim(); if (!title) return;
    if (wrap.tom.length >= 3) return toast('Three is the limit.');
    const pid = S.projects.find(p => p.id === 'p-admin')?.id || S.projects[0]?.id;
    const t = { id: uid(), title, projectId: pid, done: false, created: Date.now() };
    S.tasks.push(t); wrap.tom.push(t.id); save(); renderWrap();
  };
}
async function wrapClick(e) {
  const b = e.target.closest('[data-w]');
  if (!b) { const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a, e); return; }
  const w = b.dataset.w, id = b.dataset.id;
  if (w === 'tick') { const t = taskById(id); t.done = true; t.doneAt = Date.now(); wrap.roll.delete(id); save(); }
  if (w === 'roll') wrap.roll.has(id) ? wrap.roll.delete(id) : wrap.roll.add(id);
  if (w === 'next') wrap.step++;
  if (w === 'back') wrap.step--;
  if (w === 'tomRemove') wrap.tom = wrap.tom.filter(x => x !== id);
  if (w === 'tomPick') {
    const pick = await choose('Tomorrow', S.tasks.filter(t => !t.done && !wrap.tom.includes(t.id)).map(t => ({ value: t.id, label: t.title, tag: projById(t.projectId)?.name })));
    if (!wrap) return;
    if (pick) wrap.tom.push(pick);
    return resumeWrap();
  }
  if (w === 'close') { $('#dlg').close(); return; }
  if (w === 'finish') {
    S.top3[tomorrow()] = wrap.tom.slice(0, 3);
    S.wrapups[today()] = { done: S.tasks.filter(t => t.done && t.doneAt && Engine.dateKey(Engine.logicalDay(new Date(t.doneAt), S.settings.dayCutoff)) === today()).map(t => t.id), rolled: [...wrap.roll], at: new Date().toISOString() };
    save(); $('#dlg').close(); toast('Wrapped up. Tomorrow is set.'); render(); return;
  }
  renderWrap();
}

/* =====================================================================
   PART 9 — FIRST-RUN WELCOME
   ===================================================================== */
function openWelcome() {
  const wk = S.routine.weekday.find(b => b.kind === 'wake');
  $('#dlgBody').innerHTML = `<h3>Welcome to The Natto App</h3>
    <p>Open it, see what you’re meant to be doing, do it, come back.</p>
    <ol class="small"><li><b>Now card</b> — one thing to do right now, and what’s next.</li>
    <li><b>+ button</b> — capture any thought in two seconds; sort it tonight.</li>
    <li><b>Wind-down</b> — a 2-minute wrap-up sets tomorrow’s top 3.</li></ol>
    <label class="f">Your first name (optional)</label><input type="text" id="wName" value="${esc(S.settings.name)}">
    <label class="f">Weekday wake-up time</label><input type="time" id="wWake" value="${wk?.start || '07:30'}">
    <label class="f">Theme</label><div class="seg">${['auto', 'dark', 'light', 'sepia'].map(t => `<button data-t="${t}" class="${S.settings.theme === t ? 'on' : ''}">${t}</button>`).join('')}</div>
    <p class="muted small">Everything stays in this browser. Add events and edit your routine under More.</p>
    <div class="actions"><button class="btn primary" id="wGo">Let’s go</button></div>`;
  const dlg = $('#dlg'); dlg.onclose = null;
  $('#dlgBody').onclick = e => {
    const t = e.target.closest('[data-t]');
    if (t) { S.settings.theme = t.dataset.t; applyTheme(); document.querySelectorAll('#dlgBody [data-t]').forEach(b => b.classList.toggle('on', b === t)); }
    if (e.target.id === 'wGo') {
      // shift the wake block (15 min) and start the morning sequence right after it
      const v = $('#wWake').value, m = Engine.parseHM(v);
      if (!isNaN(m) && wk) {
        const hm = x => `${String(Math.floor(x / 60) % 24).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`;
        wk.start = hm(m); wk.end = hm(m + 15);
        const morning = S.routine.weekday.find(b => b.kind === 'morning');
        if (morning) morning.start = wk.end;
      }
      S.settings.name = $('#wName').value.trim();
      S.settings.welcomed = true; save(); dlg.close(); render(); maybeAutoMorning();
    }
  };
  dlg.showModal();
}
</script>

<script>
/* =====================================================================
   PART 10 — BOOT, TICKING, SERVICE WORKER
   ===================================================================== */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
applyTheme();
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', applyTheme);
Pomo.tick();                                   // catch up on anything that ended while closed
const startView = (location.hash || '#now').slice(1);
go(['now', 'tasks', 'focus', 'inbox', 'more'].includes(startView) ? startView : 'now');
Spotify.handleRedirect();                       // finishes a Spotify sign-in if we were just sent back (?code=…)
if (!S.settings.welcomed) openWelcome();
else maybeAutoMorning();                       // first open of the day → guided morning
Weather.refresh(); Digest.refresh();            // background refresh; cached copies show meanwhile
// Stage 4: optional config.json (holds the Google client ID so every device has it), then Google
fetch('config.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).then(cfg => {
  if (cfg && !cfg.offline) { C.config = cfg; saveCache(); }
}).catch(() => {}).finally(() => {
  if (Google.clientId() && navigator.onLine) loadGis().catch(() => {});   // preload so Connect works on the first tap
  Google.refreshAll(true);
});
setInterval(() => { if (!document.hidden) Google.refreshAll(); }, 5 * 60000);
// Spotify: full refresh every 20 min, what's-playing every minute while the Now screen is showing
setTimeout(() => Spotify.refresh(), 1500);
setInterval(() => { if (document.hidden || !Spotify.connected()) return; if (currentView === 'now') Spotify.nowPlaying().then(() => render(true)); Spotify.refresh(); }, 60000);
Watchlist.refresh(); Briefing.refresh();
if (new URLSearchParams(location.search).get('capture')) setTimeout(openCapture, 100);   // home-screen shortcut

// 1s tick: only touches timer text; every 20s a light re-render of header + Now card.
let lastFull = 0;
setInterval(() => {
  if (document.hidden) return;
  if (Pomo.tick()) render();
  const rem = Pomo.remaining();
  const ht = $('#heroTimer'); if (ht && S.pomo.phase !== 'idle') ht.textContent = fmtClock(rem);
  const ft = $('#focusTimer'); if (ft && S.pomo.phase !== 'idle') {
    ft.textContent = fmtClock(rem);
    const arc = $('#ringArc'), C = 2 * Math.PI * 100; if (arc) arc.setAttribute('stroke-dashoffset', C * (rem / (S.pomo.planned * 60000)));
  }
  const dc = $('#dgClock'), ses = S.digestSession;
  if (dc && ses?.endsAt) {
    const left = ses.endsAt - Date.now();
    dc.textContent = left > 0 ? fmtClock(left) : '0:00';
    if (left <= 0 && !dc.classList.contains('over')) render();   // show the "Time's up" banner once
  }
  const wc = $('#wrapClock'); if (wc && wrap) wc.textContent = Date.now() < wrap.endsAt ? fmtClock(wrap.endsAt - Date.now()) : 'time’s up — finish when ready';
  if (Date.now() - lastFull > 20000) {
    lastFull = Date.now();
    // don't re-render under the user's fingers while they're typing or a sheet is open
    const typing = document.activeElement?.matches('input,textarea,select');
    if (!typing && !$('#dlg').open && !morningOpen()) render(currentView === 'now');
  }
}, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  Pomo.tick(); render(); maybeAutoMorning();     // phone left open overnight → next morning still triggers
  Google.refreshAll();                           // quiet if the token has expired or we're offline
  Weather.refresh(); if (!C.digest || Date.now() - C.digest.fetchedAt > 30 * 60000) { Digest.refresh(); Watchlist.refresh(); Briefing.refresh(); }
});
addEventListener('online', () => { Weather.refresh(true); Digest.refresh(); if (Google.clientId()) loadGis().catch(() => {}); Google.refreshAll(true); });
addEventListener('offline', () => render());
addEventListener('storage', e => {
  if (e.key === STORE_KEY) { S = load(); render(); }            // another tab changed data
  if (e.key === SECRET_KEY) { render(); Spotify.refresh(true); }  // e.g. Spotify sign-in finished in a browser tab
});

// Service worker = offline + installable. Shows a toast when a new version is ready.
async function updateSwState() {
  const el = $('#swState'); if (!el) return;
  if (!('serviceWorker' in navigator)) { el.textContent = 'offline cache unsupported'; return; }
  const reg = await navigator.serviceWorker.getRegistration();
  el.textContent = reg?.active ? 'offline ready ✓' : 'offline cache installing…';
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw?.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller)
          toast('New version ready', 'Reload', () => nw.postMessage('skipWaiting'));
      });
    });
  }).catch(err => console.warn('SW registration failed', err));
  // Reload only when an *update* takes over. On the very first visit the new worker
  // also "takes control" (clients.claim) — reloading then would be a pointless jolt.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloading) { reloading = true; location.reload(); }
  });
}
</script>
</body>
</html>
