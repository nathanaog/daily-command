/* ---------------- Morning briefing slot (optional; wire up later) ----------------
   If the repo contains briefing.json ({generated, title, markdown}) or briefing.md,
   e.g. written by an AI step in the workflow, it appears at the top of the morning
   sequence while it's less than 24 h old. Nothing shows if neither file exists. */
const Briefing = {
  lastTry: 0,
  async refresh() {
    // optional file: check at most every 30 min (a missing file is a normal 404, not an error)
    if (Date.now() - this.lastTry < 30 * 60000) return; this.lastTry = Date.now();
    let b = null;
    try {
      const r = await fetch('briefing.json', { cache: 'no-store' });
      if (r.ok) { const j = await r.json(); if (!j.offline && (j.markdown || j.text)) b = { generated: j.generated, title: j.title || 'Morning briefing', md: j.markdown || j.text }; }
      if (!b) {
        const m = await fetch('briefing.md', { cache: 'no-store' });
        if (m.ok && !(m.headers.get('content-type') || '').includes('json')) b = { generated: m.headers.get('last-modified'), title: 'Morning briefing', md: await m.text() };
      }
    } catch (e) {}
    if (b) { C.briefing = { fetchedAt: Date.now(), ...b }; saveCache(); }
    rerenderAll();
  },
  html() {
    const b = C.briefing; if (!b) return '';
    const gen = b.generated ? new Date(b.generated).getTime() : b.fetchedAt;
    if (Date.now() - gen > 24 * 3600e3) return '';
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(b.title)}</h3><span class="small muted">${ago(gen)}</span></div><div class="help">${miniMarkdown(b.md)}</div></div>`;
  },
};
/** Tiny, safe Markdown: headings, bullets, bold, italics, http(s) links. Escapes everything first. */
function miniMarkdown(md) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = '', inList = false;
  for (const line of String(md).split(/\r?\n/)) {
    const li = line.match(/^\s*[-*]\s+(.*)/), hd = line.match(/^(#{1,3})\s+(.*)/);
    if (li) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (hd) out += `<h3>${inline(hd[2])}</h3>`; else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (inList ? '</ul>' : '');
}

/* ---------------- Stage 3 actions ---------------- */
const ACT3 = {
  digestLens(el) { Digest.switchTo(el.dataset.lens, S.digestSession?.types || null); render(); },
  digestType(el) {
    const t = el.dataset.type, cur = new Set(S.digestSession?.types || []);
    cur.has(t) ? cur.delete(t) : cur.add(t);
    Digest.switchTo(S.digestSession?.lens ?? ALL, [...cur]); render();
  },
  feedAdd() { if (!S.watchlist) return toast('Watchlist not loaded yet.'); if (!morningOpen() && currentView !== 'more') { S.ui.open['more-watch'] = true; go('more'); } editFeed(null); },
  feedEdit(el) { editFeed(S.watchlist.feeds.find(f => f.id === el.dataset.id)); },
  freshSnooze() { S.freshSnoozeUntil = new Date(Date.now() + 14 * 864e5).toISOString(); save(); render(); },
  tagGroupsSave() {
    S.watchlist.tagGroups = { genre: parseTags($('#tgGenre').value), activity: parseTags($('#tgActivity').value) };
    Watchlist.touch(); render(); toast('Tag groups saved.');
  },
  wlFilter(el) { wlFilter = el.dataset.tag; render(); },
  wlReload() { Watchlist.refresh(); },
  wlDownload() {
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([Watchlist.json()], { type: 'application/json' })), download: 'feeds.json' });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Downloaded. Upload it to the repo (replace feeds.json) to publish.');
  },
  wlDiscard() {
    if (!Watchlist.remote) return toast('Can’t reach feeds.json right now.');
    if (!confirm('Discard your watchlist edits and go back to the repo’s feeds.json?')) return;
    S.watchlist = Watchlist.remote; S.watchlistDirty = false; save(); render();
  },
  async wlPublish() {
    try { toast('Publishing…'); await GH.publishFeeds(); S.watchlistDirty = false; save(); render(); toast('Published. The digest rebuilds in a few minutes.'); }
    catch (e) { toast('Publish failed: ' + e.message); }
  },
  lensEdit(el) { editLens(el.dataset.lens); },
  lensAdd() { editLens(null); },
  kwSave() {
    const kw = {};
    for (const line of $('#kwText').value.split('\n')) {
      const m = line.match(/^\s*(.+?)\s*(?:=\s*(-?\d+(?:\.\d+)?))?\s*$/); if (!m || !m[1]) continue;
      kw[m[1]] = m[2] != null ? Number(m[2]) : 1;
    }
    S.watchlist.keywords = kw; Watchlist.touch(); render(); toast('Keywords saved (applied at the next digest build).');
  },
  ghSaveToken() { const t = $('#ghToken').value.trim(); if (!t) return toast('Paste a token first.'); setSecret({ ghToken: t }); render(); toast('Token saved in this browser.'); },
  ghForget() { setSecret({ ghToken: '' }); render(); },
  async ghRefresh() { try { await GH.refreshDigest(); toast('Rebuild started — new digest in ~2–5 min.'); } catch (e) { toast('Refresh failed: ' + e.message); } },
};
</script>

<script>
/* =====================================================================
   PART 4d — LISTEN WHILE WORKING
   A queue of audio-friendly videos (feeds tagged "listen", plus anything
   tagged "listen" that you saved to the shelf). During a block, the Now
   screen shows ONE pick that fits the time left in the block, with the
   maths, and a Play button that opens it in the YouTube app on Android
   (background play with YouTube Premium). Per block kind you choose:
     talk  → the Listen queue (default for Admin and Lunch)
     focus → your "focus audio" link, e.g. an instrumental playlist (default for Deep work)
     off   → nothing
   Why the split: speech competes with reading/writing for the same mental
   channel (the "irrelevant speech effect"), so talk suits shallow work better
   than deep work. It's only a default — change it per block kind in More.
   ===================================================================== */
const AUDIO_PLAN_DEFAULT = { deep: 'focus', admin: 'talk', lunch: 'talk' };
const isAndroid = () => /Android/i.test(navigator.userAgent);

/** YouTube links open in the YouTube app on Android (needed for background play);
    everything else, and every link on desktop, opens normally. */
function ytOpenUrl(url) {
  if (!isAndroid()) return url;
  try {
    const u = new URL(url);
    if (u.hostname === 'open.spotify.com')            // Spotify links open the Spotify app
      return `intent://open.spotify.com${u.pathname}${u.search}#Intent;scheme=https;package=com.spotify.music;S.browser_fallback_url=${encodeURIComponent(url)};end`;
    const yt = /(^|\.)youtube\.com$/.test(u.hostname) || u.hostname === 'youtu.be';
    if (!yt) return url;
    const path = u.hostname === 'youtu.be' ? `www.youtube.com/watch?v=${u.pathname.slice(1)}` : `www.youtube.com${u.pathname}${u.search}`;
    return `intent://${path}#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=${encodeURIComponent(url)};end`;
  } catch (e) { return url; }
}
const playAttrs = url => { const h = ytOpenUrl(url); return `href="${esc(h)}"${h.startsWith('intent:') ? '' : ' target="_blank" rel="noopener"'}`; };
const mmss = sec => { const t = Math.round(sec); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };   // never "37:60"

const Listen = {
  plan(kind) { return { ...AUDIO_PLAN_DEFAULT, ...(S.settings.audioPlan || {}) }[kind] || 'off'; },
  /** All listenable items, in priority order: saved-to-shelf first (oldest first), then the digest by score. */
  queue() {
    const skipped = new Set((S.listenSkip || {})[today()] || []);
    const shelf = S.watch.filter(w => (w.tags || []).includes('listen') && w.url)
      .map(w => ({ key: 'w:' + w.id, shelfId: w.id, digestId: w.digestId, title: w.title, url: w.url, source: w.source, durationSec: w.durationSec, from: 'shelf' }));
    const onShelf = new Set(shelf.map(x => x.digestId).filter(Boolean));
    // Anything you can listen to (Lens.howOf): listen-friendly YouTube videos + Spotify podcast episodes
    const canListen = Digest.allItems().filter(it => Lens.howOf({ ...it, tags: Digest.tagsOf(it) }).includes('listen') && !S.digestRead[it.id] && !onShelf.has(it.id))
      .sort((a, b) => ((b.score || 0) - (a.score || 0)) || (new Date(b.published) - new Date(a.published)))
      .map(it => ({ key: 'd:' + it.id, digestId: it.id, title: it.title, url: it.url, source: it.source, durationSec: it.durationSec,
        from: it.type === 'episode' ? 'spotify' : 'digest', uri: it.uri }));
    // alternate Spotify and YouTube so neither crowds the other out
    const sp = canListen.filter(x => x.from === 'spotify'), yt = canListen.filter(x => x.from !== 'spotify'), mixed = [];
    for (let i = 0; i < Math.max(sp.length, yt.length); i++) { if (yt[i]) mixed.push(yt[i]); if (sp[i]) mixed.push(sp[i]); }
    return [...shelf, ...mixed].filter(x => !skipped.has(x.key));
  },
  /** Best pick for `secLeft` seconds, in this order:
        1. the first (by priority) that fits AND fills at least half the time left
        2. else the first that fits
        3. else one with unknown length, else the shortest (and say how much it runs over).
      Returns {item, why} where `why` is the comparison written out. */
  pick(secLeft, label) {
    const q = this.queue(); if (!q.length) return null;
    if (secLeft == null) return { item: q[0], why: '' };
    secLeft = Math.round(secLeft / 60) * 60;                      // whole minutes, as shown
    const left = `${label} ends ${fmtT(new Date(Date.now() + secLeft * 1000))} → ${secLeft / 60} min left`;
    const fits = q.filter(x => x.durationSec && x.durationSec <= secLeft);
    const good = fits.find(x => x.durationSec >= secLeft / 2);
    const fit = good || fits[0];
    if (fit) {
      const pct = Math.round(fit.durationSec / secLeft * 100);
      return { item: fit, why: `${left} · ${mmss(fit.durationSec)} ≤ ${mmss(secLeft)} ✓ fits, fills ${mmss(fit.durationSec)} ÷ ${mmss(secLeft)} = ${pct}%${good ? '' : ' (nothing longer fits)'}` };
    }
    const unknown = q.find(x => !x.durationSec);
    if (unknown) return { item: unknown, why: `${left} · nothing with a known length fits; this one’s length is unknown` };
    const shortest = [...q].sort((a, b) => a.durationSec - b.durationSec)[0];
    return { item: shortest, why: `${left} · shortest is ${mmss(shortest.durationSec)} = ${Math.ceil((shortest.durationSec - secLeft) / 60)} min over` };
  },
  find(key) { return this.queue().find(x => x.key === key) || null; },
  /** Mark finished: read in the digest, and removed from the shelf if it came from there. */
  done(key) {
    const [kind, id] = [key.slice(0, 1), key.slice(2)];
    if (kind === 'w') { const w = S.watch.find(x => x.id === id); if (w?.digestId) S.digestRead[w.digestId] = Date.now(); S.watch = S.watch.filter(x => x.id !== id); }
    else S.digestRead[id] = Date.now();
    if (S.listening?.key === key) S.listening = null;
    save();
  },
};

/** The card under the Now hero. Returns '' when the current block's plan is "off". */
function listenCardHtml() {
  const c = R.current;
  if (c.type !== 'block') return '';               // not during calendar events or free gaps
  const plan = Listen.plan(c.kind);
  const now = Date.now();
  const L = S.listening;
  // something is already playing (started from this device)
  if (L && (plan === 'talk' || L.focus)) {
    const ends = L.durationSec ? L.startedAt + L.durationSec * 1000 : null;
    const finished = ends && now > ends;
    return `<div class="card listen"><div class="row" style="justify-content:space-between"><span class="small muted">🎧 ${finished ? 'Probably finished' : L.spotify ? 'Playing on Spotify' : L.focus ? 'Focus audio on' : 'Playing on YouTube'}</span>
        ${ends ? `<span class="small muted num">${finished ? 'ended ~' + fmtT(new Date(ends)) : 'ends ~' + fmtT(new Date(ends))}</span>` : ''}</div>
      <div style="font-weight:600;margin:4px 0">${esc(L.title)}</div>${L.spotify || L.focus ? nowPlayingHtml(true) : ''}
      <div class="actions">${L.focus ? '<button class="btn sm" data-act="listenStop">Stop</button>' : `<button class="btn sm primary" data-act="listenDone" data-key="${esc(L.key)}">✓ Done${finished ? ' — next' : ''}</button><button class="btn sm" data-act="listenStop">Stop</button>`}</div></div>`;
  }
  if (plan === 'focus') {
    const fa = S.settings.focusAudio;
    const tagged = !fa?.url && Spotify.connected() ? Spotify.playlistsTagged('focus') : [];
    if (tagged.length) {
      const pl = tagged[(S.ui.focusPl || 0) % tagged.length];
      return `<div class="card listen"><div class="row" style="justify-content:space-between"><span class="small muted">🎧 Focus audio · Spotify</span>${nowPlayingHtml()}</div>
        <div style="font-weight:600;margin:4px 0">${esc(pl.name)}</div><div class="small muted">${tagged.length} playlist${tagged.length > 1 ? 's' : ''} tagged “focus”</div>
        <div class="actions"><button class="btn sm primary" data-act="spFocusPlay" data-id="${esc(pl.id)}">▶ Play ${isAndroid() ? '' : 'on phone'}</button>
        ${tagged.length > 1 ? '<button class="btn sm" data-act="spFocusNext">Another</button>' : ''}<button class="btn sm ghost" data-act="audioPlanQuick" data-kind="${c.kind}" data-plan="talk">Talk instead</button></div></div>`;
    }
    if (!fa?.url) return `<div class="card listen"><div class="small muted">🎧 Focus audio for ${esc(KIND_LABEL[c.kind] || 'this block')}</div>
      <div class="small">Instrumental or ambient works best while reading and writing. Set a link once (a YouTube or Spotify playlist), or tag Spotify playlists “focus”.</div>
      <div class="actions"><button class="btn sm" data-act="focusAudioSet">Set focus audio</button><button class="btn sm ghost" data-act="audioPlanQuick" data-kind="${c.kind}" data-plan="talk">Use the talk queue instead</button></div></div>`;
    return `<div class="card listen"><div class="small muted">🎧 Focus audio</div><div style="font-weight:600;margin:4px 0">${esc(fa.label || 'Focus audio')}</div>
      <div class="actions"><a class="btn sm primary" ${playAttrs(fa.url)} data-act="focusPlay">▶ Play</a><button class="btn sm ghost" data-act="audioPlanQuick" data-kind="${c.kind}" data-plan="talk">Talk instead</button></div></div>`;
  }
  if (plan !== 'talk') return '';
  const secLeft = c.end ? Math.max(0, (c.end - now) / 1000) : null;
  const p = Listen.pick(secLeft, c.title);
  if (!p) return `<div class="card listen"><div class="small muted">🎧 Listen queue empty</div><div class="small">Tag feeds “listen” in More → Watchlist, or save listen-tagged videos to the shelf.</div></div>`;
  const it = p.item, n = Listen.queue().length;
  return `<div class="card listen"><div class="row" style="justify-content:space-between"><span class="small muted">🎧 Listen next${it.from === 'shelf' ? ' · from your shelf' : ''}</span><span class="tag">${n} in queue</span></div>
    <div style="font-weight:600;margin:4px 0">${esc(it.title)}</div>
    <div class="small muted">${esc(it.source || '')}${it.durationSec ? ' · ' + mmss(it.durationSec) : ''}</div>
    ${p.why ? `<div class="math">${esc(p.why)}</div>` : ''}
    ${nowPlayingHtml(true)}
    <div class="actions">${it.from === 'spotify' && it.uri
      ? `<button class="btn sm primary" data-act="spPlay" data-key="${esc(it.key)}">▶ Play ${isAndroid() ? 'in Spotify' : 'on phone'}</button>`
      : `<a class="btn sm primary" ${playAttrs(it.url)} data-act="listenPlay" data-key="${esc(it.key)}">▶ Play${isAndroid() ? ' in YouTube' : ''}</a>`}
      <button class="btn sm" data-act="listenSkip" data-key="${esc(it.key)}">Skip</button><button class="btn sm ghost" data-act="go" data-view="inbox">Queue</button></div>
    ${Google.on('youtube') && YTList.url() ? `<div class="actions"><a class="btn sm" ${playAttrs(YTList.url())}>▶ Play the whole Listen playlist</a></div>` : ''}
    ${isAndroid() ? '' : '<div class="small muted" style="margin-top:6px">Listening on your phone? Open the app there — it shows the same queue.</div>'}</div>`;
}

/** "♫ Playing on Spotify: …" (from Spotify's now-playing). */
function nowPlayingHtml(block = false) {
  const n = C.spotify?.now;
  if (!n || !n.playing || Date.now() - n.at > 10 * 60000) return '';
  const t = `♫ ${esc(n.title)}${n.by ? ' · ' + esc(n.by) : ''}`;
  return block ? `<div class="small muted" style="margin-top:4px">${t}</div>` : `<span class="small muted" style="max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t}</span>`;
}
/** Full queue list (Inbox tab). */
function listenQueueHtml() {
  const q = Listen.queue();
  if (!q.length) return '<div class="empty">Nothing to listen to yet. Feeds tagged “listen” fill this up after each digest build.</div>';
  const total = q.filter(x => x.durationSec).reduce((a, x) => a + x.durationSec, 0), known = q.filter(x => x.durationSec).length;
  return `<ul class="list">${q.slice(0, 25).map(x => `<li><span class="grow">${x.from === 'spotify' && x.uri ? `<a href="#" data-act="spPlay" data-key="${esc(x.key)}">🎙 ${esc(x.title)}</a>` : `<a ${playAttrs(x.url)} data-act="listenPlay" data-key="${esc(x.key)}">${esc(x.title)}</a>`}
      <br><span class="small muted">${esc(x.source || '')}${x.durationSec ? ' · ' + mmss(x.durationSec) : ''}${x.from === 'shelf' ? ' · shelf' : ''}</span></span>
      <button class="icon" data-act="listenDone" data-key="${esc(x.key)}" title="Done" aria-label="Done">✓</button></li>`).join('')}</ul>
    ${known ? `<div class="math">${known} with known length: ${q.filter(x => x.durationSec).slice(0, 8).map(x => Math.round(x.durationSec / 60)).join(' + ')}${known > 8 ? ' + …' : ''} ≈ ${Math.round(total / 60)} min of listening</div>` : ''}`;
}

/** Settings section (More). */
function audioSettingsHtml() {
  const kinds = Object.keys(KIND_LABEL).filter(k => !['wake', 'winddown'].includes(k));
  const fa = S.settings.focusAudio || {};
  return `<p class="small muted">What the Now screen suggests in each kind of block. Talk = your Listen queue; Focus = your focus-audio link.</p>
    ${kinds.map(k => `<div class="row" style="min-height:48px"><span style="flex:1">${KIND_LABEL[k]}</span>
      <div class="seg" style="flex:2">${['talk', 'focus', 'off'].map(p => `<button class="${Listen.plan(k) === p ? 'on' : ''}" data-act="audioPlanSet" data-kind="${k}" data-plan="${p}">${p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</div></div>`).join('')}
    <label class="f">Focus audio</label><div class="row"><span class="grow">${fa.url ? `${esc(fa.label || fa.url)}` : '<span class="muted">Not set</span>'}</span><button class="btn sm" data-act="focusAudioSet">${fa.url ? 'Change' : 'Set'}</button></div>
    <p class="small muted">Tag which feeds are good to listen to with the tag <b>listen</b> (More → Watchlist & lenses). ${isAndroid() ? 'Play opens the YouTube app — with Premium it keeps playing with the screen off.' : 'On Android, Play opens the YouTube app (background play needs YouTube Premium).'}</p>`;
}

const ACT4 = {
  listenPlay(el) {
    const it = Listen.find(el.dataset.key); if (!it) return;
    S.listening = { key: it.key, title: it.title, durationSec: it.durationSec || null, startedAt: Date.now() };
    save(); setTimeout(render, 300);                 // let the link open first
  },
  listenDone(el) { Listen.done(el.dataset.key); render(); },
  listenStop() { S.listening = null; save(); render(); },
  listenSkip(el) { (S.listenSkip ||= {}); (S.listenSkip[today()] ||= []).push(el.dataset.key); save(); render(); },
  focusPlay() { const fa = S.settings.focusAudio; S.listening = { key: 'focus', focus: true, title: fa.label || 'Focus audio', durationSec: null, startedAt: Date.now() }; save(); setTimeout(render, 300); },
  async focusAudioSet() {
    const fa = S.settings.focusAudio || {};
    const v = await formSheet('Focus audio', [{ name: 'label', label: 'Name', value: fa.label || '' }, { name: 'url', label: 'Link (YouTube video or playlist, or any audio page)', value: fa.url || '' }],
      { note: 'Instrumental, lo-fi, ambient or classical — anything without talking.', deletable: !!fa.url });
    if (!v) return;
    if (v.__delete) S.settings.focusAudio = null;
    else { if (!/^https?:\/\//.test(v.url)) return toast('Paste a full link (https://…).'); S.settings.focusAudio = { label: v.label, url: v.url }; }
    save(); render();
  },
  audioPlanSet(el) { S.settings.audioPlan = { ...AUDIO_PLAN_DEFAULT, ...(S.settings.audioPlan || {}), [el.dataset.kind]: el.dataset.plan }; save(); render(); },
  audioPlanQuick(el) { ACT4.audioPlanSet(el); toast(`${KIND_LABEL[el.dataset.kind]} blocks now use ${el.dataset.plan}. Change in More → Listening while working.`); },
};
</script>

<script>
/* =====================================================================
   PART 4e — STAGE 4: GOOGLE (sign-in, Calendar, Gmail, reminders,
   Drive sync, optional YouTube Listen playlist)

   HOW SIGN-IN WORKS (no server):
   Google Identity Services gives the browser a short-lived access token
   (1 hour). There is no refresh token in a browser-only app, so when the
   hour is up the header shows "↻ Google"; one tap gets a
   new token (usually without asking again). Everything fetched is cached
   with a "last updated" time, so offline or signed-out you still see the
   last known calendar and inbox.

   PERMISSIONS (each one only if that feature is switched on):
     calendar  → calendar.events.readonly + calendar.calendarlist.readonly  (read your calendars)
     reminders → calendar.app.created  (the app makes ONE calendar called "The Natto App"
                 and can only touch that one — it never edits your real calendars)
     gmail     → gmail.metadata  (labels and headers: unread count, sender, subject — never bodies)
     sync      → drive.appdata  (a hidden app folder in your Drive; can't see your files)
     youtube   → youtube  (optional: keep a private "Natto – Listen" playlist)
   ===================================================================== */
const G_SCOPES = {
  calendar: ['https://www.googleapis.com/auth/calendar.events.readonly', 'https://www.googleapis.com/auth/calendar.calendarlist.readonly'],
  reminders: ['https://www.googleapis.com/auth/calendar.app.created'],
  gmail: ['https://www.googleapis.com/auth/gmail.metadata'],
  sync: ['https://www.googleapis.com/auth/drive.appdata'],
  youtube: ['https://www.googleapis.com/auth/youtube'],
  calwrite: ['https://www.googleapis.com/auth/calendar.events'],   // quick-add: create events in your main calendar
};
const G_LABEL = { calwrite: 'Quick-add events to your calendar', calendar: 'Calendar', reminders: 'Reminders & alarms', gmail: 'Gmail', sync: 'Sync phone ↔ desktop', youtube: 'YouTube Listen playlist' };
const GAPI = { cal: 'https://www.googleapis.com/calendar/v3', gmail: 'https://gmail.googleapis.com/gmail/v1/users/me', drive: 'https://www.googleapis.com/drive/v3', upload: 'https://www.googleapis.com/upload/drive/v3', yt: 'https://www.googleapis.com/youtube/v3' };
const gset = () => S.settings.google;
const gstat = (f, v) => { C.gstat = { ...(C.gstat || {}), [f]: { ...((C.gstat || {})[f] || {}), ...v } }; saveCache(); };

/* ---------------- sign-in ---------------- */
let gisPromise = null;
function loadGis() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  if (gisPromise) return gisPromise;
  gisPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => (window.google?.accounts?.oauth2 ? res() : rej(new Error('Google sign-in script incomplete')));
    s.onerror = () => { gisPromise = null; rej(new Error('Couldn’t load Google sign-in (offline?)')); };
    document.head.appendChild(s);
  });
  return gisPromise;
}
const Google = {
  busy: false, lastRefresh: 0,
  clientId() { return (gset().clientId || C.config?.googleClientId || '').trim(); },
  /** Current token if it has more than a minute left. */
  token() { const t = secret().gToken; return t && t.access_token && t.expires_at > Date.now() + 60000 ? t : null; },
  everSignedIn() { return !!secret().gToken?.scope; },
  granted(f) { const sc = (secret().gToken?.scope || '').split(' '); return G_SCOPES[f].every(x => sc.includes(x)); },
  on(f) { return !!gset().on[f]; },
  ready(f) { return this.on(f) && this.granted(f) && !!this.token(); },
  wantedScopes() { return Object.keys(G_SCOPES).filter(f => this.on(f)).flatMap(f => G_SCOPES[f]); },
  missing() { return Object.keys(G_SCOPES).filter(f => this.on(f) && !this.granted(f)); },
  /** MUST be called straight from a tap (browsers block the sign-in popup otherwise). */
  connect() {
    const id = this.clientId();
    if (!id) { toast('Add your Google client ID first (More → Google account).'); return; }
    if (!navigator.onLine) { toast('You’re offline — connect when you’re back online.'); return; }
    if (!window.google?.accounts?.oauth2) { loadGis().catch(e => toast(e.message)); toast('Loading Google sign-in… tap again in a moment.'); return; }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: id, scope: this.wantedScopes().join(' '), include_granted_scopes: true,
      callback: r => {
        if (r.error) return toast('Google: ' + (r.error_description || r.error));
        setSecret({ gToken: { access_token: r.access_token, expires_at: Date.now() + (Number(r.expires_in) || 3600) * 1000, scope: r.scope || '' } });
        const miss = this.missing();
        if (miss.length) toast('Not allowed: ' + miss.map(f => G_LABEL[f]).join(', ') + '. Turn it off or connect again to allow.');
        else toast('Google connected.');
        this.refreshAll(true);
      },
      error_callback: e => toast(e?.type === 'popup_closed' ? 'Sign-in window closed.' : 'Google sign-in failed: ' + (e?.message || e?.type || 'unknown')),
    });
    client.requestAccessToken({ prompt: '' });
  },
  signOut() {
    const t = secret().gToken?.access_token;
    try { if (t && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(t, () => {}); } catch (e) {}
    setSecret({ gToken: null });
    delete C.gcal; delete C.gmail; delete C.gstat; saveCache();
    try { localStorage.removeItem(SYNC_BASE_KEY); } catch (e) {}
    toast('Signed out of Google. Cached calendar and mail cleared.'); render();
  },
  expire() { const t = secret().gToken; if (t) setSecret({ gToken: { ...t, expires_at: 0 } }); },
  /** fetch() wrapper: adds the token, parses JSON, maps 401 → "needs refresh". */
  async api(url, { method = 'GET', body, raw, contentType } = {}) {
    const t = this.token();
    if (!t) throw Object.assign(new Error('Google needs a refresh'), { needAuth: true });
    const headers = { Authorization: `Bearer ${t.access_token}` };
    let payload;
    if (body !== undefined) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
    else if (raw !== undefined) { headers['Content-Type'] = contentType; payload = raw; }
    const r = await fetch(url, { method, headers, body: payload });
    if (r.status === 401) { this.expire(); throw Object.assign(new Error('Google needs a refresh'), { needAuth: true }); }
    if (r.status === 204) return null;
    const text = await r.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
    if (!r.ok) throw Object.assign(new Error(data?.error?.message || `HTTP ${r.status}`), { status: r.status });
    return data;
  },
  /** Fetch everything that's switched on. Quiet if offline or the token has expired. */
  async refreshAll(force = false) {
    if (this.busy || !navigator.onLine || !this.token()) return render();
    if (!force && Date.now() - this.lastRefresh < 4 * 60000) return;
    this.busy = true; this.lastRefresh = Date.now();
    const run = async (f, fn) => {
      if (!this.ready(f)) return;
      try { await fn(); gstat(f, { at: Date.now(), error: '' }); }
      catch (e) { gstat(f, { error: e.needAuth ? 'needs refresh' : e.message }); }
    };
    await Promise.all([run('calendar', () => Cal.refresh()), run('gmail', () => Mail.refresh())]);
    await run('sync', () => DriveSync.sync());
    await run('reminders', () => Remind.cleanup());
    await run('reminders', () => HabitAlarms.sync());
    await run('youtube', () => YTList.sync());
    this.busy = false; render();
  },
};

/* ---------------- Calendar (read) ---------------- */
const localMidnight = ymd => { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d); };
const Cal = {
  async refresh() {
    const list = await Google.api(`${GAPI.cal}/users/me/calendarList?minAccessRole=reader&fields=items(id,summary,summaryOverride,primary,backgroundColor,selected)`);
    const cals = (list.items || []).filter(c => c.id !== gset().appCalId)
      .map(c => ({ id: c.id, summary: c.summaryOverride || c.summary || c.id, primary: !!c.primary, color: c.backgroundColor || '', shown: c.selected !== false || !!c.primary }));
    const now = new Date(), tMin = Engine.atDay(now, -1).toISOString(), tMax = Engine.atDay(now, 8).toISOString();
    const fields = 'items(id,summary,location,start,end,status,transparency,eventType,attendees(self,responseStatus),htmlLink)';
    const use = cals.filter(c => c.shown);
    const results = await Promise.all(use.map(c => Google.api(`${GAPI.cal}/calendars/${encodeURIComponent(c.id)}/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}&fields=${encodeURIComponent(fields)}`)
      .then(r => (r.items || []).map(e => this.map(e, c)).filter(Boolean))));
    C.gcal = { fetchedAt: Date.now(), calendars: cals, events: results.flat() };
    saveCache();
  },
  /** Google event → the engine's event shape. Cancelled and declined events are dropped. */
  map(e, cal) {
    if (e.status === 'cancelled') return null;
    if ((e.attendees || []).some(a => a.self && a.responseStatus === 'declined')) return null;
    const allDay = !!e.start?.date;
    const start = allDay ? localMidnight(e.start.date) : new Date(e.start?.dateTime);
    const end = allDay ? localMidnight(e.end?.date || e.start.date) : new Date(e.end?.dateTime || e.start?.dateTime);
    if (isNaN(start) || isNaN(end)) return null;
    return { id: `${cal.id}|${e.id}`, calId: cal.id, title: e.summary || '(busy)', start: start.toISOString(), end: end.toISOString(), allDay,
      info: e.transparency === 'transparent' || e.eventType === 'workingLocation',   // shown, never takes over the Now card
      location: e.location || '', source: 'google', calendar: cal.summary, color: cal.color, link: e.htmlLink || '' };
  },
};
/** Manual events + Google events from calendars you haven't hidden in the app. */
function allEvents() {
  const off = new Set(gset().calOff || []);
  return [...S.events, ...((C.gcal?.events) || []).filter(e => !off.has(e.calId)), ...habitEvents()];
}
const engineState = () => ({ ...S, events: allEvents() });

/* ---------------- Gmail (unread count + latest subjects) ---------------- */
const cleanFrom = f => (String(f || '').match(/^\s*"?([^"<]+?)"?\s*</) || [, String(f || '').replace(/<.*>/, '')])[1].trim() || f;
const Mail = {
  async refresh() {
    // gmail.metadata can't use search queries, so unread mail is found by label (INBOX + UNREAD)
    const [inbox, list, profile] = await Promise.all([
      Google.api(`${GAPI.gmail}/labels/INBOX`),
      Google.api(`${GAPI.gmail}/messages?labelIds=INBOX&labelIds=UNREAD&maxResults=5`),
      Google.api(`${GAPI.gmail}/profile`),
    ]);
    const msgs = await Promise.all((list.messages || []).map(m =>
      Google.api(`${GAPI.gmail}/messages/${m.id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&fields=id,threadId,internalDate,payload/headers`)));
    const hdr = (m, n) => (m.payload?.headers || []).find(h => h.name.toLowerCase() === n)?.value || '';
    C.gmail = { fetchedAt: Date.now(), email: profile.emailAddress || '', unread: inbox.messagesUnread ?? 0,
      latest: msgs.map(m => ({ id: m.id, thread: m.threadId, at: Number(m.internalDate) || 0, subject: hdr(m, 'subject') || '(no subject)', from: cleanFrom(hdr(m, 'from')) })) };
    saveCache();
  },
};
function mailHtml(compact = false) {
  const g = C.gmail;
  if (!g) return Google.everSignedIn() ? '<div class="empty">No mail fetched yet.</div>' : '';
  const stale = !navigator.onLine || !Google.token();
  return `<div class="row" style="justify-content:space-between"><b class="num" style="font-size:1.3rem">${g.unread} unread</b>
      <a class="btn sm" href="https://mail.google.com/mail/u/0/#inbox" target="_blank" rel="noopener">Open Gmail</a></div>
    ${g.latest.length ? `<ul class="list">${g.latest.slice(0, compact ? 3 : 5).map(m => `<li><a class="grow" href="https://mail.google.com/mail/u/0/#inbox/${esc(m.thread)}" target="_blank" rel="noopener">
      <b>${esc(m.from)}</b> <span class="small muted">${m.at ? ago(m.at) : ''}</span><br><span class="small">${esc(m.subject)}</span></a></li>`).join('')}</ul>` : '<div class="empty">Inbox zero.</div>'}
    <div class="small muted">${stale ? '⚠ ' : ''}Updated ${ago(g.fetchedAt)}${stale && navigator.onLine ? ' · <a href="#" data-act="gConnect" style="color:inherit">refresh</a>' : ''}</div>`;
}

/* ---------------- Day calendar cards (Today during the day, Tomorrow in the evening) ----------------
   Calendar days here are real midnights (00:00–24:00), anchored on the app's logical day, so at
   00:20 during wind-down "today" is still yesterday's date and "tomorrow" is the coming one. */
function eventsOnDay(ymd) {
  const s = localMidnight(ymd), e = Engine.atDay(s, 1);
  return allEvents().map(x => ({ ...x, s: new Date(x.start), e: new Date(x.end) }))
    .filter(x => x.s < e && x.e > s)                               // overlaps the day (multi-day/overnight included)
    .sort((a, b) => (b.allDay - a.allDay) || (a.s - b.s));
}
const calDot = c => c ? `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${esc(c)};margin-right:6px"></span>` : '';
function evLi(x, cls = '', label = '') {
  return `<li class="${cls}"><span class="num muted small" style="min-width:92px;white-space:nowrap">${x.allDay ? 'all day' : fmtT(x.s) + '–' + fmtT(x.e)}</span>
    <span class="grow">${calDot(x.color)}${esc(x.title)}${label}${x.info && !x.allDay ? ' <span class="tag">free</span>' : ''}${x.location ? ` <span class="small muted">· ${esc(x.location)}</span>` : ''}</span>
    ${x.link ? `<a class="icon" href="${esc(x.link)}" target="_blank" rel="noopener" aria-label="Open in Google Calendar">↗</a>` : ''}</li>`;
}
/** Today: whole day as a list — finished events dimmed, the current one marked "now". */
function todayCalHtml(now = new Date()) {
  const evs = eventsOnDay(today());
  if (!evs.length) return `<div class="empty">Nothing in the calendar today.</div>${calNoteHtml()}`;
  return `<ul class="list">${evs.map(x => x.allDay ? evLi(x)
      : x.e <= now ? evLi(x, 'done')
      : x.s <= now ? evLi(x, '', ` <span class="tag" style="background:var(--accent);color:var(--bg)">now · ${fmtDur(x.e - now)} left</span>`)
      : evLi(x, '', ` <span class="small muted">in ${fmtDur(x.s - now)}</span>`)).join('')}</ul>${calNoteHtml()}`;
}
function todayCalBadge(now = new Date()) {
  const left = eventsOnDay(today()).filter(x => !x.allDay && !x.info && x.e > now).length;
  return `<span class="tag num">${left} left</span>`;
}
/** Tomorrow: just the first few real meetings — start time + duration. All-day items
 *  (working location etc.) and events marked "free" are left out. */
const durLabel = x => fmtDur(x.e - x.s).replace(/ 00m$/, '');
function tomorrowCalHtml(max = 3) {
  const busy = eventsOnDay(tomorrow()).filter(x => !x.allDay && !x.info);
  if (!busy.length) return `<div class="empty">No meetings tomorrow — a clear day.</div>${calNoteHtml()}`;
  return `<ul class="list">${busy.slice(0, max).map(x => `<li><span class="num" style="min-width:56px">${fmtT(x.s)}</span>
      <span class="grow">${calDot(x.color)}${esc(x.title)}</span><span class="tag num">${durLabel(x)}</span>
      ${x.link ? `<a class="icon" href="${esc(x.link)}" target="_blank" rel="noopener" aria-label="Open in Google Calendar">↗</a>` : ''}</li>`).join('')}</ul>
    ${busy.length > max ? `<p class="small muted">+ ${busy.length - max} more later</p>` : ''}${calNoteHtml()}`;
}
function tomorrowCalBadge() {
  const first = eventsOnDay(tomorrow()).find(x => !x.allDay && !x.info);
  return `<span class="tag num">${first ? 'first ' + fmtT(first.s) : 'clear'}</span>`;
}
const tomorrowTitle = () => 'Tomorrow · ' + localMidnight(tomorrow()).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

/** Line under the calendar list in the morning: where events come from and how fresh they are. */
function calNoteHtml() {
  if (!Google.everSignedIn() || !Google.on('calendar')) return '<p class="small muted">Manual events only — connect Google (More → Google account) to see your calendar here.</p>';
  if (!C.gcal) return `<p class="small muted">Google Calendar not fetched yet.${Google.token() ? '' : ' <a href="#" data-act="gConnect" style="color:inherit">Refresh Google</a>'}</p>`;
  const stale = !navigator.onLine || !Google.token();
  return `<p class="small muted">${stale ? '⚠ ' : ''}Google Calendar updated ${ago(C.gcal.fetchedAt)}${!navigator.onLine ? ' (offline)' : !Google.token() ? ' · <a href="#" data-act="gConnect" style="color:inherit">refresh</a>' : ''}.</p>`;
}

/* ---------------- Reminders: events in the app's own "The Natto App" calendar ----------------
   Google Calendar (and Samsung Calendar, which shows Google calendars) notifies you at the event
   time even when this app is closed — the only reliable alarm a web app can set without a server. */
const Remind = {
  async ensureCal() {
    if (gset().appCalId) return gset().appCalId;
    const c = await Google.api(`${GAPI.cal}/calendars`, { method: 'POST',
      body: { summary: 'The Natto App', description: 'Reminders and alarms from The Natto App.', timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone } });
    gset().appCalId = c.id; save(); return c.id;
  },
  url: id => `${GAPI.cal}/calendars/${encodeURIComponent(id)}/events`,
  async create({ title, at, minutes = 5, kind = 'manual', ref = '' }) {
    const body = { summary: title, description: 'Created by The Natto App.',
      start: { dateTime: new Date(at).toISOString() }, end: { dateTime: new Date(+new Date(at) + minutes * 60000).toISOString() },
      reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: 0 }] },
      extendedProperties: { private: { dc: '1', kind, ref: String(ref || '') } } };
    let cal = await this.ensureCal(), ev;
    try { ev = await Google.api(this.url(cal), { method: 'POST', body }); }
    catch (e) {
      if (e.status !== 404) throw e;                      // calendar was deleted in Google: make a new one
      gset().appCalId = null; cal = await this.ensureCal(); ev = await Google.api(this.url(cal), { method: 'POST', body });
    }
    S.reminders.push({ id: ev.id, title, at: new Date(at).toISOString(), kind, ref: String(ref || '') }); save();
    return ev.id;
  },
  async remove(id) {
    const cal = gset().appCalId;
    if (cal) { try { await Google.api(`${this.url(cal)}/${encodeURIComponent(id)}`, { method: 'DELETE' }); } catch (e) { if (![404, 410].includes(e.status)) throw e; } }
    S.reminders = S.reminders.filter(r => r.id !== id); save();
  },
  /** Tidy up: focus/block alarms older than a day, manual reminders older than a week. */
  async cleanup() {
    const now = Date.now();
    const old = S.reminders.filter(r => now - new Date(r.at) > (r.kind === 'manual' ? 7 : 1) * 864e5);
    for (const r of old.slice(0, 20)) await this.remove(r.id);
  },
  upcoming() { return S.reminders.filter(r => new Date(r.at) > Date.now() - 5 * 60000).sort((a, b) => new Date(a.at) - new Date(b.at)); },
};
/** Phone alarm when a focus session ends (so it rings even if the app is closed). */
const FocusAlarm = {
  enabled() { return Google.on('reminders') && gset().focusAlarm; },
  async set() {
    if (!this.enabled() || S.pomo.phase !== 'work') return;
    if (!Google.ready('reminders')) {
      if (Google.everSignedIn()) toast('Phone alarm not set — Google needs a refresh.', 'Refresh', () => Google.connect());
      return;
    }
    await this.clear();
    try {
      const id = await Remind.create({ title: '⏱ Focus session done — take a break', at: S.pomo.endsAt, minutes: 1, kind: 'focus' });
      S.pomo.alarmId = id; save();
    } catch (e) { toast('Couldn’t set the phone alarm: ' + e.message); }
  },
  async clear(id = S.pomo.alarmId) {
    if (S.pomo.alarmId === id) S.pomo.alarmId = null;
    if (!id) return;
    save();
    try { await Remind.remove(id); } catch (e) {}
  },
};
/** Optional: a phone alarm at the start of each remaining routine block today. */
async function setBlockAlarms() {
  if (!Google.ready('reminders')) return toast('Connect Google (with reminders) first.');
  const now = new Date(), day = today();
  for (const r of S.reminders.filter(r => r.kind === 'block' && r.ref === day)) await Remind.remove(r.id);
  const blocks = Engine.blockInstances(S.routine, now).filter(b => b.start > now && b.day === Engine.dateKey(now));
  for (const b of blocks) await Remind.create({ title: `▶ ${b.name}`, at: b.start, minutes: 1, kind: 'block', ref: day });
  toast(`${blocks.length} block alarm${blocks.length === 1 ? '' : 's'} set for today.`); render();
}

/* ---------------- Drive sync (appDataFolder) ---------------- */
const SYNC_BASE_KEY = 'dailycommand.syncbase';
const DriveSync = {
  FILE: 'daily-command-state.json', busy: false, timer: null, again: false,
  base() { try { return JSON.parse(localStorage.getItem(SYNC_BASE_KEY)); } catch (e) { return null; } },
  setBase(s) { try { localStorage.setItem(SYNC_BASE_KEY, JSON.stringify(s)); } catch (e) {} },
  async find() {
    const q = encodeURIComponent(`name='${this.FILE}'`);
    const r = await Google.api(`${GAPI.drive}/files?spaces=appDataFolder&q=${q}&fields=files(id,version,modifiedTime)`);
    return (r.files || [])[0] || null;
  },
  async upload(id, obj) {
    const body = JSON.stringify(obj);
    if (id) return Google.api(`${GAPI.upload}/files/${id}?uploadType=media&fields=id,version`, { method: 'PATCH', raw: body, contentType: 'application/json' });
    const b = 'dc' + Date.now().toString(36);
    const raw = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: this.FILE, parents: ['appDataFolder'] })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
    return Google.api(`${GAPI.upload}/files?uploadType=multipart&fields=id,version`, { method: 'POST', raw, contentType: `multipart/related; boundary=${b}` });
  },
  /** Pull → three-way merge (PART 1b) → apply locally → push if Drive is behind. Retries if Drive changed mid-way. */
  async sync() {
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        const f = await this.find();
        const remote = f ? await Google.api(`${GAPI.drive}/files/${f.id}?alt=media`) : null;
        const res = Sync.mergeStates(this.base(), S, remote && typeof remote === 'object' ? remote : null);
        if (res.changedRemote) {
          const now = f ? await this.find() : null;
          if (f && now && now.version !== f.version) continue;   // the other device just synced: merge again
          await this.upload(f?.id, { ...Sync.shareable(res.state), savedAt: new Date().toISOString() });
        }
        if (res.changedLocal) {
          const ui = S.ui;
          S = migrate({ ...res.state, ui, savedAt: S.savedAt });
          save({ fromSync: true }); applyTheme();
        }
        this.setBase(Sync.shareable(S));
        gstat('sync', { conflicts: res.conflicts, pulled: res.changedLocal, pushed: res.changedRemote });
        break;
      }
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.schedule(1500); }
    }
  },
  /** Called after every local save: sync a few seconds later (batched). */
  schedule(ms = 8000) {
    if (!Google.ready('sync')) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.sync().then(() => render()).catch(e => { gstat('sync', { error: e.needAuth ? 'needs refresh' : e.message }); render(); }), ms);
  },
};
window.dcAfterSave = () => DriveSync.schedule();

/* ---------------- Optional: YouTube "Natto – Listen" playlist ----------------
   Keeps a private playlist holding the top of your Listen queue (default 8). On your phone you
   press play on the playlist once and YouTube runs through it in the background (Premium).
   Quota: adding or removing an item costs 50 of the free 10,000 daily units. */
const ytId = url => (String(url).match(/[?&]v=([\w-]{11})/) || [])[1] || null;
const YTList = {
  async sync() {
    let pid = gset().ytPlaylistId;
    if (!pid) {
      const p = await Google.api(`${GAPI.yt}/playlists?part=snippet,status`, { method: 'POST',
        body: { snippet: { title: 'Natto – Listen', description: 'Kept topped up by The Natto App.' }, status: { privacyStatus: 'private' } } });
      pid = gset().ytPlaylistId = p.id; save();
    }
    let items;
    try { items = await Google.api(`${GAPI.yt}/playlistItems?part=snippet&maxResults=50&playlistId=${encodeURIComponent(pid)}`); }
    catch (e) { if (e.status === 404) { gset().ytPlaylistId = null; save(); return this.sync(); } throw e; }
    const want = Listen.queue().map(x => ytId(x.url)).filter(Boolean).slice(0, gset().ytCount || 8);
    const have = (items.items || []).map(i => ({ item: i.id, vid: i.snippet?.resourceId?.videoId }));
    let removed = 0, added = 0;
    for (const h of have) if (!want.includes(h.vid)) { await Google.api(`${GAPI.yt}/playlistItems?id=${encodeURIComponent(h.item)}`, { method: 'DELETE' }); removed++; }
    for (const v of want) if (!have.some(h => h.vid === v)) {
      await Google.api(`${GAPI.yt}/playlistItems?part=snippet`, { method: 'POST', body: { snippet: { playlistId: pid, resourceId: { kind: 'youtube#video', videoId: v } } } }); added++;
    }
    gstat('youtube', { count: want.length, added, removed });
  },
  url() { return gset().ytPlaylistId ? `https://www.youtube.com/playlist?list=${gset().ytPlaylistId}` : null; },
};
