const WMO = { 0: ['☀️', 'Clear'], 1: ['🌤️', 'Mainly clear'], 2: ['⛅', 'Partly cloudy'], 3: ['☁️', 'Overcast'],
  45: ['🌫️', 'Fog'], 48: ['🌫️', 'Rime fog'], 51: ['🌦️', 'Light drizzle'], 53: ['🌦️', 'Drizzle'], 55: ['🌧️', 'Heavy drizzle'],
  56: ['🌧️', 'Freezing drizzle'], 57: ['🌧️', 'Freezing drizzle'], 61: ['🌦️', 'Light rain'], 63: ['🌧️', 'Rain'], 65: ['🌧️', 'Heavy rain'],
  66: ['🌧️', 'Freezing rain'], 67: ['🌧️', 'Freezing rain'], 71: ['🌨️', 'Light snow'], 73: ['🌨️', 'Snow'], 75: ['❄️', 'Heavy snow'],
  77: ['🌨️', 'Snow grains'], 80: ['🌦️', 'Showers'], 81: ['🌧️', 'Showers'], 82: ['⛈️', 'Violent showers'], 85: ['🌨️', 'Snow showers'],
  86: ['🌨️', 'Snow showers'], 95: ['⛈️', 'Thunderstorm'], 96: ['⛈️', 'Thunder & hail'], 99: ['⛈️', 'Thunder & hail'] };
const wmo = c => WMO[c] || ['🌡️', '—'];

const Weather = {
  loading: false, error: '',
  url: loc => 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon +
    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m' +
    '&hourly=temperature_2m,precipitation_probability,weather_code' +
    '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,weather_code' +
    '&timezone=auto&forecast_days=2',
  /** Fetch unless we have a copy < 30 min old for this location (force = always try). */
  async refresh(force = false) {
    const loc = S.settings.location; if (!loc || this.loading) return;
    const key = `${loc.lat},${loc.lon}`, c = C.weather;
    if (!force && c && c.loc === key && Date.now() - c.fetchedAt < 30 * 60000) return;
    if (!navigator.onLine) { this.error = 'offline'; return rerenderAll(); }
    this.loading = true;
    try {
      const r = await fetch(this.url(loc));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      C.weather = { fetchedAt: Date.now(), loc: key, data: await r.json() }; saveCache(); this.error = '';
    } catch (e) { this.error = navigator.onLine ? 'couldn’t load (' + e.message + ')' : 'offline'; }
    this.loading = false; rerenderAll();
  },
  /** Next 12 hours from the hourly arrays. */
  hours(d) {
    const now = Date.now(), T = d.hourly.time;
    let i0 = T.findIndex(t => new Date(t).getTime() > now - 3600e3); if (i0 < 0) i0 = 0;
    return T.slice(i0, i0 + 12).map((t, k) => ({ t: new Date(t), temp: d.hourly.temperature_2m[i0 + k], rain: d.hourly.precipitation_probability[i0 + k] ?? 0 }))
      .filter(h => h.temp != null);
  },
  /** One-line summary for section headers: "⛅ 12°" */
  short() { const c = C.weather; if (!c) return ''; const cur = c.data.current; return `${wmo(cur.weather_code)[0]} ${Math.round(cur.temperature_2m)}°`; },
  html() {
    const loc = S.settings.location;
    if (!loc) return `<div class="empty">Set a location to see today’s weather.</div>
      <div class="actions"><button class="btn sm" data-act="locGeo">📍 Use my location</button><button class="btn sm" data-act="locSearch">Search a city</button></div>`;
    const c = C.weather;
    if (!c) return `<div class="empty">${this.loading ? 'Loading weather…' : this.error ? 'Weather ' + esc(this.error) + '.' : 'No weather yet.'}</div>
      ${this.loading ? '' : '<div class="actions"><button class="btn sm" data-act="weatherRefresh">Retry</button></div>'}`;
    const d = c.data, cur = d.current, dy = d.daily, [ic, lab] = wmo(cur.weather_code);
    const hrs = this.hours(d);
    const peak = hrs.reduce((a, h) => (h.rain > a.rain ? h : a), hrs[0] || { rain: 0, t: new Date() });
    const stale = Date.now() - c.fetchedAt > 3 * 3600e3;
    return `<div class="wx-now"><span class="wx-ic" aria-hidden="true">${ic}</span>
        <div><span class="wx-t num">${Math.round(cur.temperature_2m)}°</span> <span class="muted">feels ${Math.round(cur.apparent_temperature)}°</span>
        <div>${esc(lab)} · ${esc(loc.name)}</div></div></div>
      <div class="kpi" style="margin-top:10px">
        <div><b class="num">${Math.round(dy.temperature_2m_max[0])}° / ${Math.round(dy.temperature_2m_min[0])}°</b>high / low</div>
        <div><b class="num">${dy.precipitation_probability_max[0] ?? 0}%</b>max rain chance</div>
        <div><b class="num">${fmtT(new Date(dy.sunrise[0]))}–${fmtT(new Date(dy.sunset[0]))}</b>daylight</div></div>
      ${hrs.length ? wxChart(hrs) : ''}
      ${hrs.length ? `<div class="math">rain chance, next ${hrs.length} h: max(${hrs.map(h => h.rain).join(', ')}) = ${peak.rain}% at ${fmtT(peak.t)}${peak.rain >= 50 ? ' → take an umbrella' : ''}</div>` : ''}
      <div class="small muted" style="margin-top:8px">${this.error === 'offline' || !navigator.onLine ? '⚠ Offline — showing last known. ' : ''}${stale ? '⚠ ' : ''}Updated ${ago(c.fetchedAt)}
        · <a href="#" data-act="weatherRefresh" style="color:inherit">refresh</a></div>`;
  },
};
/** Small SVG: temperature line over rain-chance bars, next 12 hours. */
function wxChart(hrs) {
  const W = 340, H = 140, top = 20, tempH = 56, rainTop = 92, rainH = 28, n = hrs.length, step = (W - 8) / n;
  const ts = hrs.map(h => h.temp), lo = Math.min(...ts) - 1, hi = Math.max(...ts) + 1;
  const x = i => 4 + step * i + step / 2, y = t => top + tempH * (1 - (t - lo) / (hi - lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Temperature and rain chance, next hours" style="margin-top:8px">`;
  hrs.forEach((h, i) => {
    const bh = rainH * h.rain / 100;
    s += `<rect x="${x(i) - step * .3}" y="${rainTop + rainH - bh}" width="${step * .6}" height="${Math.max(bh, 1)}" rx="3" fill="var(--m-work)" opacity="${h.rain >= 50 ? .9 : .45}"><title>${fmtT(h.t)}: ${h.rain}% rain</title></rect>`;
    if (h.rain >= 30) s += `<text x="${x(i)}" y="${rainTop + rainH - bh - 3}" text-anchor="middle" font-size="9" fill="var(--muted)">${h.rain}%</text>`;
  });
  s += `<polyline fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-linejoin="round" points="${hrs.map((h, i) => `${x(i)},${y(h.temp)}`).join(' ')}"/>`;
  hrs.forEach((h, i) => {
    s += `<circle cx="${x(i)}" cy="${y(h.temp)}" r="2.6" fill="var(--warn)"><title>${fmtT(h.t)}: ${h.temp}°</title></circle>`;
    if (i % 3 === 0) {
      s += `<text x="${x(i)}" y="${y(h.temp) - 7}" text-anchor="middle" font-size="11" fill="var(--text)">${Math.round(h.temp)}°</text>`;
      s += `<text x="${x(i)}" y="${H - 2}" text-anchor="middle" font-size="10" fill="var(--muted)">${String(h.t.getHours()).padStart(2, '0')}h</text>`;
    }
  });
  return s + `<line x1="0" x2="${W}" y1="${rainTop + rainH}" y2="${rainTop + rainH}" stroke="var(--border)"/></svg>`;
}

/* ---------------- DIGEST (reads digest.json from this same site) ----------------
   digest.json is written every 3 h by the GitHub Action (scripts/build-digest.mjs):
   { generated, watchlistUpdatedAt, stats, feeds:[{id,name,type,status,count,error,http,resolved}],
     items:[{ id, title, url, source, feedId, type:'video'|'post'|'news'|'article', tags:[…],
              published, summary, score, matched:[keywords], why:"physics +2 + fresh +1 = 3", alsoIn? }] }
   LENSES (from your watchlist) pick which tags you want right now, e.g. "Laugh" = comedy +
   standup + cartoon. A reading SESSION freezes the list when it starts (top N by score,
   keyword matches first), so new items can't trickle in mid-read: finite by design. */
const TYPE_LABEL = { video: 'Videos', post: 'Reddit', news: 'News', article: 'Articles' };
const ALL = '__all';
const Digest = {
  loading: false, error: '',
  async refresh() {
    if (this.loading) return; this.loading = true;
    try {
      const r = await fetch('digest.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 404 ? 'no digest.json on the site yet' : 'HTTP ' + r.status);
      const data = await r.json();
      if (data.offline) throw new Error('offline');            // service worker had no cached copy
      if (!Array.isArray(data.items)) throw new Error('digest.json has no items list');
      C.digest = { fetchedAt: Date.now(), data }; saveCache(); this.error = '';
    } catch (e) { this.error = !navigator.onLine || e.message === 'offline' ? 'offline' : e.message; }
    this.loading = false;
    if (S.digestSession?.day === today()) this.ensureSession(false);   // fill a session that started before data arrived
    rerenderAll();
  },
  byId(id) { return (C.digest?.data.items || []).find(i => i.id === id); },
  /** Tags of an item (older/sample digests only have a single "category"). */
  tagsOf: it => (it.tags && it.tags.length ? it.tags : it.category ? [String(it.category).toLowerCase()] : ['other']),
  lenses() { return (S.watchlist && S.watchlist.lenses) || {}; },
  /** Tags in a lens; null = everything. */
  lensTags(lens) { if (!lens || lens === ALL) return null; const t = this.lenses()[lens]; return t ? t.map(x => x.toLowerCase()) : null; },
  /** Default lens: the morning sequence has its own; otherwise it follows the current mode. */
  defaultLens(context) {
    const st = S.settings, want = context === 'morning' ? st.morningLens : (st.lensByMode || {})[R?.mode];
    return want && this.lenses()[want] ? want : ALL;
  },
  /** Candidate items: recent (relative to when the digest was built), unread, in the lens + types. */
  candidates(lens = ALL, types = null, cap = true) {
    const d = C.digest?.data; if (!d) return [];
    // News/posts go stale in hours; videos from weekly channels stay relevant for days (read marks stop repeats)
    const gen = new Date(d.generated || Date.now()).getTime();
    const maxAge = it => (it.type === 'video' ? (S.settings.digestVideoDays || 14) * 864e5 : S.settings.digestHours * 3600e3);
    const lt = this.lensTags(lens);
    const list = d.items.filter(it => !S.digestRead[it.id] && (!it.published || gen - new Date(it.published) <= maxAge(it))
        && (!lt || this.tagsOf(it).some(t => lt.includes(t.toLowerCase())))
        && (!types || !types.length || types.includes(it.type || 'article')))
      .sort((a, b) => ((b.matched || []).length - (a.matched || []).length) || ((b.score || 0) - (a.score || 0)) || (new Date(b.published) - new Date(a.published)));
    return cap ? list.slice(0, S.settings.digestMax) : list;
  },
  /** Keep today's session, or start a fresh one (optionally with a new lens / types). */
  ensureSession(forceNew, opts = {}) {
    const td = today(), ses = S.digestSession;
    if (!forceNew && ses && ses.day === td) {
      if (!ses.built && C.digest) { ses.ids = this.candidates(ses.lens, ses.types).map(i => i.id); ses.built = true; save(); }  // data arrived late
      return ses;
    }
    const lens = opts.lens ?? ses?.lens ?? this.defaultLens(opts.context);
    const types = opts.types ?? null;
    S.digestSession = { day: td, lens, types, ids: this.candidates(lens, types).map(i => i.id), built: !!C.digest,
      startedAt: opts.keepClock ? ses?.startedAt : null, endsAt: opts.keepClock ? ses?.endsAt : null };
    save(); return S.digestSession;
  },
  /** Switch lens/types mid-session: same time-box, new frozen list. */
  switchTo(lens, types) { this.ensureSession(true, { lens, types, keepClock: true }); },
  /** The countdown starts the first time a non-empty list is shown. */
  startClock() {
    const ses = this.ensureSession(false);
    if (!ses.ids.some(id => !S.digestRead[id])) return;          // nothing to read → no countdown
    if (!ses.endsAt) { ses.startedAt = Date.now(); ses.endsAt = Date.now() + S.settings.digestMin * 60000; save(); }
  },
  unreadCount(lens = ALL) { return this.candidates(lens, null, false).length; },
  sessionUnread() { const ses = S.digestSession; return ses && ses.day === today() ? ses.ids.filter(id => !S.digestRead[id] && this.byId(id)).length : 0; },
  mark(id) { S.digestRead[id] = Date.now(); this.prune(); save(); },
  /** Forget read-marks older than 30 days so storage stays small. */
  prune() { const cut = Date.now() - 30 * 864e5; for (const [k, v] of Object.entries(S.digestRead)) if (v < cut) delete S.digestRead[k]; },
  stats() {
    const ses = S.digestSession, ids = ses?.ids || [];
    const saved = ids.filter(id => S.watch.some(w => w.digestId === id)).length;
    return { total: ids.length, saved, read: ids.filter(id => S.digestRead[id]).length - saved };
  },
};
const lensName = l => (!l || l === ALL ? 'Everything' : l);
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);

/** Lens chips (with unread counts) + type chips. */
function lensBar(ses) {
  const lenses = Object.keys(Digest.lenses());
  const chip = (l) => { const n = Digest.unreadCount(l); return `<button class="chip ${ses.lens === l ? 'on' : ''}" data-act="digestLens" data-lens="${esc(l)}" ${!n && ses.lens !== l ? 'style="opacity:.5"' : ''}>${esc(lensName(l))} <span class="num">${n}</span></button>`; };
  const types = ses.types || [];
  // one swipeable row (like the mode chips) so the list itself stays above the fold on a phone
  return `<div class="modes" style="margin:0 0 6px;padding-bottom:2px">${[ALL, ...lenses].map(chip).join('')}</div>
    <div class="modes" style="margin:0 0 10px">${Object.entries(TYPE_LABEL).map(([t, l]) => `<button class="chip ${types.includes(t) ? 'on' : ''}" data-act="digestType" data-type="${t}" style="min-height:32px;font-size:.8rem">${l}</button>`).join('')}</div>`;
}

/** The digest reading UI (used in the morning flow and in stand-alone sessions). */
function digestHtml(context = 'morning') {
  const d = C.digest?.data, ses = Digest.ensureSession(false, { context });
  let h = '';
  if (d?.sample) h += `<div class="banner">Sample digest — your real feeds replace this after the GitHub Action’s first run (see Help → Stage 3 setup).</div>`;
  if (Digest.error && C.digest) h += `<div class="banner">${Digest.error === 'offline' ? '⚠ Offline' : '⚠ ' + esc(Digest.error)} — showing the copy from ${ago(C.digest.fetchedAt)}.</div>`;
  if (d && S.watchlist?.updatedAt && d.watchlistUpdatedAt && new Date(S.watchlist.updatedAt) > new Date(d.watchlistUpdatedAt))
    h += `<div class="banner">Your newest watchlist edits aren’t in this digest yet — it rebuilds a few minutes after you publish.</div>`;
  if (!d) {
    return h + `<div class="empty">${Digest.loading ? 'Loading digest…' : Digest.error === 'offline' ? 'Offline and no saved digest yet.' : 'No digest available' + (Digest.error ? ': ' + esc(Digest.error) : '') + '.'}</div>
      ${Digest.loading ? '' : '<div class="actions"><button class="btn sm" data-act="digestRetry">Retry</button></div>'}`;
  }
  // Freshness, always visible: the service worker may serve a cached digest.json offline without an error.
  h += `<div class="small muted" style="margin-bottom:8px">${!navigator.onLine ? '⚠ Offline · ' : ''}Digest built ${ago(new Date(d.generated).getTime())}${!navigator.onLine ? ' (last known copy)' : ''}${d.stats ? ` · ${d.stats.ok}/${d.stats.feeds} feeds OK` : ''}</div>`;
  h += lensBar(ses);
  const items = ses.ids.map(id => Digest.byId(id)).filter(Boolean);
  const unread = items.filter(i => !S.digestRead[i.id]);
  const st = Digest.stats();
  // ---- caught up: the whole point of the digest ----
  if (!unread.length) {
    const took = ses.startedAt ? Math.max(1, Math.round((Math.min(Date.now(), ses.endsAt || Date.now()) - ses.startedAt) / 60000)) : 0;
    const others = Object.keys(Digest.lenses()).filter(l => l !== ses.lens).map(l => [l, Digest.unreadCount(l)]).filter(([, n]) => n);
    return h + `<div class="caught"><div class="big">✓</div><div class="hello">You’re caught up${ses.lens !== ALL ? ' on ' + esc(lensName(ses.lens)) : ''}</div>
      <p class="muted">${items.length ? `${items.length} items: ${st.read} read + ${st.saved} saved for later${took ? ` · ${took} min` : ''}` : 'Nothing new here since last time.'}</p>
      <p class="small muted">There’s no more. That’s by design.${others.length ? `<br>Elsewhere: ${others.map(([l, n]) => `${esc(l)} ${n}`).join(' · ')}` : ''}</p>
      ${freshPromptHtml(true)}
      ${context === 'standalone' ? '<div class="actions" style="justify-content:center"><button class="btn primary" data-act="closeMorning">Close</button></div>' : ''}</div>`;
  }
  // ---- time's up: stop, without guilt ----
  const timeUp = ses.endsAt && Date.now() >= ses.endsAt;
  if (timeUp) h += `<div class="banner warn"><b>Time’s up.</b> ${unread.length} left — they’ll keep, or let them go.
    <div class="actions"><button class="btn sm" data-act="digestExtend">+5 min</button><button class="btn sm primary" data-act="digestDone">${context === 'morning' ? 'Done — next step' : 'Done'}</button></div></div>`;
  // progress (with the counting shown)
  const done = items.length - unread.length;
  h += `<div class="small muted num">${done} of ${items.length} done · ${unread.length} to go</div><div class="bar"><i style="width:${(done / items.length * 100).toFixed(1)}%"></i></div>`;
  // group by the first of the item's tags that's in this lens (or its first tag for "Everything")
  const lt = Digest.lensTags(ses.lens), groups = {};
  for (const it of unread) {
    const tags = Digest.tagsOf(it), g = (lt ? lt.find(t => tags.map(x => x.toLowerCase()).includes(t)) : tags[0]) || tags[0];
    (groups[g] ||= []).push(it);
  }
  for (const [tag, list] of Object.entries(groups)) {
    h += `<div class="catname">${esc(cap1(tag))} <span class="tag">${list.length}</span></div><ul class="list dg">`;
    for (const it of list) {
      const age = it.published ? ago(new Date(it.published).getTime()) : '';
      h += `<li><div class="grow" style="cursor:default">
          <a href="${esc(it.url)}" target="_blank" rel="noopener" data-act="digestOpen" data-id="${esc(it.id)}">${it.type === 'video' ? '▶ ' : ''}${esc(it.title)}</a>
          <div class="small muted">${esc(it.source || '')}${it.alsoIn ? ' +' + it.alsoIn.length : ''}${age ? ' · ' + age : ''}${it.duration ? ' · ' + esc(it.duration) : ''}${it.score ? ` · <span title="${esc(it.why || '')}">score ${it.score}</span>` : ''}</div>
          ${(it.matched || []).map(k => `<span class="kw">${esc(k)}</span>`).join('')}
          ${it.summary ? `<div class="sum">${esc(it.summary)}</div>` : ''}</div>
        <button class="icon" data-act="digestSave" data-id="${esc(it.id)}" title="Save for later" aria-label="Save for later"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
        <button class="icon" data-act="digestRead" data-id="${esc(it.id)}" title="Mark read" aria-label="Mark read">✓</button></li>`;
    }
    h += `</ul>`;
  }
  h += `<div class="actions"><button class="btn ghost sm" data-act="digestAllRead">Mark all ${unread.length} read</button></div>`;
  return h;
}

/* ---------------- MORNING SEQUENCE (4 steps) ----------------
   1 Today (weather + calendar + plan) · 2 Top 3 · 3 Digest (time-boxed) · 4 Start work */
let overlayMode = 'morning';   // 'morning' | 'digest' (stand-alone digest session)
const STEPS = ['Today', 'Top 3', 'Digest', 'Go'];

function openMorning() {
  const td = today();
  S.morning[td] ||= { startedAt: Date.now(), step: 1 };
  save();
  overlayMode = 'morning';
  $('#morning').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  Weather.refresh(); Digest.refresh();
  render(); $('#morning').scrollTo({ top: 0 });
}
function openDigest() {
  overlayMode = 'digest';
  const ses = Digest.ensureSession(false, { context: 'standalone' });
  // a finished/expired session from earlier today: start a new one with the lens for the current mode
  if (ses.endsAt && (Date.now() >= ses.endsAt || !ses.ids.some(id => !S.digestRead[id]))) Digest.ensureSession(true, { lens: Digest.defaultLens('standalone') });
  Digest.startClock();
  $('#morning').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  Digest.refresh(); render();
}
function closeMorning() { $('#morning').classList.add('hidden'); document.body.style.overflow = ''; render(); }
/** Called at boot and when the app comes back to the foreground. */
function maybeAutoMorning() {
  const st = S.settings, now = new Date(), td = today();
  if (!st.welcomed || !st.morningAuto || S.morning[td] || morningOpen()) return;
  if (now.getHours() < st.dayCutoff) return;                           // 01:30 is still "last night"
  const latest = Engine.parseHM(st.morningLatest);
  if (!isNaN(latest) && now.getHours() * 60 + now.getMinutes() >= latest) return;   // first open was after lunch: don't ambush
  openMorning();
}
const morningDone = () => !!S.morning[today()]?.doneAt;

function renderMorning() {
  const el = $('#morning'); if (!morningOpen()) return;
  const now = new Date();
  // stand-alone digest: just the timer + list
  if (overlayMode === 'digest') {
    const ses = S.digestSession;
    el.innerHTML = `<div class="ov-head"><div><b style="flex:1">Digest</b>${dgClock(ses)}<button class="icon" data-act="closeMorning" aria-label="Close">✕</button></div></div>
      <div class="ov-body">${digestHtml('standalone')}</div>`;
    return;
  }
  const m = S.morning[today()] || { step: 1 }, step = m.step || 1;
  let body = '';
  if (step === 1) {
    const hour = now.getHours(), hi = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const evs = S.events.filter(e => Engine.dateKey(new Date(e.start)) === Engine.dateKey(now) || (e.allDay && new Date(e.start) <= now && new Date(e.end) > now))
      .sort((a, b) => new Date(a.start) - new Date(b.start));
    const plan = Engine.agenda(now, S, 10).filter(a => Engine.dateKey(a.at) === Engine.dateKey(now));
    body = `<div class="hello">${hi}${S.settings.name ? ', ' + esc(S.settings.name) : ''}.</div>
      <div class="muted">${now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
      ${Briefing.html()}
      <div class="card">${Weather.html()}</div>
      <h2>Calendar</h2><div class="card">${evs.length ? `<ul class="list">${evs.map(e => `<li><span class="num muted" style="width:96px">${e.allDay ? 'all day' : fmtT(new Date(e.start)) + '–' + fmtT(new Date(e.end))}</span><span class="grow">${esc(e.title)}${e.location ? ` <span class="small muted">· ${esc(e.location)}</span>` : ''}</span></li>`).join('')}</ul>`
        : '<div class="empty">No events today.</div>'}
        <p class="small muted">Manual events for now — Google Calendar connects in Stage 4.</p></div>
      <h2>The plan</h2><div class="card"><ul class="list">${[R.current, ...plan].filter(x => x && x.type !== 'gap').map(a => `<li><span class="num muted" style="width:96px">${a.at ? fmtT(a.at) : 'now'}</span><span class="grow">${esc(a.title)}${a.type === 'event' ? ' <span class="tag">event</span>' : ''}</span></li>`).join('')}</ul></div>`;
  } else if (step === 2) {
    body = `<div class="hello">Today’s top 3</div><p class="muted">If only three things happen today, which ones?</p>${top3Html(false)}
      <p class="small muted">Tap an empty slot to pick from your tasks. Add new tasks in the Tasks tab or with + later.</p>`;
  } else if (step === 3) {
    Digest.ensureSession(false, { context: 'morning' }); Digest.startClock();
    body = `<div class="hello">Digest</div><p class="muted">${S.settings.digestMin} minutes, then it stops.</p>${digestHtml('morning')}`;
  } else {
    // step 4: ready
    const R0 = Engine.resolve(now, S);
    const pick = R0.current.pick || Engine.pickTask(S, today());
    const nextWork = Engine.blockInstances(S.routine, now).find(b => Engine.WORK_KINDS.has(b.kind) && b.end > now && Engine.dateKey(b.start) === Engine.dateKey(now));
    const st = Digest.stats();
    body = `<div class="hello">Ready.</div>
      <div class="card"><div class="small muted">First up</div><div style="font-size:1.25rem;font-weight:600">${pick ? esc(pick.task.title) : 'No task picked'}</div>
      <div class="muted small">${nextWork ? (nextWork.start <= now ? `${esc(nextWork.name)} is on now` : `${esc(nextWork.name)} starts ${fmtT(nextWork.start)} (in ${fmtDur(nextWork.start - now)}) — starting now switches you to Work mode early`) : 'No work block today — this starts a focus session anyway'}</div></div>
      <div class="kpi" style="margin-top:12px"><div><b class="num">${top3Ids().length}/3</b>top 3 set</div><div><b class="num">${st.read + st.saved}/${st.total}</b>digest done</div><div><b class="num">${S.watch.length}</b>on the shelf</div></div>
      <div class="actions" style="margin-top:22px"><button class="btn primary" data-act="startWork" style="min-height:64px;font-size:1.15rem">▶ Start work · ${S.settings.pomoWork}-min focus</button></div>
      <div class="actions"><button class="btn ghost" data-act="morningFinish" style="flex:1">Not working today — just close</button></div>`;
  }
  const ses = S.digestSession;
  el.innerHTML = `<div class="ov-head"><div><div class="dots" aria-label="Step ${step} of 4">${STEPS.map((_, i) => `<i class="${i < step ? 'on' : ''}"></i>`).join('')}</div>
      ${step === 3 ? dgClock(ses) : `<span class="small muted">${STEPS[step - 1]}</span>`}
      <button class="icon" data-act="morningSkip" aria-label="Close morning sequence">✕</button></div></div>
    <div class="ov-body">${body}</div>
    ${step < 4 ? `<div class="ov-foot"><div>${step > 1 ? '<button class="btn" data-act="morningBack">Back</button>' : ''}
      <button class="btn primary" data-act="morningNext" style="flex:1">${step === 3 ? (Digest.sessionUnread() ? 'Skip the rest' : 'Next') : 'Next'}</button></div></div>` : ''}`;
}
/** "12:41" countdown chip for the digest header. */
function dgClock(ses) {
  if (!ses?.endsAt) return '';
  const left = ses.endsAt - Date.now();
  return `<span class="dgclock num ${left <= 0 ? 'over' : ''}" id="dgClock">${left > 0 ? fmtClock(left) : '0:00'}</span>`;
}

/* ---------------- Stage 2 actions (merged into ACT below) ---------------- */
const ACT2 = {
  morning() { if (R.current.type === 'block') setActive(R.current); openMorning(); },
  morningNext() { const m = S.morning[today()]; m.step = Math.min(4, (m.step || 1) + 1); save(); render(); $('#morning').scrollTo({ top: 0 }); },
  morningBack() { const m = S.morning[today()]; m.step = Math.max(1, (m.step || 1) - 1); save(); render(); $('#morning').scrollTo({ top: 0 }); },
  morningSkip() { const m = S.morning[today()]; if (m && !m.doneAt) m.skipped = true; save(); closeMorning(); },
  morningFinish() { S.morning[today()].doneAt = Date.now(); S.active = null; save(); closeMorning(); go('now'); },
  closeMorning() { closeMorning(); },
  /** "Start work": finish the morning, switch to Work, start the first Pomodoro. */
  startWork() {
    const now = new Date();
    S.morning[today()].doneAt = Date.now(); S.active = null;
    const R0 = Engine.resolve(now, S);
    if (!Engine.WORK_KINDS.has(R0.current.kind)) {
      // Not in a work block yet: manual Work mode until the next work block begins (auto takes over from
      // there), capped at 2 h so a weekend "start work" doesn't stick all day.
      const nb = Engine.blockInstances(S.routine, now).find(b => Engine.WORK_KINDS.has(b.kind) && b.start > now);
      const until = nb && nb.start - now <= 2 * 3600e3 ? nb.start : new Date(now.getTime() + 2 * 3600e3);
      S.modeOverride = { mode: 'work', until: until.toISOString() };
    }
    const R1 = Engine.resolve(now, S);
    if (R1.current.type === 'block' && Engine.WORK_KINDS.has(R1.current.kind)) setActive(R1.current);
    Pomo.start('work', R1.current.pick?.task.id || null);
    save(); closeMorning(); go('now'); askNotifOnce();
  },
  // digest
  digestOpen(el) { Digest.mark(el.dataset.id); setTimeout(render, 400); },     // let the link open first
  digestRead(el) { Digest.mark(el.dataset.id); render(); },
  digestSave(el) {
    const it = Digest.byId(el.dataset.id); if (!it) return;
    if (!S.watch.some(w => w.digestId === it.id))
      S.watch.push({ id: uid(), digestId: it.id, title: it.title, url: it.url, source: it.source, category: it.category, type: it.type, duration: it.duration,
        durationSec: it.durationSec, tags: Digest.tagsOf(it), created: Date.now() });
    Digest.mark(it.id); toast('Saved to the watch-later shelf'); render();
  },
  digestAllRead() { S.digestSession.ids.forEach(id => { if (!S.digestRead[id]) S.digestRead[id] = Date.now(); }); save(); render(); },
  digestExtend() { S.digestSession.endsAt = Date.now() + 5 * 60000; S.digestSession.extra = (S.digestSession.extra || 0) + 5; save(); render(); },
  digestDone() { if (overlayMode === 'morning') ACT2.morningNext(); else closeMorning(); },
  digestRetry() { Digest.refresh(); },
  digestStart() { openDigest(); },
  // weather & location
  weatherRefresh(el, e) { e?.preventDefault(); Weather.refresh(true); },
  locGeo() {
    if (!navigator.geolocation) return toast('Location isn’t available here — search a city instead.');
    toast('Getting your location…');
    navigator.geolocation.getCurrentPosition(pos => {
      S.settings.location = { name: 'My location', lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3) };
      save(); Weather.refresh(true);
    }, err => toast('Location failed: ' + err.message), { timeout: 15000, maximumAge: 3600e3 });
  },
  async locSearch() {
    const v = await formSheet('Weather location', [{ name: 'q', label: 'City or postcode', value: '' }], { okLabel: 'Search' });
    if (!v?.q) return;
    try {
      const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name=' + encodeURIComponent(v.q));
      const res = (await r.json()).results || [];
      const pick = await choose('Which one?', res.map(x => ({ value: x, label: [x.name, x.admin1, x.country].filter(Boolean).join(', ') })));
      if (!pick) return;
      S.settings.location = { name: pick.name, lat: pick.latitude, lon: pick.longitude };
      save(); Weather.refresh(true);
    } catch (e) { toast(navigator.onLine ? 'Search failed: ' + e.message : 'You’re offline — try again later.'); }
  },
  watchDone(el) { S.watch = S.watch.filter(i => i.id !== el.dataset.id); save(); render(); },
};
</script>

<script>
/* =====================================================================
   PART 4c — STAGE 3: WATCHLIST, FEED HEALTH, PUBLISHING, FRESH-CONTENT
   PROMPT, MORNING-BRIEFING SLOT

   Where the watchlist lives:
     • feeds.json in your GitHub repo is what the Action reads.
     • S.watchlist is the app's working copy (part of your data/backups).
     • Edit here → "Publish" writes feeds.json to GitHub with your token
       (or "Download" and upload it yourself) → the push triggers the Action
       → a fresh digest.json a few minutes later.
   ===================================================================== */
const SECRET_KEY = 'dailycommand.secret';   // GitHub token: kept OUT of exports and sync on purpose
const secret = () => { try { return JSON.parse(localStorage.getItem(SECRET_KEY)) || {}; } catch (e) { return {}; } };
const setSecret = o => { try { localStorage.setItem(SECRET_KEY, JSON.stringify({ ...secret(), ...o })); } catch (e) {} };
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const FEED_TYPES = { youtube: 'YouTube channel', reddit: 'Subreddit', googlenews: 'Google News search', rss: 'RSS / blog URL' };
const FEED_ICON = { youtube: '▶', reddit: 'r/', googlenews: 'N', rss: '✎' };

const Watchlist = {
  remote: null, error: '',
  /** Load feeds.json from the site; adopt it unless we have unpublished local edits. */
  async refresh() {
    try {
      const r = await fetch('feeds.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const doc = await r.json(); if (doc.offline || !Array.isArray(doc.feeds)) throw new Error('offline');
      this.remote = doc; this.error = '';
      const local = S.watchlist;
      if (!local) { S.watchlist = doc; S.watchlistDirty = false; save(); }
      else if (!S.watchlistDirty && new Date(doc.updatedAt || 0) > new Date(local.updatedAt || 0)) { S.watchlist = doc; save(); }
    } catch (e) { this.error = e.message; }
    rerenderAll();
  },
  /** Remote changed after our local edits started (e.g. edited on the other device). */
  conflict() { return S.watchlistDirty && this.remote && new Date(this.remote.updatedAt || 0) > new Date(S.watchlistBase || 0); },
  touch() {
    if (!S.watchlistDirty) S.watchlistBase = S.watchlist.updatedAt || null;
    S.watchlist.updatedAt = new Date().toISOString(); S.watchlistDirty = true; save();
  },
  tags() {
    const count = {};
    (S.watchlist?.feeds || []).forEach(f => (f.tags || []).forEach(t => { count[t] = (count[t] || 0) + 1; }));
    return Object.entries(count).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  },
  health(id) { return (C.digest?.data.feeds || []).find(f => f.id === id) || null; },
  json() { return JSON.stringify(S.watchlist, null, 2) + '\n'; },
};

/* ---------------- GitHub (optional): publish feeds.json, trigger a rebuild ----------------
   Uses a fine-grained personal access token limited to ONE repository with
   "Contents: Read and write" (+ "Actions: Read and write" for "Refresh now").
   The token is stored only in this browser and never exported or synced. */
const GH = {
  ready() { return !!(S.settings.ghRepo && secret().ghToken); },
  async call(path, opts = {}) {
    const r = await fetch(`https://api.github.com/repos/${S.settings.ghRepo}${path}`, { ...opts,
      headers: { Authorization: `Bearer ${secret().ghToken}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (!r.ok && r.status !== 404) {
      let msg = ''; try { msg = (await r.json()).message; } catch (e) {}
      throw new Error(r.status === 401 ? 'token rejected (401) — check or renew it' : r.status === 403 ? 'not allowed (403) — the token needs Contents: read & write on this repo' : `${r.status} ${msg}`);
    }
    return r;
  },
  async publishFeeds() {
    const branch = S.settings.ghBranch || 'main';
    const cur = await this.call(`/contents/feeds.json?ref=${encodeURIComponent(branch)}`);
    const sha = cur.status === 404 ? undefined : (await cur.json()).sha;
    const bytes = new TextEncoder().encode(Watchlist.json());
    let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
    await this.call('/contents/feeds.json', { method: 'PUT', body: JSON.stringify({ message: 'watchlist: update from the app', content: btoa(bin), sha, branch }) });
  },
  async refreshDigest() {
    const r = await this.call('/actions/workflows/digest.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: S.settings.ghBranch || 'main' }) });
    if (r.status === 404) throw new Error('workflow not found — is .github/workflows/digest.yml in the repo?');
  },
};

/* ---------------- "Add something fresh" prompt ----------------
   If the newest feed in your watchlist was added more than N days ago (default 30),
   gently suggest adding something new. Snooze-able. The subtraction is shown. */
function freshDue() {
  const days = S.settings.freshDays, feeds = S.watchlist?.feeds || [];
  if (!days || !feeds.length) return null;
  if (S.freshSnoozeUntil && Date.now() < new Date(S.freshSnoozeUntil)) return null;
  const dated = feeds.filter(f => /^\d{4}-\d{2}-\d{2}/.test(f.added || '')).sort((a, b) => b.added.localeCompare(a.added));
  if (!dated.length) return null;
  const last = dated[0], [y, m, d] = last.added.slice(0, 10).split('-').map(Number);
  const lastDay = new Date(y, m - 1, d), td = new Date(today());
  const age = Math.round((td - lastDay) / 864e5);               // whole days, DST-safe via rounding
  return age >= days ? { age, days, last, lastDay, td } : null;
}
function freshPromptHtml(compact = false) {
  const f = freshDue(); if (!f) return '';
  const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `<div class="card" style="text-align:left${compact ? ';margin-top:18px' : ''}"><h3>Time for something new?</h3>
    <p class="small muted">Nothing’s been added to your watchlist for ${f.age} days (last: ${esc(f.last.name)}). A new channel, subreddit or news topic keeps the digest from going stale.</p>
    <div class="math">${fmt(f.td)} − ${fmt(f.lastDay)} = ${f.age} days ≥ ${f.days}-day reminder</div>
    <div class="actions"><button class="btn sm primary" data-act="feedAdd">+ Add a feed</button><button class="btn sm" data-act="freshSnooze">Snooze 2 weeks</button></div></div>`;
}

/* ---------------- Watchlist editor (More → Watchlist & lenses) ---------------- */
let wlFilter = '';
function watchlistHtml() {
  const W = S.watchlist;
  if (!W) return `<div class="empty">${Watchlist.error ? 'Couldn’t load feeds.json (' + esc(Watchlist.error) + ').' : 'Loading feeds.json…'}</div>
    <div class="actions"><button class="btn sm" data-act="wlReload">Retry</button><label class="btn sm">Import feeds.json<input type="file" accept=".json,application/json" id="feedsFile" hidden></label></div>`;
  const feeds = W.feeds || [];
  const checks = feeds.filter(f => f.check).length;
  const probs = feeds.filter(f => { const hh = Watchlist.health(f.id); return hh && hh.status !== 'ok'; }).length;
  const d = C.digest?.data;
  let h = freshPromptHtml();
  h += `<div class="kpi"><div><b class="num">${feeds.length}</b>feeds</div><div><b class="num">${checks}</b>to check</div><div><b class="num">${probs}</b>problems</div></div>
    <p class="small muted">${d && !d.sample ? `Last digest ${ago(new Date(d.generated).getTime())}: ${d.stats?.ok ?? '?'}/${d.stats?.feeds ?? '?'} feeds OK.` : 'Feed health appears after the GitHub Action’s first run.'}</p>`;
  if (S.watchlistDirty) h += `<div class="banner warn"><b>Unpublished changes.</b> The digest uses the repo’s feeds.json, so publish (or download and upload) your edits.
      ${Watchlist.conflict() ? '<br>⚠ feeds.json in the repo also changed since you started editing — publishing will overwrite it.' : ''}
      <div class="actions">${GH.ready() ? '<button class="btn sm primary" data-act="wlPublish">Publish to GitHub</button>' : ''}<button class="btn sm" data-act="wlDownload">Download feeds.json</button><button class="btn sm ghost" data-act="wlDiscard">Discard edits</button></div></div>`;
  // tag filter
  const tags = Watchlist.tags();
  h += `<div class="modes" style="flex-wrap:wrap;margin:8px 0"><button class="chip ${!wlFilter ? 'on' : ''}" data-act="wlFilter" data-tag="">All ${feeds.length}</button>
    <button class="chip ${wlFilter === '__check' ? 'on' : ''}" data-act="wlFilter" data-tag="__check">To check ${checks}</button>
    <button class="chip ${wlFilter === '__prob' ? 'on' : ''}" data-act="wlFilter" data-tag="__prob">Problems ${probs}</button>
    ${tags.map(([t, n]) => `<button class="chip ${wlFilter === t ? 'on' : ''}" data-act="wlFilter" data-tag="${esc(t)}">${esc(t)} ${n}</button>`).join('')}</div>`;
  const shown = feeds.filter(f => !wlFilter || (wlFilter === '__check' ? f.check : wlFilter === '__prob' ? (Watchlist.health(f.id)?.status || 'ok') !== 'ok' : (f.tags || []).includes(wlFilter)))
    .sort((a, b) => a.name.localeCompare(b.name));
  h += `<ul class="list">${shown.map(f => {
    const hh = Watchlist.health(f.id);
    const st = !hh ? '<span class="muted">not fetched yet</span>'
      : hh.status === 'ok' ? `✓ ${hh.count} recent${hh.resolved && hh.resolved.via === 'name search' ? ` · found “${esc(hh.resolved.title)}”` : ''}`
      : hh.status === 'unresolved' ? `<span class="warnchip">? ${esc(hh.error || 'not found')} — add its @handle or link</span>`
      : `<span class="warnchip">⚠ ${esc(hh.error || hh.status)}</span>`;
    return `<li><span class="tag" style="width:30px;text-align:center">${FEED_ICON[f.type] || '•'}</span><span class="grow" data-act="feedEdit" data-id="${esc(f.id)}">
      <b>${esc(f.name)}</b>${f.paused ? ' <span class="tag">paused</span>' : ''}<br>
      <span class="small">${(f.tags || []).map(t => `<span class="kw">${esc(t)}</span>`).join('') || '<span class="muted">no tags</span>'}</span>
      <br><span class="small muted">${st}</span>${f.check ? `<br><span class="small warnchip">Check: ${esc(f.check)}</span>` : ''}</span></li>`;
  }).join('') || '<li class="empty">Nothing here.</li>'}</ul>
  <div class="actions"><button class="btn primary" data-act="feedAdd">+ Add feed</button>
    <button class="btn sm" data-act="wlDownload">Download feeds.json</button>
    <label class="btn sm">Import<input type="file" accept=".json,application/json" id="feedsFile" hidden></label></div>`;

  // lenses
  const lenses = Object.entries(W.lenses || {});
  h += `<h3 style="margin-top:18px">Lenses</h3><p class="small muted">A lens is a mix of tags for a mood. Pick one at the top of the digest.</p>
    <ul class="list">${lenses.map(([n, t]) => `<li><span class="grow" data-act="lensEdit" data-lens="${esc(n)}"><b>${esc(n)}</b><br><span class="small muted">${t.map(esc).join(', ')}</span></span><span class="tag num">${Digest.unreadCount(n)} new</span></li>`).join('')}</ul>
    <div class="actions"><button class="btn sm" data-act="lensAdd">+ Lens</button></div>
    <label class="f">Morning sequence uses</label>${lensSelect('morningLens', S.settings.morningLens)}
    <div class="row">${['work', 'life', 'leisure', 'winddown'].map(m => `<label class="f" style="flex:1">${MODE_LABEL[m]}${lensSelect('lens.' + m, (S.settings.lensByMode || {})[m])}</label>`).join('')}</div>`;

  // keywords
  const kw = Object.entries(W.keywords || {}).map(([k, v]) => `${k} = ${v}`).join('\n');
  h += `<h3 style="margin-top:18px">Keyword boosts</h3><p class="small muted">One per line, “word = weight”. Matches float to the top; the digest shows the sum (e.g. “physics +2 + fresh +1 = 3”).</p>
    <textarea id="kwText" style="min-height:90px">${esc(kw)}</textarea><div class="actions"><button class="btn sm" data-act="kwSave">Save keywords</button></div>`;

  // reminder + GitHub
  h += `<div class="row" style="margin-top:14px"><label class="f" style="flex:1">Remind me to add something new after (days, 0 = off)<input type="number" min="0" max="365" value="${S.settings.freshDays}" data-setting="freshDays"></label></div>
    <h3 style="margin-top:18px">Publish to GitHub (optional)</h3>
    <p class="small muted">Lets “Publish” save feeds.json straight to your repo and “Refresh now” rebuild the digest. Needs a fine-grained token for this one repo (Help → Stage 3 setup). Stored only in this browser, never exported.</p>
    <label class="f">Repository (owner/name)</label><input type="text" placeholder="yourname/daily-command" value="${esc(S.settings.ghRepo || '')}" data-setting="ghRepo">
    <div class="row"><label class="f" style="flex:1">Branch<input type="text" value="${esc(S.settings.ghBranch || 'main')}" data-setting="ghBranch"></label>
    <label class="f" style="flex:2">Token<input type="password" id="ghToken" placeholder="${secret().ghToken ? '•••••••• saved' : 'github_pat_…'}" autocomplete="off"></label></div>
    <div class="actions"><button class="btn sm" data-act="ghSaveToken">Save token</button>${GH.ready() ? '<button class="btn sm" data-act="ghRefresh">Refresh digest now</button><button class="btn sm ghost danger" data-act="ghForget">Forget token</button>' : ''}</div>`;
  return h;
}
function lensSelect(key, val) {
  return `<select data-setting="${key}"><option value="${ALL}">Everything</option>${Object.keys(S.watchlist?.lenses || {}).map(l => `<option ${l === val ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
}
const parseTags = s => [...new Set(String(s || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean))];

async function editFeed(f) {
  const isNew = !f, tagHint = Watchlist.tags().map(([t]) => t).join(', ');
  const src = f ? (f.type === 'youtube' ? (f.handle || f.channelId || f.url || '') : f.type === 'reddit' ? (f.sub || f.name) : f.type === 'googlenews' ? (f.query || '') : (f.url || '')) : '';
  const v = await formSheet(isNew ? 'Add a feed' : 'Edit feed', [
    { name: 'type', label: 'Type', type: 'select', value: f?.type || 'youtube', options: Object.entries(FEED_TYPES).map(([value, label]) => ({ value, label })) },
    { name: 'name', label: 'Name', value: f?.name || '' },
    { name: 'src', label: 'YouTube: @handle, link or leave blank to search by name · Subreddit: r/name · News: search words · RSS: feed URL', value: src },
    { name: 'tags', label: 'Tags (comma-separated)', value: (f?.tags || []).join(', ') },
    { name: 'boost', label: 'Score boost for this feed (−3 … +3)', type: 'number', value: f?.boost || 0, min: -3, max: 3 },
    { name: 'paused', label: 'Paused', type: 'checkbox', value: f?.paused, hint: 'Pause (keep it, don’t fetch)' },
  ], { deletable: !isNew, okLabel: isNew ? 'Add' : 'Save', note: tagHint ? `Your tags: ${esc(tagHint)}` : '' });
  if (!v) return;
  const W = S.watchlist;
  if (v.__delete) { W.feeds = W.feeds.filter(x => x.id !== f.id); Watchlist.touch(); return render(); }
  if (!v.name && !v.src) return toast('Give it a name (or a handle/URL).');
  const nf = { ...(f || {}), type: v.type, name: v.name || v.src, tags: parseTags(v.tags), boost: Number(v.boost) || 0 };
  delete nf.handle; delete nf.channelId; delete nf.url; delete nf.sub; delete nf.query;
  const s = v.src.trim();
  if (v.type === 'youtube' && s) { if (/UC[\w-]{22}/.test(s)) nf.channelId = s.match(/UC[\w-]{22}/)[0]; else if (/^@|youtube\.com\/@/.test(s)) nf.handle = '@' + s.replace(/.*youtube\.com\/@/, '').replace(/^@/, '').split(/[/?#]/)[0]; else nf.url = s; }
  if (v.type === 'reddit') nf.sub = (s || v.name).replace(/^.*?\/?r\//i, '').replace(/\/.*$/, '');
  if (v.type === 'googlenews') nf.query = s || v.name;
  if (v.type === 'rss') { if (!/^https?:\/\//.test(s)) return toast('RSS needs a full feed URL (https://…).'); nf.url = s; }
  if (v.paused) nf.paused = true; else delete nf.paused;
  if (!nf.boost) delete nf.boost;
  if (isNew) {
    nf.id = (v.type === 'youtube' ? 'yt' : v.type === 'reddit' ? 'rd' : v.type === 'googlenews' ? 'gn' : 'rss') + '-' + slug(nf.name);
    while (W.feeds.some(x => x.id === nf.id)) nf.id += '-2';
    nf.added = Engine.dateKey(new Date());                      // feeds the "add something fresh" reminder
    W.feeds.push(nf);
  } else {
    delete nf.check;                                            // you've looked at it — no longer "to check"
    W.feeds = W.feeds.map(x => (x.id === f.id ? nf : x));
  }
  Watchlist.touch(); render();
  toast(isNew ? `Added ${nf.name}. Publish to include it in the digest.` : 'Saved.');
}
async function editLens(name) {
  const W = S.watchlist, cur = name ? W.lenses[name] : [];
  const v = await formSheet(name ? 'Edit lens' : 'New lens', [{ name: 'name', label: 'Name', value: name || '' }, { name: 'tags', label: 'Tags (comma-separated)', value: (cur || []).join(', ') }],
    { deletable: !!name, note: `Your tags: ${esc(Watchlist.tags().map(([t]) => t).join(', '))}` });
  if (!v) return;
  const lenses = { ...(W.lenses || {}) };
  if (name) delete lenses[name];
  if (!v.__delete) { if (!v.name) return toast('A lens needs a name.'); lenses[v.name] = parseTags(v.tags); }
  W.lenses = lenses; Watchlist.touch(); render();
}

/* ---------------- Morning briefing slot (optional; wire up later) ----------------
   If the repo contains briefing.json ({generated, title, markdown}) or briefing.md,
   e.g. written by an AI step in the workflow, it appears at the top of the morning
   sequence while it's less than 24 h old. Nothing shows if neither file exists. */
const Briefing = {
  lastTry: 0,
  async refresh() {
    // optional file: check at most every 30 min (a missing file is a normal 404, not an error)
    if (Date.now() - this.lastTry < 30 * 60000) return; this.lastTry = Date.now();
    let b = null;
    try {
      const r = await fetch('briefing.json', { cache: 'no-store' });
      if (r.ok) { const j = await r.json(); if (!j.offline && (j.markdown || j.text)) b = { generated: j.generated, title: j.title || 'Morning briefing', md: j.markdown || j.text }; }
      if (!b) {
        const m = await fetch('briefing.md', { cache: 'no-store' });
        if (m.ok && !(m.headers.get('content-type') || '').includes('json')) b = { generated: m.headers.get('last-modified'), title: 'Morning briefing', md: await m.text() };
      }
    } catch (e) {}
    if (b) { C.briefing = { fetchedAt: Date.now(), ...b }; saveCache(); }
    rerenderAll();
  },
  html() {
    const b = C.briefing; if (!b) return '';
    const gen = b.generated ? new Date(b.generated).getTime() : b.fetchedAt;
    if (Date.now() - gen > 24 * 3600e3) return '';
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(b.title)}</h3><span class="small muted">${ago(gen)}</span></div><div class="help">${miniMarkdown(b.md)}</div></div>`;
  },
};
/** Tiny, safe Markdown: headings, bullets, bold, italics, http(s) links. Escapes everything first. */
function miniMarkdown(md) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = '', inList = false;
  for (const line of String(md).split(/\r?\n/)) {
    const li = line.match(/^\s*[-*]\s+(.*)/), hd = line.match(/^(#{1,3})\s+(.*)/);
    if (li) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (hd) out += `<h3>${inline(hd[2])}</h3>`; else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (inList ? '</ul>' : '');
}

/* ---------------- Stage 3 actions ---------------- */
const ACT3 = {
  digestLens(el) { Digest.switchTo(el.dataset.lens, S.digestSession?.types || null); render(); },
  digestType(el) {
    const t = el.dataset.type, cur = new Set(S.digestSession?.types || []);
    cur.has(t) ? cur.delete(t) : cur.add(t);
    Digest.switchTo(S.digestSession?.lens ?? ALL, [...cur]); render();
  },
  feedAdd() { if (!S.watchlist) return toast('Watchlist not loaded yet.'); if (!morningOpen() && currentView !== 'more') { S.ui.open['more-watch'] = true; go('more'); } editFeed(null); },
  feedEdit(el) { editFeed(S.watchlist.feeds.find(f => f.id === el.dataset.id)); },
  freshSnooze() { S.freshSnoozeUntil = new Date(Date.now() + 14 * 864e5).toISOString(); save(); render(); },
  wlFilter(el) { wlFilter = el.dataset.tag; render(); },
  wlReload() { Watchlist.refresh(); },
  wlDownload() {
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([Watchlist.json()], { type: 'application/json' })), download: 'feeds.json' });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Downloaded. Upload it to the repo (replace feeds.json) to publish.');
  },
  wlDiscard() {
    if (!Watchlist.remote) return toast('Can’t reach feeds.json right now.');
    if (!confirm('Discard your watchlist edits and go back to the repo’s feeds.json?')) return;
    S.watchlist = Watchlist.remote; S.watchlistDirty = false; save(); render();
  },
  async wlPublish() {
    try { toast('Publishing…'); await GH.publishFeeds(); S.watchlistDirty = false; save(); render(); toast('Published. The digest rebuilds in a few minutes.'); }
    catch (e) { toast('Publish failed: ' + e.message); }
  },
  lensEdit(el) { editLens(el.dataset.lens); },
  lensAdd() { editLens(null); },
  kwSave() {
    const kw = {};
    for (const line of $('#kwText').value.split('\n')) {
      const m = line.match(/^\s*(.+?)\s*(?:=\s*(-?\d+(?:\.\d+)?))?\s*$/); if (!m || !m[1]) continue;
      kw[m[1]] = m[2] != null ? Number(m[2]) : 1;
    }
    S.watchlist.keywords = kw; Watchlist.touch(); render(); toast('Keywords saved (applied at the next digest build).');
  },
  ghSaveToken() { const t = $('#ghToken').value.trim(); if (!t) return toast('Paste a token first.'); setSecret({ ghToken: t }); render(); toast('Token saved in this browser.'); },
  ghForget() { setSecret({ ghToken: '' }); render(); },
  async ghRefresh() { try { await GH.refreshDigest(); toast('Rebuild started — new digest in ~2–5 min.'); } catch (e) { toast('Refresh failed: ' + e.message); } },
};
</script>

<script>
/* =====================================================================
   PART 4d — LISTEN WHILE WORKING
   A queue of audio-friendly videos (feeds tagged "listen", plus anything
   tagged "listen" that you saved to the shelf). During a block, the Now
   screen shows ONE pick that fits the time left in the block, with the
   maths, and a Play button that opens it in the YouTube app on Android
   (background play with YouTube Premium). Per block kind you choose:
     talk  → the Listen queue (default for Admin and Lunch)
     focus → your "focus audio" link, e.g. an instrumental playlist (default for Deep work)
     off   → nothing
   Why the split: speech competes with reading/writing for the same mental
   channel (the "irrelevant speech effect"), so talk suits shallow work better
   than deep work. It's only a default — change it per block kind in More.
   ===================================================================== */
const AUDIO_PLAN_DEFAULT = { deep: 'focus', admin: 'talk', lunch: 'talk' };
const isAndroid = () => /Android/i.test(navigator.userAgent);

/** YouTube links open in the YouTube app on Android (needed for background play);
    everything else, and every link on desktop, opens normally. */
function ytOpenUrl(url) {
  if (!isAndroid()) return url;
  try {
    const u = new URL(url);
    const yt = /(^|\.)youtube\.com$/.test(u.hostname) || u.hostname === 'youtu.be';
    if (!yt) return url;
    const path = u.hostname === 'youtu.be' ? `www.youtube.com/watch?v=${u.pathname.slice(1)}` : `www.youtube.com${u.pathname}${u.search}`;
    return `intent://${path}#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=${encodeURIComponent(url)};end`;
  } catch (e) { return url; }
}
const playAttrs = url => { const h = ytOpenUrl(url); return `href="${esc(h)}"${h.startsWith('intent:') ? '' : ' target="_blank" rel="noopener"'}`; };
const mmss = sec => { const t = Math.round(sec); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };   // never "37:60"

const Listen = {
  plan(kind) { return { ...AUDIO_PLAN_DEFAULT, ...(S.settings.audioPlan || {}) }[kind] || 'off'; },
  /** All listenable items, in priority order: saved-to-shelf first (oldest first), then the digest by score. */
  queue() {
    const skipped = new Set((S.listenSkip || {})[today()] || []);
    const shelf = S.watch.filter(w => (w.tags || []).includes('listen') && w.url)
      .map(w => ({ key: 'w:' + w.id, shelfId: w.id, digestId: w.digestId, title: w.title, url: w.url, source: w.source, durationSec: w.durationSec, from: 'shelf' }));
    const onShelf = new Set(shelf.map(x => x.digestId).filter(Boolean));
    const dig = (C.digest?.data.items || []).filter(it => Digest.tagsOf(it).includes('listen') && !S.digestRead[it.id] && !onShelf.has(it.id))
      .sort((a, b) => ((b.score || 0) - (a.score || 0)) || (new Date(b.published) - new Date(a.published)))
      .map(it => ({ key: 'd:' + it.id, digestId: it.id, title: it.title, url: it.url, source: it.source, durationSec: it.durationSec, from: 'digest' }));
    return [...shelf, ...dig].filter(x => !skipped.has(x.key));
  },
  /** Best pick for `secLeft` seconds, in this order:
        1. the first (by priority) that fits AND fills at least half the time left
        2. else the first that fits
        3. else one with unknown length, else the shortest (and say how much it runs over).
      Returns {item, why} where `why` is the comparison written out. */
  pick(secLeft, label) {
    const q = this.queue(); if (!q.length) return null;
    if (secLeft == null) return { item: q[0], why: '' };
    secLeft = Math.round(secLeft / 60) * 60;                      // whole minutes, as shown
    const left = `${label} ends ${fmtT(new Date(Date.now() + secLeft * 1000))} → ${secLeft / 60} min left`;
    const fits = q.filter(x => x.durationSec && x.durationSec <= secLeft);
    const good = fits.find(x => x.durationSec >= secLeft / 2);
    const fit = good || fits[0];
    if (fit) {
      const pct = Math.round(fit.durationSec / secLeft * 100);
      return { item: fit, why: `${left} · ${mmss(fit.durationSec)} ≤ ${mmss(secLeft)} ✓ fits, fills ${mmss(fit.durationSec)} ÷ ${mmss(secLeft)} = ${pct}%${good ? '' : ' (nothing longer fits)'}` };
    }
    const unknown = q.find(x => !x.durationSec);
    if (unknown) return { item: unknown, why: `${left} · nothing with a known length fits; this one’s length is unknown` };
    const shortest = [...q].sort((a, b) => a.durationSec - b.durationSec)[0];
    return { item: shortest, why: `${left} · shortest is ${mmss(shortest.durationSec)} = ${Math.ceil((shortest.durationSec - secLeft) / 60)} min over` };
  },
  find(key) { return this.queue().find(x => x.key === key) || null; },
  /** Mark finished: read in the digest, and removed from the shelf if it came from there. */
  done(key) {
    const [kind, id] = [key.slice(0, 1), key.slice(2)];
    if (kind === 'w') { const w = S.watch.find(x => x.id === id); if (w?.digestId) S.digestRead[w.digestId] = Date.now(); S.watch = S.watch.filter(x => x.id !== id); }
    else S.digestRead[id] = Date.now();
    if (S.listening?.key === key) S.listening = null;
    save();
  },
};

/** The card under the Now hero. Returns '' when the current block's plan is "off". */
function listenCardHtml() {
  const c = R.current;
  if (c.type !== 'block') return '';               // not during calendar events or free gaps
  const plan = Listen.plan(c.kind);
  const now = Date.now();
  const L = S.listening;
  // something is already playing (started from this device)
  if (L && (plan === 'talk' || L.focus)) {
    const ends = L.durationSec ? L.startedAt + L.durationSec * 1000 : null;
    const finished = ends && now > ends;
    return `<div class="card listen"><div class="row" style="justify-content:space-between"><span class="small muted">🎧 ${finished ? 'Probably finished' : 'Playing on YouTube'}</span>
        ${ends ? `<span class="small muted num">${finished ? 'ended ~' + fmtT(new Date(ends)) : 'ends ~' + fmtT(new Date(ends))}</span>` : ''}</div>
      <div style="font-weight:600;margin:4px 0">${esc(L.title)}</div>
      <div class="actions">${L.focus ? '<button class="btn sm" data-act="listenStop">Stop</button>' : `<button class="btn sm primary" data-act="listenDone" data-key="${esc(L.key)}">✓ Done${finished ? ' — next' : ''}</button><button class="btn sm" data-act="listenStop">Stop</button>`}</div></div>`;
  }
  if (plan === 'focus') {
    const fa = S.settings.focusAudio;
    if (!fa?.url) return `<div class="card listen"><div class="small muted">🎧 Focus audio for ${esc(KIND_LABEL[c.kind] || 'this block')}</div>
      <div class="small">Instrumental or ambient works best while reading and writing. Set a link once (e.g. a YouTube playlist).</div>
      <div class="actions"><button class="btn sm" data-act="focusAudioSet">Set focus audio</button><button class="btn sm ghost" data-act="audioPlanQuick" data-kind="${c.kind}" data-plan="talk">Use the talk queue instead</button></div></div>`;
    return `<div class="card listen"><div class="small muted">🎧 Focus audio</div><div style="font-weight:600;margin:4px 0">${esc(fa.label || 'Focus audio')}</div>
      <div class="actions"><a class="btn sm primary" ${playAttrs(fa.url)} data-act="focusPlay">▶ Play</a><button class="btn sm ghost" data-act="audioPlanQuick" data-kind="${c.kind}" data-plan="talk">Talk instead</button></div></div>`;
  }
  if (plan !== 'talk') return '';
  const secLeft = c.end ? Math.max(0, (c.end - now) / 1000) : null;
  const p = Listen.pick(secLeft, c.title);
  if (!p) return `<div class="card listen"><div class="small muted">🎧 Listen queue empty</div><div class="small">Tag feeds “listen” in More → Watchlist, or save listen-tagged videos to the shelf.</div></div>`;
  const it = p.item, n = Listen.queue().length;
  return `<div class="card listen"><div class="row" style="justify-content:space-between"><span class="small muted">🎧 Listen next${it.from === 'shelf' ? ' · from your shelf' : ''}</span><span class="tag">${n} in queue</span></div>
    <div style="font-weight:600;margin:4px 0">${esc(it.title)}</div>
    <div class="small muted">${esc(it.source || '')}${it.durationSec ? ' · ' + mmss(it.durationSec) : ''}</div>
    ${p.why ? `<div class="math">${esc(p.why)}</div>` : ''}
    <div class="actions"><a class="btn sm primary" ${playAttrs(it.url)} data-act="listenPlay" data-key="${esc(it.key)}">▶ Play${isAndroid() ? ' in YouTube' : ''}</a>
      <button class="btn sm" data-act="listenSkip" data-key="${esc(it.key)}">Skip</button><button class="btn sm ghost" data-act="go" data-view="inbox">Queue</button></div>
    ${isAndroid() ? '' : '<div class="small muted" style="margin-top:6px">Listening on your phone? Open the app there — it shows the same queue.</div>'}</div>`;
}

/** Full queue list (Inbox tab). */
function listenQueueHtml() {
  const q = Listen.queue();
  if (!q.length) return '<div class="empty">Nothing to listen to yet. Feeds tagged “listen” fill this up after each digest build.</div>';
  const total = q.filter(x => x.durationSec).reduce((a, x) => a + x.durationSec, 0), known = q.filter(x => x.durationSec).length;
  return `<ul class="list">${q.slice(0, 25).map(x => `<li><span class="grow"><a ${playAttrs(x.url)} data-act="listenPlay" data-key="${esc(x.key)}">${esc(x.title)}</a>
      <br><span class="small muted">${esc(x.source || '')}${x.durationSec ? ' · ' + mmss(x.durationSec) : ''}${x.from === 'shelf' ? ' · shelf' : ''}</span></span>
      <button class="icon" data-act="listenDone" data-key="${esc(x.key)}" title="Done" aria-label="Done">✓</button></li>`).join('')}</ul>
    ${known ? `<div class="math">${known} with known length: ${q.filter(x => x.durationSec).slice(0, 8).map(x => Math.round(x.durationSec / 60)).join(' + ')}${known > 8 ? ' + …' : ''} ≈ ${Math.round(total / 60)} min of listening</div>` : ''}`;
}

/** Settings section (More). */
function audioSettingsHtml() {
  const kinds = Object.keys(KIND_LABEL).filter(k => !['wake', 'winddown'].includes(k));
  const fa = S.settings.focusAudio || {};
  return `<p class="small muted">What the Now screen suggests in each kind of block. Talk = your Listen queue; Focus = your focus-audio link.</p>
    ${kinds.map(k => `<div class="row" style="min-height:48px"><span style="flex:1">${KIND_LABEL[k]}</span>
      <div class="seg" style="flex:2">${['talk', 'focus', 'off'].map(p => `<button class="${Listen.plan(k) === p ? 'on' : ''}" data-act="audioPlanSet" data-kind="${k}" data-plan="${p}">${p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</div></div>`).join('')}
    <label class="f">Focus audio</label><div class="row"><span class="grow">${fa.url ? `${esc(fa.label || fa.url)}` : '<span class="muted">Not set</span>'}</span><button class="btn sm" data-act="focusAudioSet">${fa.url ? 'Change' : 'Set'}</button></div>
    <p class="small muted">Tag which feeds are good to listen to with the tag <b>listen</b> (More → Watchlist & lenses). ${isAndroid() ? 'Play opens the YouTube app — with Premium it keeps playing with the screen off.' : 'On Android, Play opens the YouTube app (background play needs YouTube Premium).'}</p>`;
}

const ACT4 = {
  listenPlay(el) {
    const it = Listen.find(el.dataset.key); if (!it) return;
    S.listening = { key: it.key, title: it.title, durationSec: it.durationSec || null, startedAt: Date.now() };
    save(); setTimeout(render, 300);                 // let the link open first
  },
  listenDone(el) { Listen.done(el.dataset.key); render(); },
  listenStop() { S.listening = null; save(); render(); },
  listenSkip(el) { (S.listenSkip ||= {}); (S.listenSkip[today()] ||= []).push(el.dataset.key); save(); render(); },
  focusPlay() { const fa = S.settings.focusAudio; S.listening = { key: 'focus', focus: true, title: fa.label || 'Focus audio', durationSec: null, startedAt: Date.now() }; save(); setTimeout(render, 300); },
  async focusAudioSet() {
    const fa = S.settings.focusAudio || {};
    const v = await formSheet('Focus audio', [{ name: 'label', label: 'Name', value: fa.label || '' }, { name: 'url', label: 'Link (YouTube video or playlist, or any audio page)', value: fa.url || '' }],
      { note: 'Instrumental, lo-fi, ambient or classical — anything without talking.', deletable: !!fa.url });
    if (!v) return;
    if (v.__delete) S.settings.focusAudio = null;
    else { if (!/^https?:\/\//.test(v.url)) return toast('Paste a full link (https://…).'); S.settings.focusAudio = { label: v.label, url: v.url }; }
    save(); render();
  },
  audioPlanSet(el) { S.settings.audioPlan = { ...AUDIO_PLAN_DEFAULT, ...(S.settings.audioPlan || {}), [el.dataset.kind]: el.dataset.plan }; save(); render(); },
  audioPlanQuick(el) { ACT4.audioPlanSet(el); toast(`${KIND_LABEL[el.dataset.kind]} blocks now use ${el.dataset.plan}. Change in More → Listening while working.`); },
};
</script>

<script>
/* =====================================================================
   PART 5 — RENDERING
   Each view is a function that returns HTML. Clicks are handled by one
   delegated listener reading data-act attributes (PART 6).
   ===================================================================== */
let R = null;                 // latest engine result
let currentView = 'now';
let focusWeekOffset = 0;      // weekly chart navigation
let routineTab = Engine.isWeekend(new Date()) ? 'weekend' : 'weekday';

function applyTheme() {
  let t = S.settings.theme;
  if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
const modeColor = m => `var(--m-${m})`;

/** A collapsible secondary section that remembers whether it was open. */
function sec(id, title, body, defOpen = false, right = '') {
  const open = S.ui.open[id] ?? defOpen;
  return `<details class="sec" data-sec="${id}" ${open ? 'open' : ''}><summary><span>${title}</span>${right}</summary><div class="body">${body}</div></details>`;
}

/* ---------------- header: clock + mode chips ---------------- */
function renderHeader() {
  const now = new Date();
  $('#clock').textContent = now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + fmtT(now);
  $('#modes').innerHTML = Engine.MODES.map(m =>
    `<button class="chip ${R.mode === m ? 'on' : ''}" style="--mode-c:${modeColor(m)}" data-act="setMode" data-mode="${m}">${MODE_LABEL[m]}</button>`).join('');
  $('#modeNote').innerHTML = R.overrideOn
    ? `manual until ${fmtT(new Date(S.modeOverride.until))} · <a href="#" data-act="clearMode" style="color:inherit">auto</a>`
    : 'auto by time';
  document.documentElement.style.setProperty('--mode-c', modeColor(R.mode));
  const n = S.inbox.length, b = $('#inboxBadge');
  b.textContent = n; b.classList.toggle('hidden', !n);
}

/* ---------------- NOW view ---------------- */
function renderNow() {
  const now = new Date(), c = R.current, p = S.pomo;
  let h = '';

  // Overrun nudge — "Next: X. Start?"
  if (R.overrun) {
    const target = c.type === 'gap' ? R.next : c;
    h += `<div class="nudge" role="alert"><b>${R.overrun.minutesOver} min over “${esc(R.overrun.active.title)}”.</b>
      <div>Next: <b>${esc(target?.title || 'free time')}</b>. Start?</div>
      <div class="actions"><button class="btn sm primary" data-act="nudgeStart">Start ${esc(target?.title || '')}</button>
      <button class="btn sm" data-act="nudgeSnooze">+10 min</button><button class="btn sm ghost" data-act="nudgeDismiss">Dismiss</button></div></div>`;
  }

  // ---- hero card ----
  const label = c.type === 'event' ? 'Calendar' : c.type === 'gap' ? 'Free' : (KIND_LABEL[c.kind] || 'Block');
  const range = c.start && c.end ? `${fmtT(c.start)}–${fmtT(c.end)}` : c.end ? `until ${fmtT(c.end)}` : '';
  h += `<article class="now" style="--mode-c:${modeColor(R.mode)}" aria-live="polite">
    <div class="label"><span>Now · ${esc(label)}</span><span class="num">${range}</span></div>
    <div class="title">${esc(c.title)}</div>`;
  if (c.type === 'event') {
    h += `<div class="sub">${c.location ? esc(c.location) + ' · ' : ''}${c.underlying ? 'then back to ' + esc(c.underlying.name) : ''}</div>`;
    if (c.also.length) h += `<div class="also">Also now: ${c.also.map(esc).join(', ')}</div>`;
  }
  if (c.type === 'gap') h += `<div class="sub">${c.end ? 'Nothing scheduled until ' + whenLabel(c.end) : 'Nothing scheduled'}</div>`;
  if (R.allDay.length) h += `<div class="sub">📅 ${R.allDay.map(esc).join(' · ')}</div>`;

  // time-left bar
  if (c.start && c.end) {
    const pct = Math.min(100, Math.max(0, (now - c.start) / (c.end - c.start) * 100));
    h += `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><div class="sub num">${fmtDur(c.end - now)} left</div>`;
  }

  // the task inside a work block
  if (c.pick) {
    const t = c.pick.task, src = (c.forcedWork ? 'Work mode (manual) · ' : '') + (c.pick.source === 'top3' ? 'Top 3' : c.pick.source === 'next' ? 'Next action' : 'Oldest open task');
    const proj = projById(t.projectId);
    h += `<div class="task"><div class="small muted">${src}${proj ? ' · ' + esc(proj.name) : ''}</div><div class="t">${esc(t.title)}</div></div>`;
  } else if (Engine.WORK_KINDS.has(c.kind)) {
    h += `<div class="task"><div class="t">No task picked</div><div class="small muted">Choose today's top 3 so this card knows what to show.</div></div>`;
  }

  // running pomodoro is shown right in the hero
  if (p.phase !== 'idle') {
    h += `<div class="timer num" id="heroTimer">${fmtClock(Pomo.remaining())}</div>
      <div class="sub">${p.phase === 'work' ? 'Focus' : 'Break'}${p.paused ? ' · paused' : ''}</div>`;
  }

  // primary actions depend on the kind of "now"
  h += `<div class="actions">`;
  const isActive = S.active && S.active.id === c.id;
  if (p.phase !== 'idle') {
    h += p.paused ? `<button class="btn primary" data-act="pomoResume">Resume</button>` : `<button class="btn primary" data-act="pomoPause">Pause</button>`;
    h += `<button class="btn" data-act="pomoStop">Stop</button>`;
    if (c.pick) h += `<button class="btn" data-act="taskDone" data-id="${c.pick.task.id}">✓ Done</button>`;
  } else if (c.pick) {
    h += `<button class="btn primary" data-act="startFocus">▶ Start focus · ${S.settings.pomoWork}m</button>
      <button class="btn" data-act="taskDone" data-id="${c.pick.task.id}">✓ Done</button>
      <button class="btn ghost" data-act="taskSkip" data-id="${c.pick.task.id}">Not now</button>`;
  } else if (Engine.WORK_KINDS.has(c.kind)) {
    h += `<button class="btn primary" data-act="go" data-view="tasks">Pick top 3</button>`;
  } else if ((c.kind === 'morning' || c.kind === 'wake') && !morningDone()) {
    h += `<button class="btn primary" data-act="morning">☀ Start morning sequence</button>`;
  } else if (c.kind === 'winddown') {
    h += `<button class="btn primary" data-act="wrapup">Start 2-min wrap-up</button>`;
  } else if (c.type === 'gap') {
    h += `<button class="btn primary" data-act="capture">Capture a thought</button>`;
  } else if (isActive) {
    h += `<button class="btn primary" data-act="finishActive">Finish ${esc(c.title)}</button>`;
  } else {
    h += `<button class="btn primary" data-act="startActive">Start ${esc(c.title)}</button>`;
  }
  h += `</div>`;

  // Next
  if (R.next) {
    const n = R.next;
    h += `<div class="next"><span class="muted">NEXT</span><span style="flex:1"><b>${esc(n.title)}</b>${n.resume ? ' <span class="muted small">(resume)</span>' : ''}</span>
      <span class="num muted">${whenLabel(n.at)} · in ${fmtDur(n.at - now)}</span></div>`;
  }
  h += `</article>`;
  h += listenCardHtml();                          // 🎧 listen while working (PART 4d)

  // ---- secondary sections: content changes with the mode ----
  h += modeSections(R.mode);
  $('#view-now').innerHTML = h;
}

/** Which secondary cards to show, per mode. Keep it short — the hero is the point. */
function modeSections(mode) {
  const parts = [];
  const top3 = top3Html(true);
  const comingUp = R.agenda.length ? `<ul class="list">${R.agenda.map(a =>
    `<li><span class="num muted" style="width:96px">${whenLabel(a.at)}</span><span class="grow">${esc(a.title)}${a.type === 'event' ? ' <span class="tag">event</span>' : ''}</span></li>`).join('')}</ul>`
    : '<div class="empty">Nothing else scheduled.</div>';
  const minsToday = focusMinutes(today());
  if (mode === 'work') {
    parts.push(sec('now-top3', 'Today’s top 3', top3, true));
    parts.push(sec('now-next', 'Next action per project', nextActionsHtml(), false));
    parts.push(sec('now-focus', 'Focus today', `<div class="kpi"><div><b class="num">${minsToday}</b>minutes</div><div><b class="num">${todaysSessions().length}</b>sessions</div></div>`, false, `<span class="tag num">${minsToday}m</span>`));
  } else if (mode === 'life') {
    parts.push(sec('now-weather', 'Weather', Weather.html(), false, `<span class="tag">${Weather.short() || '—'}</span>`));
    parts.push(sec('now-top3', 'Today’s top 3', top3, false));
    parts.push(sec('now-inbox', `Inbox`, inboxHtml(true), S.inbox.length > 0, `<span class="tag">${S.inbox.length}</span>`));
  } else if (mode === 'leisure') {
    parts.push(sec('now-watch', 'Watch-later shelf', watchHtml(), true, `<span class="tag">${S.watch.length}</span>`));
    parts.push(digestCard());
    parts.push(freshPromptHtml());
  } else if (mode === 'winddown') {
    const w = S.wrapups[today()];
    parts.push(`<div class="card"><h3>Evening wrap-up</h3><p class="muted small">${w ? 'Done at ' + fmtT(new Date(w.at)) + '. You can run it again.' : 'Two minutes: what got done, what rolls over, tomorrow’s top 3.'}</p>
      <div class="actions"><button class="btn primary" data-act="wrapup">${w ? 'Redo wrap-up' : 'Start wrap-up'}</button></div></div>`);
    parts.push(sec('now-tom', 'Tomorrow’s top 3', listTop3(tomorrow()), true));
    parts.push(freshPromptHtml());
  }
  parts.push(sec('now-agenda', 'Coming up', comingUp, false));
  return parts.join('');
}

/* ---------------- shared bits for tasks ---------------- */
function top3Ids(dk = today()) { return (S.top3[dk] || []).filter(id => taskById(id)); }
function top3Html(compact = false) {
  const ids = top3Ids();
  let h = '';
  for (let i = 0; i < 3; i++) {
    const t = taskById(ids[i]);
    h += t ? `<div class="slot filled ${t.done ? 'done' : ''}"><span class="n">${i + 1}</span>
        <button class="icon" data-act="toggleDone" data-id="${t.id}" aria-label="Toggle done"><span class="chk"></span></button>
        <span class="grow" data-act="editTask" data-id="${t.id}">${esc(t.title)} <span class="tag">${esc(projById(t.projectId)?.name || '')}</span></span>
        <button class="icon" data-act="top3Remove" data-id="${t.id}" aria-label="Remove from top 3">✕</button></div>`
      : `<div class="slot" data-act="top3Pick"><span class="n">${i + 1}</span><span class="muted">Pick a task…</span></div>`;
  }
  if (!compact && !ids.length) {
    const y = Engine.dateKey(Engine.atDay(new Date(today()), -1));
    const carry = top3Ids(y).filter(id => !taskById(id).done);
    if (carry.length) h += `<button class="btn sm" data-act="carryYesterday">Carry over ${carry.length} from yesterday</button>`;
  }
  return h;
}
function listTop3(dk) {
  const ids = top3Ids(dk);
  return ids.length ? `<ol>${ids.map(id => `<li>${esc(taskById(id).title)}</li>`).join('')}</ol>` : '<div class="empty">Not picked yet.</div>';
}
function nextActionsHtml() {
  return `<ul class="list">${S.projects.map(p => {
    const t = taskById(p.nextId);
    return `<li><span class="grow"><b>${esc(p.name)}</b><br><span class="${t && !t.done ? '' : 'muted'}">${t && !t.done ? esc(t.title) : 'No next action set'}</span></span></li>`;
  }).join('')}</ul>`;
}
function inboxHtml(compact = false) {
  if (!S.inbox.length) return '<div class="empty">Inbox zero. Capture with the + button.</div>';
  return `<ul class="list">${S.inbox.map(i => `<li><span class="grow">${esc(i.text)}<br><span class="small muted">${new Date(i.created).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' })}</span></span>
    <button class="icon" data-act="inboxToTask" data-id="${i.id}" title="Make it a task" aria-label="Make task">✓</button>
    <button class="icon" data-act="inboxToWatch" data-id="${i.id}" title="Watch/read later" aria-label="Later">⏵</button>
    <button class="icon" data-act="inboxDelete" data-id="${i.id}" title="Delete" aria-label="Delete">✕</button></li>`).join('')}</ul>`;
}
function watchHtml() {
  if (!S.watch.length) return '<div class="empty">Empty. Tap the bookmark in the digest, or ⏵ on an inbox item, to save something here.</div>';
  return `<ul class="list">${[...S.watch].reverse().map(w => `<li><span class="grow">${w.url ? `<a href="${esc(w.url)}" target="_blank" rel="noopener">${w.type === 'video' ? '▶ ' : ''}${esc(w.title)}</a>` : esc(w.title)}
      <br><span class="small muted">${[w.source, w.category, w.duration].filter(Boolean).map(esc).join(' · ') || 'from inbox'}</span></span>
    <button class="icon" data-act="watchDone" data-id="${w.id}" title="Watched / done" aria-label="Done">✓</button></li>`).join('')}</ul>`;
}
/** Card offering a time-boxed digest session. */
function digestCard() {
  const lens = Digest.defaultLens('standalone'), n = Digest.unreadCount(lens);
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3>Digest · ${esc(lensName(lens))}</h3><span class="tag">${C.digest ? n + ' new' : '—'}</span></div>
    <p class="small muted">${C.digest ? `Updated ${ago(C.digest.fetchedAt)}. ` : ''}A ${S.settings.digestMin}-minute read that ends with “You’re caught up”.</p>
    <div class="actions"><button class="btn" data-act="digestStart">Read digest · ${S.settings.digestMin} min</button></div></div>`;
}

/* ---------------- TASKS view ---------------- */
