<script>
/* =====================================================================
   PART 4 — POMODORO
   Timestamp-based (endsAt), so it survives reloads, tab switches and
   the phone sleeping: on return we "catch up" any phases that ended.
   ===================================================================== */
const Pomo = {
  minutesFor(phase) { return phase === 'work' ? S.settings.pomoWork : phase === 'long' ? S.settings.pomoLong : S.settings.pomoBreak; },
  start(phase = 'work', taskId = null, from = Date.now()) {
    const mins = this.minutesFor(phase);
    S.pomo = { ...S.pomo, phase, taskId: taskId ?? S.pomo.taskId ?? null, startedAt: from, endsAt: from + mins * 60000, planned: mins, paused: false };
    save();
  },
  pause() { if (S.pomo.phase === 'idle' || S.pomo.paused) return; S.pomo.paused = true; S.pomo.remaining = S.pomo.endsAt - Date.now(); save(); },
  resume() { if (!S.pomo.paused) return; S.pomo.endsAt = Date.now() + S.pomo.remaining; S.pomo.paused = false; save(); },
  /** Stop early. A work session of >= 5 min is logged as partial (honest log). */
  stop() {
    const p = S.pomo;
    if (p.phase === 'work') {
      const end = p.paused ? p.endsAt - p.remaining : Date.now();
      const min = Math.round((end - p.startedAt) / 60000);
      if (min >= 5) this.log(p.startedAt, end, min, true);
    }
    S.pomo = { phase: 'idle', count: p.count || 0, taskId: p.taskId }; save();
  },
  log(start, end, min, partial) {
    const t = taskById(S.pomo.taskId);
    S.pomoLog.push({ id: uid(), start, end, min, taskId: t?.id || null, taskTitle: t?.title || '', partial });
  },
  /** Called every second while visible and on load. Handles multiple elapsed phases. */
  tick() {
    let changed = false, guard = 0;
    while (S.pomo.phase !== 'idle' && !S.pomo.paused && Date.now() >= S.pomo.endsAt && guard++ < 5) {
      const p = S.pomo; changed = true;
      if (p.phase === 'work') {
        this.log(p.startedAt, p.endsAt, p.planned, false);
        S.pomo.count = (p.count || 0) + 1;
        const longNext = S.pomo.count % S.settings.longEvery === 0;
        notify('Focus session done', longNext ? 'Long break — stand up, move.' : 'Short break.');
        if (S.settings.autoBreak) this.start(longNext ? 'long' : 'break', p.taskId, p.endsAt);  // break starts when work ended
        else S.pomo = { phase: 'idle', count: S.pomo.count, taskId: p.taskId };
      } else {
        notify('Break over', 'Back to it — check the Now card.');
        S.pomo = { phase: 'idle', count: p.count, taskId: p.taskId };
      }
    }
    if (changed) save();
    return changed;
  },
  remaining() { const p = S.pomo; return p.paused ? p.remaining : p.endsAt - Date.now(); },
};
</script>

<script>
/* =====================================================================
   PART 4b — STAGE 2: WEATHER, DIGEST, MORNING SEQUENCE
   Network data (weather, digest) lives in a separate cache key, not in
   your exported/synced data: it's re-fetchable, so it shouldn't bloat
   backups. Every cached copy carries fetchedAt so the UI can say
   "updated 2 h ago" when you're offline.
   ===================================================================== */
const CACHE_KEY = 'dailycommand.cache';
let C = (() => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch (e) { return {}; } })();
const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(C)); } catch (e) {} };
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
}
const morningOpen = () => !$('#morning').classList.contains('hidden');
/** Re-render whatever is visible (main view + morning overlay). */
function rerenderAll() { render(); }

/* ---------------- WEATHER (Open-Meteo: free, no key, CORS-enabled) ---------------- */
// WMO weather codes -> [icon, label]
const WMO = { 0: ['☀️', 'Clear'], 1: ['🌤️', 'Mainly clear'], 2: ['⛅', 'Partly cloudy'], 3: ['☁️', 'Overcast'],
  45: ['🌫️', 'Fog'], 48: ['🌫️', 'Rime fog'], 51: ['🌦️', 'Light drizzle'], 53: ['🌦️', 'Drizzle'], 55: ['🌧️', 'Heavy drizzle'],
  56: ['🌧️', 'Freezing drizzle'], 57: ['🌧️', 'Freezing drizzle'], 61: ['🌦️', 'Light rain'], 63: ['🌧️', 'Rain'], 65: ['🌧️', 'Heavy rain'],
  66: ['🌧️', 'Freezing rain'], 67: ['🌧️', 'Freezing rain'], 71: ['🌨️', 'Light snow'], 73: ['🌨️', 'Snow'], 75: ['❄️', 'Heavy snow'],
  77: ['🌨️', 'Snow grains'], 80: ['🌦️', 'Showers'], 81: ['🌧️', 'Showers'], 82: ['⛈️', 'Violent showers'], 85: ['🌨️', 'Snow showers'],
  86: ['🌨️', 'Snow showers'], 95: ['⛈️', 'Thunderstorm'], 96: ['⛈️', 'Thunder & hail'], 99: ['⛈️', 'Thunder & hail'] };
const wmo = c => WMO[c] || ['🌡️', '—'];

const Weather = {
  loading: false, error: '',
  url: loc => 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon +
    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m' +
    '&hourly=temperature_2m,precipitation_probability,weather_code' +
    '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,weather_code' +
    '&timezone=auto&forecast_days=2',
  /** Fetch unless we have a copy < 30 min old for this location (force = always try). */
  async refresh(force = false) {
    const loc = S.settings.location; if (!loc || this.loading) return;
    const key = `${loc.lat},${loc.lon}`, c = C.weather;
    if (!force && c && c.loc === key && Date.now() - c.fetchedAt < 30 * 60000) return;
    if (!navigator.onLine) { this.error = 'offline'; return rerenderAll(); }
    this.loading = true;
    try {
      const r = await fetch(this.url(loc));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      C.weather = { fetchedAt: Date.now(), loc: key, data: await r.json() }; saveCache(); this.error = '';
    } catch (e) { this.error = navigator.onLine ? 'couldn’t load (' + e.message + ')' : 'offline'; }
    this.loading = false; rerenderAll();
  },
  /** Next 12 hours from the hourly arrays. */
  hours(d) {
    const now = Date.now(), T = d.hourly.time;
    let i0 = T.findIndex(t => new Date(t).getTime() > now - 3600e3); if (i0 < 0) i0 = 0;
    return T.slice(i0, i0 + 12).map((t, k) => ({ t: new Date(t), temp: d.hourly.temperature_2m[i0 + k], rain: d.hourly.precipitation_probability[i0 + k] ?? 0 }))
      .filter(h => h.temp != null);
  },
  /** One-line summary for section headers: "⛅ 12°" */
  short() { const c = C.weather; if (!c) return ''; const cur = c.data.current; return `${wmo(cur.weather_code)[0]} ${Math.round(cur.temperature_2m)}°`; },
  html() {
    const loc = S.settings.location;
    if (!loc) return `<div class="empty">Set a location to see today’s weather.</div>
      <div class="actions"><button class="btn sm" data-act="locGeo">📍 Use my location</button><button class="btn sm" data-act="locSearch">Search a city</button></div>`;
    const c = C.weather;
    if (!c) return `<div class="empty">${this.loading ? 'Loading weather…' : this.error ? 'Weather ' + esc(this.error) + '.' : 'No weather yet.'}</div>
      ${this.loading ? '' : '<div class="actions"><button class="btn sm" data-act="weatherRefresh">Retry</button></div>'}`;
    const d = c.data, cur = d.current, dy = d.daily, [ic, lab] = wmo(cur.weather_code);
    const hrs = this.hours(d);
    const peak = hrs.reduce((a, h) => (h.rain > a.rain ? h : a), hrs[0] || { rain: 0, t: new Date() });
    const stale = Date.now() - c.fetchedAt > 3 * 3600e3;
    return `<div class="wx-now"><span class="wx-ic" aria-hidden="true">${ic}</span>
        <div><span class="wx-t num">${Math.round(cur.temperature_2m)}°</span> <span class="muted">feels ${Math.round(cur.apparent_temperature)}°</span>
        <div>${esc(lab)} · ${esc(loc.name)}</div></div></div>
      <div class="kpi" style="margin-top:10px">
        <div><b class="num">${Math.round(dy.temperature_2m_max[0])}° / ${Math.round(dy.temperature_2m_min[0])}°</b>high / low</div>
        <div><b class="num">${dy.precipitation_probability_max[0] ?? 0}%</b>max rain chance</div>
        <div><b class="num">${fmtT(new Date(dy.sunrise[0]))}–${fmtT(new Date(dy.sunset[0]))}</b>daylight</div></div>
      ${hrs.length ? wxChart(hrs) : ''}
      ${hrs.length ? `<div class="math">rain chance, next ${hrs.length} h: max(${hrs.map(h => h.rain).join(', ')}) = ${peak.rain}% at ${fmtT(peak.t)}${peak.rain >= 50 ? ' → take an umbrella' : ''}</div>` : ''}
      <div class="small muted" style="margin-top:8px">${this.error === 'offline' || !navigator.onLine ? '⚠ Offline — showing last known. ' : ''}${stale ? '⚠ ' : ''}Updated ${ago(c.fetchedAt)}
        · <a href="#" data-act="weatherRefresh" style="color:inherit">refresh</a></div>`;
  },
};
/** Small SVG: temperature line over rain-chance bars, next 12 hours. */
function wxChart(hrs) {
  const W = 340, H = 140, top = 20, tempH = 56, rainTop = 92, rainH = 28, n = hrs.length, step = (W - 8) / n;
  const ts = hrs.map(h => h.temp), lo = Math.min(...ts) - 1, hi = Math.max(...ts) + 1;
  const x = i => 4 + step * i + step / 2, y = t => top + tempH * (1 - (t - lo) / (hi - lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Temperature and rain chance, next hours" style="margin-top:8px">`;
  hrs.forEach((h, i) => {
    const bh = rainH * h.rain / 100;
    s += `<rect x="${x(i) - step * .3}" y="${rainTop + rainH - bh}" width="${step * .6}" height="${Math.max(bh, 1)}" rx="3" fill="var(--m-work)" opacity="${h.rain >= 50 ? .9 : .45}"><title>${fmtT(h.t)}: ${h.rain}% rain</title></rect>`;
    if (h.rain >= 30) s += `<text x="${x(i)}" y="${rainTop + rainH - bh - 3}" text-anchor="middle" font-size="9" fill="var(--muted)">${h.rain}%</text>`;
  });
  s += `<polyline fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-linejoin="round" points="${hrs.map((h, i) => `${x(i)},${y(h.temp)}`).join(' ')}"/>`;
  hrs.forEach((h, i) => {
    s += `<circle cx="${x(i)}" cy="${y(h.temp)}" r="2.6" fill="var(--warn)"><title>${fmtT(h.t)}: ${h.temp}°</title></circle>`;
    if (i % 3 === 0) {
      s += `<text x="${x(i)}" y="${y(h.temp) - 7}" text-anchor="middle" font-size="11" fill="var(--text)">${Math.round(h.temp)}°</text>`;
      s += `<text x="${x(i)}" y="${H - 2}" text-anchor="middle" font-size="10" fill="var(--muted)">${String(h.t.getHours()).padStart(2, '0')}h</text>`;
    }
  });
  return s + `<line x1="0" x2="${W}" y1="${rainTop + rainH}" y2="${rainTop + rainH}" stroke="var(--border)"/></svg>`;
}

/* ---------------- DIGEST (reads digest.json from this same site) ----------------
   digest.json is written every 3 h by the GitHub Action (scripts/build-digest.mjs):
   { generated, watchlistUpdatedAt, stats, feeds:[{id,name,type,status,count,error,http,resolved}],
     items:[{ id, title, url, source, feedId, type:'video'|'post'|'news'|'article', tags:[…],
              published, summary, score, matched:[keywords], why:"physics +2 + fresh +1 = 3", alsoIn? }] }
   LENSES (from your watchlist) pick which tags you want right now, e.g. "Laugh" = comedy +
   standup + cartoon. A reading SESSION freezes the list when it starts (top N by score,
   keyword matches first), so new items can't trickle in mid-read: finite by design. */
const HOW_LABEL = { watch: '▶ Watch', listen: '🎧 Listen', read: '📰 Read' };   // the "How" chips (PART 1c)
const ALL = '__all';
const Digest = {
  loading: false, error: '',
  async refresh() {
    if (this.loading) return; this.loading = true;
    try {
      const r = await fetch('digest.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 404 ? 'no digest.json on the site yet' : 'HTTP ' + r.status);
      const data = await r.json();
      if (data.offline) throw new Error('offline');            // service worker had no cached copy
      if (!Array.isArray(data.items)) throw new Error('digest.json has no items list');
      C.digest = { fetchedAt: Date.now(), data }; saveCache(); this.error = '';
    } catch (e) { this.error = !navigator.onLine || e.message === 'offline' ? 'offline' : e.message; }
    this.loading = false;
    if (S.digestSession?.day === today()) this.ensureSession(false);   // fill a session that started before data arrived
    rerenderAll();
  },
  /** digest.json items + new Spotify podcast episodes (Stage 4.5), all in one list. */
  allItems() { return [...(C.digest?.data.items || []), ...spotifyItems()]; },
  byId(id) { return this.allItems().find(i => i.id === id); },
  groups() { return (S.watchlist && S.watchlist.tagGroups) || {}; },
  lensDef(lens) { return !lens || lens === ALL ? null : this.lenses()[lens] || null; },
  /** Tags of an item (older/sample digests only have a single "category"). */
  tagsOf: it => (it.tags && it.tags.length ? it.tags : it.category ? [String(it.category).toLowerCase()] : ['other']),
  lenses() { return (S.watchlist && S.watchlist.lenses) || {}; },
  /** Tags in a lens; null = everything. */
  lensTags(lens) { if (!lens || lens === ALL) return null; const t = this.lenses()[lens]; return t ? t.map(x => x.toLowerCase()) : null; },
  /** Default lens: the morning sequence has its own; otherwise it follows the current mode. */
  defaultLens(context) {
    const st = S.settings, want = context === 'morning' ? st.morningLens : (st.lensByMode || {})[R?.mode];
    return want && this.lenses()[want] ? want : ALL;
  },
  /** Candidate items: recent (relative to when the digest was built), unread, in the lens + types. */
  candidates(lens = ALL, types = null, cap = true) {
    const d = C.digest?.data; if (!d && !spotifyItems().length) return [];
    // News/posts go stale in hours; videos and podcast episodes stay relevant for days (read marks stop repeats)
    const gen = new Date(d?.generated || Date.now()).getTime();
    const maxAge = it => (it.type === 'video' || it.type === 'episode' ? (S.settings.digestVideoDays || 14) * 864e5 : S.settings.digestHours * 3600e3);
    const def = this.lensDef(lens), groups = this.groups();
    const how = (types || []).filter(t => Lens.HOW.includes(t));      // older sessions stored source types; ignore those
    const list = this.allItems().filter(it => !S.digestRead[it.id] && (!it.published || Math.max(gen, Date.now() - 864e5) - new Date(it.published) <= maxAge(it))
        && Lens.matches({ ...it, tags: this.tagsOf(it) }, def, groups, how))
      .sort((a, b) => ((b.matched || []).length - (a.matched || []).length) || ((b.score || 0) - (a.score || 0)) || (new Date(b.published) - new Date(a.published)));
    return cap ? list.slice(0, S.settings.digestMax) : list;
  },
  /** Keep today's session, or start a fresh one (optionally with a new lens / types). */
  ensureSession(forceNew, opts = {}) {
    const td = today(), ses = S.digestSession;
    if (!forceNew && ses && ses.day === td) {
      if (!ses.built && C.digest) { ses.ids = this.candidates(ses.lens, ses.types).map(i => i.id); ses.built = true; save(); }  // data arrived late
      return ses;
    }
    const lens = opts.lens ?? ses?.lens ?? this.defaultLens(opts.context);
    const types = opts.types ?? null;
    S.digestSession = { day: td, lens, types, ids: this.candidates(lens, types).map(i => i.id), built: !!C.digest,
      startedAt: opts.keepClock ? ses?.startedAt : null, endsAt: opts.keepClock ? ses?.endsAt : null };
    save(); return S.digestSession;
  },
  /** Switch lens/types mid-session: same time-box, new frozen list. */
  switchTo(lens, types) { this.ensureSession(true, { lens, types, keepClock: true }); },
  /** The countdown starts the first time a non-empty list is shown. */
  startClock() {
    const ses = this.ensureSession(false);
    if (!ses.ids.some(id => !S.digestRead[id])) return;          // nothing to read → no countdown
    if (!ses.endsAt) { ses.startedAt = Date.now(); ses.endsAt = Date.now() + S.settings.digestMin * 60000; save(); }
  },
  unreadCount(lens = ALL) { return this.candidates(lens, null, false).length; },
  sessionUnread() { const ses = S.digestSession; return ses && ses.day === today() ? ses.ids.filter(id => !S.digestRead[id] && this.byId(id)).length : 0; },
  mark(id) { S.digestRead[id] = Date.now(); this.prune(); save(); },
  /** Forget read-marks older than 30 days so storage stays small. */
  prune() { const cut = Date.now() - 30 * 864e5; for (const [k, v] of Object.entries(S.digestRead)) if (v < cut) delete S.digestRead[k]; },
  stats() {
    const ses = S.digestSession, ids = ses?.ids || [];
    const saved = ids.filter(id => S.watch.some(w => w.digestId === id)).length;
    return { total: ids.length, saved, read: ids.filter(id => S.digestRead[id]).length - saved };
  },
};
const lensName = l => (!l || l === ALL ? 'Everything' : l);
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);

/** Lens chips (with unread counts) + type chips. */
function lensBar(ses) {
  const lenses = Object.keys(Digest.lenses());
  const chip = (l) => { const n = Digest.unreadCount(l); return `<button class="chip ${ses.lens === l ? 'on' : ''}" data-act="digestLens" data-lens="${esc(l)}" ${!n && ses.lens !== l ? 'style="opacity:.5"' : ''}>${esc(lensName(l))} <span class="num">${n}</span></button>`; };
  const types = ses.types || [];
  // one swipeable row (like the mode chips) so the list itself stays above the fold on a phone
  return `<div class="modes" style="margin:0 0 6px;padding-bottom:2px">${[ALL, ...lenses].map(chip).join('')}</div>
    <div class="modes" style="margin:0 0 10px">${Object.entries(HOW_LABEL).map(([t, l]) => `<button class="chip ${types.includes(t) ? 'on' : ''}" data-act="digestType" data-type="${t}" style="min-height:32px;font-size:.8rem">${l}</button>`).join('')}</div>`;
}

/** The digest reading UI (used in the morning flow and in stand-alone sessions). */
function digestHtml(context = 'morning') {
  const d = C.digest?.data, ses = Digest.ensureSession(false, { context });
  let h = '';
  if (d?.sample) h += `<div class="banner">Sample digest — your real feeds replace this after the GitHub Action’s first run (see Help → Stage 3 setup).</div>`;
  if (Digest.error && C.digest) h += `<div class="banner">${Digest.error === 'offline' ? '⚠ Offline' : '⚠ ' + esc(Digest.error)} — showing the copy from ${ago(C.digest.fetchedAt)}.</div>`;
  if (d && S.watchlist?.updatedAt && d.watchlistUpdatedAt && new Date(S.watchlist.updatedAt) > new Date(d.watchlistUpdatedAt))
    h += `<div class="banner">Your newest watchlist edits aren’t in this digest yet — it rebuilds a few minutes after you publish.</div>`;
  if (!d) {
    return h + `<div class="empty">${Digest.loading ? 'Loading digest…' : Digest.error === 'offline' ? 'Offline and no saved digest yet.' : 'No digest available' + (Digest.error ? ': ' + esc(Digest.error) : '') + '.'}</div>
      ${Digest.loading ? '' : '<div class="actions"><button class="btn sm" data-act="digestRetry">Retry</button></div>'}`;
  }
  // Freshness, always visible: the service worker may serve a cached digest.json offline without an error.
  h += `<div class="small muted" style="margin-bottom:8px">${!navigator.onLine ? '⚠ Offline · ' : ''}Digest built ${ago(new Date(d.generated).getTime())}${!navigator.onLine ? ' (last known copy)' : ''}${d.stats ? ` · ${d.stats.ok}/${d.stats.feeds} feeds OK` : ''}</div>`;
  h += lensBar(ses);
  const items = ses.ids.map(id => Digest.byId(id)).filter(Boolean);
  const unread = items.filter(i => !S.digestRead[i.id]);
  const st = Digest.stats();
  // ---- caught up: the whole point of the digest ----
  if (!unread.length) {
    const took = ses.startedAt ? Math.max(1, Math.round((Math.min(Date.now(), ses.endsAt || Date.now()) - ses.startedAt) / 60000)) : 0;
    const others = Object.keys(Digest.lenses()).filter(l => l !== ses.lens).map(l => [l, Digest.unreadCount(l)]).filter(([, n]) => n);
    return h + `<div class="caught"><div class="big">✓</div><div class="hello">You’re caught up${ses.lens !== ALL ? ' on ' + esc(lensName(ses.lens)) : ''}</div>
      <p class="muted">${items.length ? `${items.length} items: ${st.read} read + ${st.saved} saved for later${took ? ` · ${took} min` : ''}` : 'Nothing new here since last time.'}</p>
      <p class="small muted">There’s no more. That’s by design.${others.length ? `<br>Elsewhere: ${others.map(([l, n]) => `${esc(l)} ${n}`).join(' · ')}` : ''}</p>
      ${freshPromptHtml(true)}
      ${context === 'standalone' ? '<div class="actions" style="justify-content:center"><button class="btn primary" data-act="closeMorning">Close</button></div>' : ''}</div>`;
  }
  // ---- time's up: stop, without guilt ----
  const timeUp = ses.endsAt && Date.now() >= ses.endsAt;
  if (timeUp) h += `<div class="banner warn"><b>Time’s up.</b> ${unread.length} left — they’ll keep, or let them go.
    <div class="actions"><button class="btn sm" data-act="digestExtend">+5 min</button><button class="btn sm primary" data-act="digestDone">${context === 'morning' ? 'Done — next step' : 'Done'}</button></div></div>`;
  // progress (with the counting shown)
  const done = items.length - unread.length;
  h += `<div class="small muted num">${done} of ${items.length} done · ${unread.length} to go</div><div class="bar"><i style="width:${(done / items.length * 100).toFixed(1)}%"></i></div>`;
  // group under a heading: the item's first tag that the lens asked for, else its first topic tag
  const L = Lens.normalize(Digest.lensDef(ses.lens)), pref = [...L.any, ...L.topic, ...L.genre], groups = {};
  for (const it of unread) {
    const tags = Digest.tagsOf(it).map(t => t.toLowerCase()).filter(t => t !== 'listen');
    const g = pref.find(t => tags.includes(t)) || tags.find(t => Lens.groupOf(t, Digest.groups()) === 'topic') || tags[0] || 'other';
    (groups[g] ||= []).push(it);
  }
  for (const [tag, list] of Object.entries(groups)) {
    h += `<div class="catname">${esc(cap1(tag))} <span class="tag">${list.length}</span></div><ul class="list dg">`;
    for (const it of list) {
      const age = it.published ? ago(new Date(it.published).getTime()) : '';
      h += `<li><div class="grow" style="cursor:default">
          <a href="${esc(it.url)}" target="_blank" rel="noopener" data-act="digestOpen" data-id="${esc(it.id)}">${it.type === 'video' ? '▶ ' : ''}${esc(it.title)}</a>
          <div class="small muted">${esc(it.source || '')}${it.alsoIn ? ' +' + it.alsoIn.length : ''}${age ? ' · ' + age : ''}${it.duration ? ' · ' + esc(it.duration) : ''}${it.score ? ` · <span title="${esc(it.why || '')}">score ${it.score}</span>` : ''}</div>
          ${(it.matched || []).map(k => `<span class="kw">${esc(k)}</span>`).join('')}
          ${it.summary ? `<div class="sum">${esc(it.summary)}</div>` : ''}</div>
        ${it.type === 'video' ? `<button class="icon" data-act="watchHere" data-id="${esc(it.id)}" title="Watch here" aria-label="Watch here">▶</button>` : ''}
        <button class="icon" data-act="digestSave" data-id="${esc(it.id)}" title="Save for later" aria-label="Save for later"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
        <button class="icon" data-act="digestRead" data-id="${esc(it.id)}" title="Mark read" aria-label="Mark read">✓</button></li>`;
    }
    h += `</ul>`;
  }
  h += `<div class="actions"><button class="btn ghost sm" data-act="digestAllRead">Mark all ${unread.length} read</button></div>`;
  return h;
}

/* ---------------- MORNING SEQUENCE (4 steps) ----------------
   1 Today (weather + calendar + plan) · 2 Top 3 · 3 Digest (time-boxed) · 4 Start work */
let overlayMode = 'morning';   // 'morning' | 'digest' (stand-alone digest session)
const STEPS = ['Today', 'Top 3', 'Digest', 'Go'];

function openMorning() {
  const td = today();
  S.morning[td] ||= { startedAt: Date.now(), step: 1 };
  save();
  overlayMode = 'morning';
  $('#morning').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  Weather.refresh(); Digest.refresh();
  render(); $('#morning').scrollTo({ top: 0 });
}
function openDigest() {
  overlayMode = 'digest';
  const ses = Digest.ensureSession(false, { context: 'standalone' });
  // a finished/expired session from earlier today: start a new one with the lens for the current mode
  if (ses.endsAt && (Date.now() >= ses.endsAt || !ses.ids.some(id => !S.digestRead[id]))) Digest.ensureSession(true, { lens: Digest.defaultLens('standalone') });
  Digest.startClock();
  $('#morning').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  Digest.refresh(); render();
}
function closeMorning() { $('#morning').classList.add('hidden'); document.body.style.overflow = ''; render(); }
/** Called at boot and when the app comes back to the foreground. */
function maybeAutoMorning() {
  const st = S.settings, now = new Date(), td = today();
  if (!st.welcomed || !st.morningAuto || S.morning[td] || morningOpen()) return;
  if (now.getHours() < st.dayCutoff) return;                           // 01:30 is still "last night"
  const latest = Engine.parseHM(st.morningLatest);
  if (!isNaN(latest) && now.getHours() * 60 + now.getMinutes() >= latest) return;   // first open was after lunch: don't ambush
  openMorning();
}
const morningDone = () => !!S.morning[today()]?.doneAt;

function renderMorning() {
  const el = $('#morning'); if (!morningOpen()) return;
  const now = new Date();
  // stand-alone digest: just the timer + list
  if (overlayMode === 'digest') {
    const ses = S.digestSession;
    el.innerHTML = `<div class="ov-head"><div><b style="flex:1">Digest</b>${dgClock(ses)}<button class="icon" data-act="closeMorning" aria-label="Close">✕</button></div></div>
      <div class="ov-body">${digestHtml('standalone')}</div>`;
    return;
  }
  const m = S.morning[today()] || { step: 1 }, step = m.step || 1;
  let body = '';
  if (step === 1) {
    const hour = now.getHours(), hi = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const evs = allEvents().filter(e => Engine.dateKey(new Date(e.start)) === Engine.dateKey(now) || (e.allDay && new Date(e.start) <= now && new Date(e.end) > now))
      .sort((a, b) => new Date(a.start) - new Date(b.start));
    const plan = Engine.agenda(now, engineState(), 10).filter(a => Engine.dateKey(a.at) === Engine.dateKey(now));
    body = `<div class="hello">${hi}${S.settings.name ? ', ' + esc(S.settings.name) : ''}.</div>
      <div class="muted">${now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
      ${Briefing.html()}
      <div class="card">${Weather.html()}</div>
      <h2>Calendar</h2><div class="card">${evs.length ? `<ul class="list">${evs.map(e => `<li><span class="num muted" style="width:96px">${e.allDay ? 'all day' : fmtT(new Date(e.start)) + '–' + fmtT(new Date(e.end))}</span><span class="grow">${e.color ? `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${esc(e.color)};margin-right:6px"></span>` : ''}${esc(e.title)}${e.info ? ' <span class="tag">free</span>' : ''}${e.location ? ` <span class="small muted">· ${esc(e.location)}</span>` : ''}</span></li>`).join('')}</ul>`
        : '<div class="empty">No events today.</div>'}
        ${calNoteHtml()}</div>
      ${Google.on('gmail') && C.gmail ? `<h2>Gmail</h2><div class="card">${mailHtml(true)}</div>` : ''}
      <h2>The plan</h2><div class="card"><ul class="list">${[R.current, ...plan].filter(x => x && x.type !== 'gap').map(a => `<li><span class="num muted" style="width:96px">${a.at ? fmtT(a.at) : 'now'}</span><span class="grow">${esc(a.title)}${a.type === 'event' ? ' <span class="tag">event</span>' : ''}</span></li>`).join('')}</ul></div>`;
  } else if (step === 2) {
    body = `<div class="hello">Today’s top 3</div><p class="muted">If only three things happen today, which ones?</p>${top3Html(false)}
      <p class="small muted">Tap an empty slot to pick from your tasks. Add new tasks in the Tasks tab or with + later.</p>`;
  } else if (step === 3) {
    Digest.ensureSession(false, { context: 'morning' }); Digest.startClock();
    body = `<div class="hello">Digest</div><p class="muted">${S.settings.digestMin} minutes, then it stops.</p>${digestHtml('morning')}`;
  } else {
    // step 4: ready
    const R0 = Engine.resolve(now, engineState());
    const pick = R0.current.pick || Engine.pickTask(S, today());
    const nextWork = Engine.blockInstances(S.routine, now).find(b => Engine.WORK_KINDS.has(b.kind) && b.end > now && Engine.dateKey(b.start) === Engine.dateKey(now));
    const st = Digest.stats();
    body = `<div class="hello">Ready.</div>
      <div class="card"><div class="small muted">First up</div><div style="font-size:1.25rem;font-weight:600">${pick ? esc(pick.task.title) : 'No task picked'}</div>
      <div class="muted small">${nextWork ? (nextWork.start <= now ? `${esc(nextWork.name)} is on now` : `${esc(nextWork.name)} starts ${fmtT(nextWork.start)} (in ${fmtDur(nextWork.start - now)}) — starting now switches you to Work mode early`) : 'No work block today — this starts a focus session anyway'}</div></div>
      <div class="kpi" style="margin-top:12px"><div><b class="num">${top3Ids().length}/3</b>top 3 set</div><div><b class="num">${st.read + st.saved}/${st.total}</b>digest done</div><div><b class="num">${S.watch.length}</b>on the shelf</div></div>
      <div class="actions" style="margin-top:22px"><button class="btn primary" data-act="startWork" style="min-height:64px;font-size:1.15rem">▶ Start work · ${S.settings.pomoWork}-min focus</button></div>
      <div class="actions"><button class="btn ghost" data-act="morningFinish" style="flex:1">Not working today — just close</button></div>`;
  }
  const ses = S.digestSession;
  el.innerHTML = `<div class="ov-head"><div><div class="dots" aria-label="Step ${step} of 4">${STEPS.map((_, i) => `<i class="${i < step ? 'on' : ''}"></i>`).join('')}</div>
      ${step === 3 ? dgClock(ses) : `<span class="small muted">${STEPS[step - 1]}</span>`}
      <button class="icon" data-act="morningSkip" aria-label="Close morning sequence">✕</button></div></div>
    <div class="ov-body">${body}</div>
    ${step < 4 ? `<div class="ov-foot"><div>${step > 1 ? '<button class="btn" data-act="morningBack">Back</button>' : ''}
      <button class="btn primary" data-act="morningNext" style="flex:1">${step === 3 ? (Digest.sessionUnread() ? 'Skip the rest' : 'Next') : 'Next'}</button></div></div>` : ''}`;
}
/** "12:41" countdown chip for the digest header. */
function dgClock(ses) {
  if (!ses?.endsAt) return '';
  const left = ses.endsAt - Date.now();
  return `<span class="dgclock num ${left <= 0 ? 'over' : ''}" id="dgClock">${left > 0 ? fmtClock(left) : '0:00'}</span>`;
}

/* ---------------- Stage 2 actions (merged into ACT below) ---------------- */
const ACT2 = {
  morning() { if (R.current.type === 'block') setActive(R.current); openMorning(); },
  morningNext() { const m = S.morning[today()]; m.step = Math.min(4, (m.step || 1) + 1); save(); render(); $('#morning').scrollTo({ top: 0 }); },
  morningBack() { const m = S.morning[today()]; m.step = Math.max(1, (m.step || 1) - 1); save(); render(); $('#morning').scrollTo({ top: 0 }); },
  morningSkip() { const m = S.morning[today()]; if (m && !m.doneAt) m.skipped = true; save(); closeMorning(); },
  morningFinish() { S.morning[today()].doneAt = Date.now(); S.active = null; save(); closeMorning(); go('now'); },
  closeMorning() { closeMorning(); },
  /** "Start work": finish the morning, switch to Work, start the first Pomodoro. */
  startWork() {
    const now = new Date();
    S.morning[today()].doneAt = Date.now(); S.active = null;
    const R0 = Engine.resolve(now, engineState());
    if (!Engine.WORK_KINDS.has(R0.current.kind)) {
      // Not in a work block yet: manual Work mode until the next work block begins (auto takes over from
      // there), capped at 2 h so a weekend "start work" doesn't stick all day.
      const nb = Engine.blockInstances(S.routine, now).find(b => Engine.WORK_KINDS.has(b.kind) && b.start > now);
      const until = nb && nb.start - now <= 2 * 3600e3 ? nb.start : new Date(now.getTime() + 2 * 3600e3);
      S.modeOverride = { mode: 'work', until: until.toISOString() };
    }
    const R1 = Engine.resolve(now, engineState());
    if (R1.current.type === 'block' && Engine.WORK_KINDS.has(R1.current.kind)) setActive(R1.current);
    Pomo.start('work', R1.current.pick?.task.id || null);
    save(); closeMorning(); go('now'); askNotifOnce();
    FocusAlarm.set();                                   // phone alarm at the end of this focus (Stage 4)
    if (gset().blockAlarms && Google.ready('reminders')) setBlockAlarms();
  },
  // digest
  digestOpen(el) { Digest.mark(el.dataset.id); setTimeout(render, 400); },     // let the link open first
  digestRead(el) { Digest.mark(el.dataset.id); render(); },
  digestSave(el) {
    const it = Digest.byId(el.dataset.id); if (!it) return;
    if (!S.watch.some(w => w.digestId === it.id))
      S.watch.push({ id: uid(), digestId: it.id, title: it.title, url: it.url, source: it.source, category: it.category, type: it.type, duration: it.duration,
        durationSec: it.durationSec, tags: Digest.tagsOf(it), created: Date.now() });
    Digest.mark(it.id); toast('Saved to the watch-later shelf'); render();
  },
  digestAllRead() { S.digestSession.ids.forEach(id => { if (!S.digestRead[id]) S.digestRead[id] = Date.now(); }); save(); render(); },
  digestExtend() { S.digestSession.endsAt = Date.now() + 5 * 60000; S.digestSession.extra = (S.digestSession.extra || 0) + 5; save(); render(); },
  digestDone() { if (overlayMode === 'morning') ACT2.morningNext(); else closeMorning(); },
  digestRetry() { Digest.refresh(); },
  digestStart() { openDigest(); },
  // weather & location
  weatherRefresh(el, e) { e?.preventDefault(); Weather.refresh(true); },
  locGeo() {
    if (!navigator.geolocation) return toast('Location isn’t available here — search a city instead.');
    toast('Getting your location…');
    navigator.geolocation.getCurrentPosition(pos => {
      S.settings.location = { name: 'My location', lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3) };
      save(); Weather.refresh(true);
    }, err => toast('Location failed: ' + err.message), { timeout: 15000, maximumAge: 3600e3 });
  },
  async locSearch() {
    const v = await formSheet('Weather location', [{ name: 'q', label: 'City or postcode', value: '' }], { okLabel: 'Search' });
    if (!v?.q) return;
    try {
      const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name=' + encodeURIComponent(v.q));
      const res = (await r.json()).results || [];
      const pick = await choose('Which one?', res.map(x => ({ value: x, label: [x.name, x.admin1, x.country].filter(Boolean).join(', ') })));
      if (!pick) return;
      S.settings.location = { name: pick.name, lat: pick.latitude, lon: pick.longitude };
      save(); Weather.refresh(true);
    } catch (e) { toast(navigator.onLine ? 'Search failed: ' + e.message : 'You’re offline — try again later.'); }
  },
  watchDone(el) { S.watch = S.watch.filter(i => i.id !== el.dataset.id); save(); render(); },
};
</script>

<script>
/* =====================================================================
   PART 4c — STAGE 3: WATCHLIST, FEED HEALTH, PUBLISHING, FRESH-CONTENT
   PROMPT, MORNING-BRIEFING SLOT

   Where the watchlist lives:
     • feeds.json in your GitHub repo is what the Action reads.
     • S.watchlist is the app's working copy (part of your data/backups).
     • Edit here → "Publish" writes feeds.json to GitHub with your token
       (or "Download" and upload it yourself) → the push triggers the Action
       → a fresh digest.json a few minutes later.
   ===================================================================== */
const SECRET_KEY = 'dailycommand.secret';   // GitHub token: kept OUT of exports and sync on purpose
const secret = () => { try { return JSON.parse(localStorage.getItem(SECRET_KEY)) || {}; } catch (e) { return {}; } };
const setSecret = o => { try { localStorage.setItem(SECRET_KEY, JSON.stringify({ ...secret(), ...o })); } catch (e) {} };
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const FEED_TYPES = { youtube: 'YouTube channel', reddit: 'Subreddit', googlenews: 'Google News search', rss: 'RSS / blog URL' };
const FEED_ICON = { youtube: '▶', reddit: 'r/', googlenews: 'N', rss: '✎' };

const Watchlist = {
  remote: null, error: '',
  /** Load feeds.json from the site; adopt it unless we have unpublished local edits. */
  async refresh() {
    try {
      const r = await fetch('feeds.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const doc = await r.json(); if (doc.offline || !Array.isArray(doc.feeds)) throw new Error('offline');
      this.remote = doc; this.error = '';
      const local = S.watchlist;
      if (!local) { S.watchlist = doc; S.watchlistDirty = false; save(); }
      else if (!S.watchlistDirty && new Date(doc.updatedAt || 0) > new Date(local.updatedAt || 0)) { S.watchlist = doc; save(); }
    } catch (e) { this.error = e.message; }
    rerenderAll();
  },
  /** Remote changed after our local edits started (e.g. edited on the other device). */
  conflict() { return S.watchlistDirty && this.remote && new Date(this.remote.updatedAt || 0) > new Date(S.watchlistBase || 0); },
  touch() {
    if (!S.watchlistDirty) S.watchlistBase = S.watchlist.updatedAt || null;
    S.watchlist.updatedAt = new Date().toISOString(); S.watchlistDirty = true; save();
  },
  tags() {
    const count = {};
    (S.watchlist?.feeds || []).forEach(f => (f.tags || []).forEach(t => { count[t] = (count[t] || 0) + 1; }));
    return Object.entries(count).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  },
  health(id) { return (C.digest?.data.feeds || []).find(f => f.id === id) || null; },
  /** ok / cached / waiting are fine; unresolved / error / empty need a look. */
  isProblem(id) { const h = this.health(id); return !!h && !['ok', 'cached', 'waiting'].includes(h.status); },
  json() { return JSON.stringify(S.watchlist, null, 2) + '\n'; },
};

/* ---------------- GitHub (optional): publish feeds.json, trigger a rebuild ----------------
   Uses a fine-grained personal access token limited to ONE repository with
   "Contents: Read and write" (+ "Actions: Read and write" for "Refresh now").
   The token is stored only in this browser and never exported or synced. */
const GH = {
  ready() { return !!(S.settings.ghRepo && secret().ghToken); },
  async call(path, opts = {}) {
    const r = await fetch(`https://api.github.com/repos/${S.settings.ghRepo}${path}`, { ...opts,
      headers: { Authorization: `Bearer ${secret().ghToken}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (!r.ok && r.status !== 404) {
      let msg = ''; try { msg = (await r.json()).message; } catch (e) {}
      throw new Error(r.status === 401 ? 'token rejected (401) — check or renew it' : r.status === 403 ? 'not allowed (403) — the token needs Contents: read & write on this repo' : `${r.status} ${msg}`);
    }
    return r;
  },
  async publishFeeds() {
    const branch = S.settings.ghBranch || 'main';
    const cur = await this.call(`/contents/feeds.json?ref=${encodeURIComponent(branch)}`);
    const sha = cur.status === 404 ? undefined : (await cur.json()).sha;
    const bytes = new TextEncoder().encode(Watchlist.json());
    let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
    await this.call('/contents/feeds.json', { method: 'PUT', body: JSON.stringify({ message: 'watchlist: update from the app', content: btoa(bin), sha, branch }) });
  },
  async refreshDigest() {
    const r = await this.call('/actions/workflows/digest.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: S.settings.ghBranch || 'main' }) });
    if (r.status === 404) throw new Error('workflow not found — is .github/workflows/digest.yml in the repo?');
  },
};

/* ---------------- "Add something fresh" prompt ----------------
   If the newest feed in your watchlist was added more than N days ago (default 30),
   gently suggest adding something new. Snooze-able. The subtraction is shown. */
function freshDue() {
  const days = S.settings.freshDays, feeds = S.watchlist?.feeds || [];
  if (!days || !feeds.length) return null;
  if (S.freshSnoozeUntil && Date.now() < new Date(S.freshSnoozeUntil)) return null;
  const dated = feeds.filter(f => /^\d{4}-\d{2}-\d{2}/.test(f.added || '')).sort((a, b) => b.added.localeCompare(a.added));
  if (!dated.length) return null;
  const last = dated[0], [y, m, d] = last.added.slice(0, 10).split('-').map(Number);
  const lastDay = new Date(y, m - 1, d), td = new Date(today());
  const age = Math.round((td - lastDay) / 864e5);               // whole days, DST-safe via rounding
  return age >= days ? { age, days, last, lastDay, td } : null;
}
function freshPromptHtml(compact = false) {
  const f = freshDue(); if (!f) return '';
  const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `<div class="card" style="text-align:left${compact ? ';margin-top:18px' : ''}"><h3>Time for something new?</h3>
    <p class="small muted">Nothing’s been added to your watchlist for ${f.age} days (last: ${esc(f.last.name)}). A new channel, subreddit or news topic keeps the digest from going stale.</p>
    <div class="math">${fmt(f.td)} − ${fmt(f.lastDay)} = ${f.age} days ≥ ${f.days}-day reminder</div>
    <div class="actions"><button class="btn sm primary" data-act="feedAdd">+ Add a feed</button><button class="btn sm" data-act="freshSnooze">Snooze 2 weeks</button></div></div>`;
}

/* ---------------- Watchlist editor (More → Watchlist & lenses) ---------------- */
let wlFilter = '';
function watchlistHtml() {
  const W = S.watchlist;
  if (!W) return `<div class="empty">${Watchlist.error ? 'Couldn’t load feeds.json (' + esc(Watchlist.error) + ').' : 'Loading feeds.json…'}</div>
    <div class="actions"><button class="btn sm" data-act="wlReload">Retry</button><label class="btn sm">Import feeds.json<input type="file" accept=".json,application/json" id="feedsFile" hidden></label></div>`;
  const feeds = W.feeds || [];
  const checks = feeds.filter(f => f.check).length;
  const probs = feeds.filter(f => Watchlist.isProblem(f.id)).length;
  const d = C.digest?.data;
  let h = freshPromptHtml();
  h += `<div class="kpi"><div><b class="num">${feeds.length}</b>feeds</div><div><b class="num">${checks}</b>to check</div><div><b class="num">${probs}</b>problems</div></div>

    const hh = Watchlist.health(f.id);
    const st = !hh ? '<span class="muted">not fetched yet</span>'
      : hh.status === 'ok' ? `✓ ${hh.count} recent${hh.resolved && hh.resolved.via === 'name search' ? ` · found “${esc(hh.resolved.title)}”` : ''}`

      : `<span class="warnchip">⚠ ${esc(hh.error || hh.status)}</span>`;
    return `<li><span class="tag" style="width:30px;text-align:center">${FEED_ICON[f.type] || '•'}</span><span class="grow" data-act="feedEdit" data-id="${esc(f.id)}">
      <b>${esc(f.name)}</b>${f.paused ? ' <span class="tag">paused</span>' : ''}<br>

      <br><span class="small muted">${st}</span>${f.check ? `<br><span class="small warnchip">Check: ${esc(f.check)}</span>` : ''}</span></li>`;
  }).join('') || '<li class="empty">Nothing here.</li>'}</ul>
  <div class="actions"><button class="btn primary" data-act="feedAdd">+ Add feed</button>
    <button class="btn sm" data-act="wlDownload">Download feeds.json</button>

  h += `<h3 style="margin-top:18px">Lenses</h3><p class="small muted">A lens is a mix of tags for a mood. Pick one at the top of the digest.</p>
    <ul class="list">${lenses.map(([n, t]) => `<li><span class="grow" data-act="lensEdit" data-lens="${esc(n)}"><b>${esc(n)}</b><br><span class="small muted">${esc(Lens.describe(t))}</span></span><span class="tag num">${Digest.unreadCount(n)} new</span></li>`).join('')}</ul>
    <div class="actions"><button class="btn sm" data-act="lensAdd">+ Lens</button></div>
    ${tagGroupsHtml()}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">${['work', 'life', 'leisure', 'winddown'].map(m => `<label class="f">${MODE_LABEL[m]} uses${lensSelect('lens.' + m, (S.settings.lensByMode || {})[m])}</label>`).join('')}</div>`;

    <textarea id="kwText" style="min-height:90px">${esc(kw)}</textarea><div class="actions"><button class="btn sm" data-act="kwSave">Save keywords</button></div>`;

  // reminder + GitHub

function lensSelect(key, val) {
  return `<select data-setting="${key}"><option value="${ALL}">Everything</option>${Object.keys(S.watchlist?.lenses || {}).map(l => `<option ${l === val ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
}
const parseTags = s => [...new Set(String(s || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean))];

async function editFeed(f) {
  const isNew = !f, tagHint = tagHintText();
  const src = f ? (f.type === 'youtube' ? (f.handle || f.channelId || f.url || '') : f.type === 'reddit' ? (f.sub || f.name) : f.type === 'googlenews' ? (f.query || '') : (f.url || '')) : '';
  const v = await formSheet(isNew ? 'Add a feed' : 'Edit feed', [
    { name: 'type', label: 'Type', type: 'select', value: f?.type || 'youtube', options: Object.entries(FEED_TYPES).map(([value, label]) => ({ value, label })) },
    { name: 'name', label: 'Name', value: f?.name || '' },
    { name: 'src', label: 'YouTube: @handle, link or leave blank to search by name · Subreddit: r/name · News: search words · RSS: feed URL', value: src },
    { name: 'tags', label: 'Tags (comma-separated) — topics, genres, activities', value: (f?.tags || []).filter(t => t !== 'listen').join(', ') },
    { name: 'listenOk', label: 'How', type: 'checkbox', value: (f?.tags || []).includes('listen'), hint: 'Fine to just listen to (talk-heavy) — goes in the Listen queue' },
    { name: 'boost', label: 'Score boost for this feed (−3 … +3)', type: 'number', value: f?.boost || 0, min: -3, max: 3 },
    { name: 'paused', label: 'Paused', type: 'checkbox', value: f?.paused, hint: 'Pause (keep it, don’t fetch)' },
  ], { deletable: !isNew, okLabel: isNew ? 'Add' : 'Save', note: tagHint });
  if (!v) return;
  const W = S.watchlist;
  if (v.__delete) { W.feeds = W.feeds.filter(x => x.id !== f.id); Watchlist.touch(); return render(); }
  if (!v.name && !v.src) return toast('Give it a name (or a handle/URL).');
  const nf = { ...(f || {}), type: v.type, name: v.name || v.src, tags: [...parseTags(v.tags).filter(t => t !== 'listen'), ...(v.listenOk ? ['listen'] : [])], boost: Number(v.boost) || 0 };
  delete nf.handle; delete nf.channelId; delete nf.url; delete nf.sub; delete nf.query;
  const s = v.src.trim();
  if (v.type === 'youtube' && s) { if (/UC[\w-]{22}/.test(s)) nf.channelId = s.match(/UC[\w-]{22}/)[0]; else if (/^@|youtube\.com\/@/.test(s)) nf.handle = '@' + s.replace(/.*youtube\.com\/@/, '').replace(/^@/, '').split(/[/?#]/)[0]; else nf.url = s; }
  if (v.type === 'reddit') nf.sub = (s || v.name).replace(/^.*?\/?r\//i, '').replace(/\/.*$/, '');
  if (v.type === 'googlenews') nf.query = s || v.name;
  if (v.type === 'rss') { if (!/^https?:\/\//.test(s)) return toast('RSS needs a full feed URL (https://…).'); nf.url = s; }
  if (v.paused) nf.paused = true; else delete nf.paused;
  if (!nf.boost) delete nf.boost;
  if (isNew) {
    nf.id = (v.type === 'youtube' ? 'yt' : v.type === 'reddit' ? 'rd' : v.type === 'googlenews' ? 'gn' : 'rss') + '-' + slug(nf.name);
    while (W.feeds.some(x => x.id === nf.id)) nf.id += '-2';
    nf.added = Engine.dateKey(new Date());                      // feeds the "add something fresh" reminder
    W.feeds.push(nf);
  } else {
    delete nf.check;                                            // you've looked at it — no longer "to check"
    W.feeds = W.feeds.map(x => (x.id === f.id ? nf : x));
  }
  Watchlist.touch(); render();
  toast(isNew ? `Added ${nf.name}. Publish to include it in the digest.` : 'Saved.');
}
/** "Topics: … · Genres: … · Activities: …" — shown under tag fields so you can see what exists. */
function tagHintText() {
  const t = Lens.tagsByGroup(S.watchlist?.feeds || [], S.watchlist?.tagGroups || {});
  return [['Topics', t.topic], ['Genres', t.genre], ['Activities', t.activity]].filter(([, l]) => l.length).map(([n, l]) => `<b>${n}:</b> ${esc(l.join(', '))}`).join('<br>');
}
/** Lens editor: within a field = any of these; across fields = and. */
async function editLens(name) {
  const W = S.watchlist, L = Lens.normalize(name ? W.lenses[name] : null);
  const v = await formSheet(name ? 'Edit lens' : 'New lens', [
    { name: 'name', label: 'Name', value: name || '' },
    { name: 'topic', label: 'Topics (any of)', value: L.topic.join(', ') },
    { name: 'genre', label: 'Genres (any of)', value: L.genre.join(', ') },
    { name: 'activity', label: 'Activities (any of)', value: L.activity.join(', ') },
    { name: 'any', label: 'Or simply: any of these tags (older lenses)', value: L.any.join(', ') },
    { name: 'watch', label: 'How', type: 'checkbox', value: L.how.includes('watch'), hint: '▶ Watch (videos)' },
    { name: 'listen', label: '', type: 'checkbox', value: L.how.includes('listen'), hint: '🎧 Listen (podcasts + listen-friendly videos)' },
    { name: 'read', label: '', type: 'checkbox', value: L.how.includes('read'), hint: '📰 Read (articles, news, Reddit)' },
  ], { deletable: !!name, note: `Fields left empty don’t filter. Across fields it’s “and”: Topics politics + Genres debates + Watch = politics debates you can watch.<br>${tagHintText()}` });
  if (!v) return;
  const lenses = { ...(W.lenses || {}) };
  if (name) delete lenses[name];
  if (!v.__delete) {
    if (!v.name) return toast('A lens needs a name.');
    const lens = { topic: parseTags(v.topic), genre: parseTags(v.genre), activity: parseTags(v.activity), any: parseTags(v.any), how: Lens.HOW.filter(h => v[h]) };
    Object.keys(lens).forEach(k => { if (!lens[k].length) delete lens[k]; });
    lenses[v.name] = lens;
  }
  W.lenses = lenses; Watchlist.touch(); render();
}
/** Which tags are genres or activities (everything else is a topic). */
function tagGroupsHtml() {
  const g = S.watchlist?.tagGroups || {}, t = Lens.tagsByGroup(S.watchlist?.feeds || [], g);
  return `<h3 style="margin-top:18px">Tag groups</h3>
    <p class="small muted">Tags are topics unless listed here. Lenses can then combine groups: a topic <i>and</i> a genre <i>and</i> how you want it.</p>
    <div class="small"><b>Topics:</b> ${esc(t.topic.join(', ') || '—')}</div>
    <label class="f">Genres / formats (e.g. debates, standup, documentary, lo-fi, jazz)</label><input type="text" id="tgGenre" value="${esc((g.genre || []).join(', '))}">
