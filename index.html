<script>
/* =====================================================================
   PART 4f — WATCH NEXT + IN-APP PLAYER (Stage 4.5)
   "Watch next" is the video twin of "Listen next": one pick from your
   lens that fits the time left, with two ways to play:
     ▶ Watch here — YouTube's own player inside this app. When the video
       ends you land back here ("Done / Watch another"), not on YouTube's
       recommendations, so one video stays one video. Ad-free if you're
       signed into YouTube in this browser (Premium). Channels that block
       embedding fall back to the YouTube app.
     Open in YouTube — the full app, as before.
   ===================================================================== */
/** Pick from a queue for `secLeft` seconds: fits AND fills ≥ half → fits → unknown length → shortest. */
function pickFit(q, secLeft, label) {
  if (!q.length) return null;
  if (secLeft == null) return { item: q[0], why: '' };
  secLeft = Math.round(secLeft / 60) * 60;
  const left = `${label} ends ${fmtT(new Date(Date.now() + secLeft * 1000))} → ${secLeft / 60} min left`;
  const fits = q.filter(x => x.durationSec && x.durationSec <= secLeft);
  const good = fits.find(x => x.durationSec >= secLeft / 2), fit = good || fits[0];
  if (fit) return { item: fit, why: `${left} · ${mmss(fit.durationSec)} ≤ ${mmss(secLeft)} ✓ fits, fills ${mmss(fit.durationSec)} ÷ ${mmss(secLeft)} = ${Math.round(fit.durationSec / secLeft * 100)}%${good ? '' : ' (nothing longer fits)'}` };
  const unknown = q.find(x => !x.durationSec);
  if (unknown) return { item: unknown, why: `${left} · nothing with a known length fits; this one’s length is unknown` };
  const shortest = [...q].sort((a, b) => a.durationSec - b.durationSec)[0];
  return { item: shortest, why: `${left} · shortest is ${mmss(shortest.durationSec)} = ${Math.ceil((shortest.durationSec - secLeft) / 60)} min over` };
}

const Watch = {
  /** The lens for Watch next: your last choice on this device, else the lens for the current mode. */
  lens() { const l = S.ui.watchLens; return l && (l === ALL || Digest.lenses()[l]) ? l : Digest.defaultLens('standalone'); },
  /** Videos you can watch: saved-to-shelf videos first, then the digest by score — all within the lens. */
  queue(lens = this.lens()) {
    const def = Digest.lensDef(lens), groups = Digest.groups();
    const skipped = new Set((S.watchSkip || {})[today()] || []);
    const shelf = S.watch.filter(w => ytId(w.url) && (!def || Lens.matches({ type: 'video', tags: w.tags || [] }, def, groups, ['watch'])))
      .map(w => ({ key: 'w:' + w.id, shelfId: w.id, digestId: w.digestId, title: w.title, url: w.url, source: w.source, durationSec: w.durationSec, from: 'shelf' }));
    const onShelf = new Set(shelf.map(x => x.digestId).filter(Boolean));
    const vids = Digest.allItems().filter(it => it.type === 'video' && !S.digestRead[it.id] && !onShelf.has(it.id)
        && Lens.matches({ ...it, tags: Digest.tagsOf(it) }, def, groups, ['watch']))
      .sort((a, b) => ((b.score || 0) - (a.score || 0)) || (new Date(b.published) - new Date(a.published)))
      .map(it => ({ key: 'd:' + it.id, digestId: it.id, title: it.title, url: it.url, source: it.source, durationSec: it.durationSec, from: 'digest' }));
    return [...shelf, ...vids].filter(x => !skipped.has(x.key));
  },
  find(key) { return this.queue(ALL).find(x => x.key === key) || Listen.find(key) || null; },
  done(key) { Listen.done(key); },
};

/** Watch next card (Leisure mode, under the Now card). */
function watchCardHtml() {
  const c = R.current, lens = Watch.lens(), q = Watch.queue(lens);
  const secLeft = c.end && c.type !== 'gap' ? Math.max(0, (c.end - Date.now()) / 1000) : null;
  const p = pickFit(q, secLeft, c.title);
  const lensPick = `<select data-act-change="watchLens" aria-label="Lens" style="min-height:36px;padding:4px 8px;width:auto;font-size:.85rem">
    <option value="${ALL}" ${lens === ALL ? 'selected' : ''}>Everything</option>${Object.keys(Digest.lenses()).map(l => `<option ${l === lens ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  if (!p) return `<div class="card listen"><div class="row" style="justify-content:space-between"><span class="small muted">▶ Watch next</span>${lensPick}</div>
    <div class="empty">Nothing to watch in this lens right now${lens !== ALL ? ' — try another' : ''}.</div></div>`;
  const it = p.item;
  return `<div class="card listen"><div class="row" style="justify-content:space-between"><span class="small muted">▶ Watch next${it.from === 'shelf' ? ' · from your shelf' : ''}</span>${lensPick}</div>
    <div style="font-weight:600;margin:4px 0">${esc(it.title)}</div>
    <div class="small muted">${esc(it.source || '')}${it.durationSec ? ' · ' + mmss(it.durationSec) : ''} · ${q.length} in this lens</div>
    ${p.why ? `<div class="math">${esc(p.why)}</div>` : ''}
    <div class="actions"><button class="btn sm primary" data-act="watchHere" data-key="${esc(it.key)}">▶ Watch here</button>
      <a class="btn sm" ${playAttrs(it.url)} data-act="watchApp" data-key="${esc(it.key)}">Open in YouTube</a>
      <button class="btn sm ghost" data-act="watchSkip" data-key="${esc(it.key)}">Skip</button></div></div>`;
}

/* ---------------- the in-app player ---------------- */
let ytApiPromise = null;
function loadYTApi() {
  if (window.YT?.Player) return Promise.resolve();
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev?.(); res(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = () => { ytApiPromise = null; rej(new Error('Couldn’t load the YouTube player (offline?)')); };
    document.head.appendChild(s);
  });
  return ytApiPromise;
}
const Player = {
  item: null, yt: null, state: 'idle',
  async open(item) {
    this.close(true);
    this.item = item; this.state = 'loading';
    const el = $('#player'); el.classList.remove('hidden'); document.body.style.overflow = 'hidden';
    this.paint();
    try { await loadYTApi(); }
    catch (e) { this.state = 'error'; this.err = e.message; return this.paint(); }
    if (this.item !== item) return;                         // closed meanwhile
    this.yt = new YT.Player('ytFrame', {
      videoId: ytId(item.url), width: '100%', height: '100%',
      playerVars: { autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1 },
      events: {
        onReady: () => { this.state = 'playing'; this.paint(false); },
        onStateChange: e => { if (e.data === 0) this.ended(); },          // 0 = ended
        onError: e => { this.state = 'error'; this.err = [101, 150].includes(e.data) ? 'This channel only allows playing on YouTube.' : 'This video isn’t available.'; this.paint(); },
      },
    });
  },
  ended() { this.state = 'ended'; Watch.done(this.item.key); save(); this.paint(); },
  close(silent) {
    try { this.yt?.destroy?.(); } catch (e) {}
    this.yt = null; this.item = null; this.state = 'idle';
    $('#player').classList.add('hidden'); $('#player').innerHTML = ''; document.body.style.overflow = '';
    if (!silent) render();
  },
  /** Draw the overlay. The iframe box is kept when only the status changes (repaint=false). */
  paint(full = true) {
    const it = this.item; if (!it) return;
    const el = $('#player');
    const status = this.state === 'loading' ? '<div class="empty">Loading the player…</div>'
      : this.state === 'error' ? `<div class="banner warn">${esc(this.err)} <a class="btn sm" ${playAttrs(it.url)} data-act="watchApp" data-key="${esc(it.key)}">Open in YouTube</a></div>`
      : this.state === 'ended' ? `<div class="caught" style="padding:14px 0"><div class="hello">Finished ✓</div><p class="muted">Marked as watched. One video stays one video.</p></div>` : '';
    const next = this.state === 'ended' ? pickFit(Watch.queue(), null, '')?.item : null;
    const foot = `<div class="actions">${this.state === 'ended'
        ? `${next ? `<button class="btn primary" data-act="watchHere" data-key="${esc(next.key)}">▶ Watch another: ${esc(next.title.slice(0, 40))}${next.title.length > 40 ? '…' : ''}</button>` : ''}<button class="btn" data-act="playerClose">Back to Now</button>`
        : `<button class="btn" data-act="playerDone">✓ Done</button><button class="btn ghost" data-act="playerClose">Close</button>`}</div>`;
    if (full || !$('#ytBox')) {
      el.innerHTML = `<div class="ov-head"><div><b style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.title)}</b>
          <button class="icon" data-act="playerClose" aria-label="Close player">✕</button></div></div>
        <div class="ov-body" style="padding-bottom:30px">
          <div id="ytBox" class="ytbox ${this.state === 'ended' || this.state === 'error' ? 'hidden' : ''}"><div id="ytFrame"></div></div>
          <div id="ytStatus">${status}</div><div class="small muted" style="margin:6px 0">${esc(it.source || '')}${it.durationSec ? ' · ' + mmss(it.durationSec) : ''}</div>
          <div id="ytFoot">${foot}</div></div>`;
    } else {
      $('#ytStatus').innerHTML = status; $('#ytFoot').innerHTML = foot;
      $('#ytBox').classList.toggle('hidden', this.state === 'ended' || this.state === 'error');
    }
  },
};

const ACT6 = {
  watchHere(el) {
    const key = el.dataset.key || ('d:' + el.dataset.id);
    const it = Watch.find(key) || (el.dataset.id && (() => { const d = Digest.byId(el.dataset.id); return d && { key, digestId: d.id, title: d.title, url: d.url, source: d.source, durationSec: d.durationSec }; })());
    if (!it) return;
    if (!navigator.onLine) return toast('You’re offline — the player needs a connection.');
    if (morningOpen()) closeMorning();
    Player.open(it);
  },
  watchApp(el) { const k = el.dataset.key; setTimeout(() => { if (k) { Watch.done(k); render(); } }, 400); },
  watchSkip(el) { (S.watchSkip ||= {}); (S.watchSkip[today()] ||= []).push(el.dataset.key); save(); render(); },
  playerDone() { if (Player.item) Watch.done(Player.item.key); Player.close(); },
  playerClose() { Player.close(); },
};
</script>

<script>
/* =====================================================================
   PART 4g — SPOTIFY (Stage 4.5)
   Sign-in: Authorization Code with PKCE, done entirely in the browser —
   Spotify allows this without a server. You get a refresh token, so the
   login lasts until Spotify's 6-month limit (from first sign-in), after
   which you sign in again once. Tokens stay on this device (not synced).
   What it does:
     • New episodes from podcasts you follow → the Listen queue and the
       digest's 🎧 Listen chip, with exact lengths (so "fits the 38 min
       left" works). Played-to-the-end episodes are skipped.
     • Your playlists, which you can tag with genres/activities. A playlist
       tagged "focus" becomes the focus audio for Deep work blocks.
     • Play: starts it on your phone's Spotify through Spotify Connect —
       from the desktop, or on the phone without leaving this app. If no
       Spotify device is awake, it opens the Spotify app instead.
   Limits: Spotify's developer mode needs the app owner on Premium; its
   genre/recommendation browsing isn't available to personal apps, so
   genres come from your own tags.
   ===================================================================== */
const SP_SCOPES = ['user-read-playback-state', 'user-modify-playback-state', 'user-read-currently-playing',
  'playlist-read-private', 'playlist-read-collaborative', 'user-library-read', 'user-read-playback-position'];
const SP_ACCOUNTS = 'https://accounts.spotify.com', SP_API = 'https://api.spotify.com/v1';
const spset = () => S.settings.spotify;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const randomStr = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

const Spotify = {
  busy: false,
  clientId() { return (spset().clientId || C.config?.spotifyClientId || '').trim(); },
  redirectUri() { return location.origin + location.pathname.replace(/index\.html$/, ''); },
  connected() { return !!secret().spToken?.refresh_token; },
  token() { const t = secret().spToken; return t && t.access_token && t.expires_at > Date.now() + 60000 ? t : null; },
  /** When Spotify will ask you to sign in again (6 months after the first sign-in). */
  reauthBy() { const a = secret().spToken?.authAt; return a ? new Date(a + 182 * 864e5) : null; },
  async connect() {
    const id = this.clientId();
    if (!id) return toast('Add your Spotify client ID first (More → Spotify).');
    if (!navigator.onLine) return toast('You’re offline — connect when you’re back online.');
    const verifier = randomStr(48), state = randomStr(12);
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    setSecret({ spPkce: { verifier, state, at: Date.now(), view: currentView } });   // remember where to come back to
    const q = new URLSearchParams({ client_id: id, response_type: 'code', redirect_uri: this.redirectUri(), code_challenge_method: 'S256', code_challenge: challenge, scope: SP_SCOPES.join(' '), state });
    location.href = `${SP_ACCOUNTS}/authorize?${q}`;
  },
  /** Called at boot: finishes the sign-in when Spotify sends you back with ?code=… */
  async handleRedirect() {
    const q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return false;
    const clean = () => history.replaceState(null, '', this.redirectUri() + location.hash);
    const pk = secret().spPkce;
    if (q.get('error')) { clean(); toast('Spotify: ' + q.get('error')); return true; }
    if (!pk || q.get('state') !== pk.state) { clean(); toast('Spotify sign-in didn’t match — please try again.'); return true; }
    try {
      const r = await fetch(`${SP_ACCOUNTS}/api/token`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: this.redirectUri(), client_id: this.clientId(), code_verifier: pk.verifier }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error_description || j.error || 'HTTP ' + r.status);
      this.store(j, Date.now());
      setSecret({ spPkce: null });
      clean(); toast('Spotify connected.');
      if (pk.view === 'more') {                                                         // back where you started
        S.ui.open['more-spotify'] = true; go('more');
        setTimeout(() => document.querySelector('[data-sec=more-spotify]')?.scrollIntoView({ block: 'start' }), 60);
      }
      // In an installed app on Android the sign-in may finish in a browser tab; the app picks the login up from shared storage.
      if (!matchMedia('(display-mode: standalone)').matches && document.referrer.includes('spotify.com')) setTimeout(() => toast('Spotify connected — you can close this tab and go back to the app.'), 1500);
      this.refresh(true);
    } catch (e) { clean(); toast('Spotify sign-in failed: ' + e.message); }
    return true;
  },
  store(j, authAt) {
    const old = secret().spToken || {};
    setSecret({ spToken: { access_token: j.access_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000,
      refresh_token: j.refresh_token || old.refresh_token, scope: j.scope || old.scope || '', authAt: authAt || old.authAt || Date.now() } });
  },
  async ensureToken() {
    if (this.token()) return;
    const t = secret().spToken;
    if (!t?.refresh_token) throw Object.assign(new Error('Spotify not connected'), { needAuth: true });
    const r = await fetch(`${SP_ACCOUNTS}/api/token`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: t.refresh_token, client_id: this.clientId() }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (j.error === 'invalid_grant') { setSecret({ spToken: null }); toast('Spotify needs you to sign in again (its 6-month limit).', 'Connect', () => this.connect()); }
      throw Object.assign(new Error(j.error_description || j.error || 'refresh failed'), { needAuth: j.error === 'invalid_grant' });
    }
    this.store(j);
  },
  async api(path, { method = 'GET', body } = {}, retry = true) {
    await this.ensureToken();
    const r = await fetch(SP_API + path, { method, headers: { Authorization: `Bearer ${secret().spToken.access_token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 && retry) { const t = secret().spToken; setSecret({ spToken: { ...t, expires_at: 0 } }); return this.api(path, { method, body }, false); }
    if (r.status === 204 || r.status === 202) return null;
    const j = await r.json().catch(() => null);
    if (!r.ok) throw Object.assign(new Error(j?.error?.message || `HTTP ${r.status}`), { status: r.status, reason: j?.error?.reason });
    return j;
  },
  /** Followed podcasts → recent episodes; playlists; what's playing. */
  async refresh(force = false) {
    if (this.busy || !this.connected() || !navigator.onLine) return;
    if (!force && C.spotify && Date.now() - C.spotify.fetchedAt < 20 * 60000) return this.nowPlaying();
    this.busy = true;
    const out = { fetchedAt: Date.now(), shows: [], episodes: [], playlists: [], error: '' };
    try {
      try {
        const saved = await this.api('/me/shows?limit=50');
        out.shows = (saved?.items || []).map(i => i.show).filter(Boolean).map(s => ({ id: s.id, name: s.name }));
      } catch (e) { out.error = 'Followed podcasts: ' + e.message; }
      for (const id of spset().extraShows || []) if (!out.shows.some(s => s.id === id)) {
        try { const s = await this.api(`/shows/${id}?market=from_token`); out.shows.push({ id: s.id, name: s.name, extra: true }); } catch (e) {}
      }
      const hidden = new Set(spset().hiddenShows || []);
      for (const sh of out.shows.filter(s => !hidden.has(s.id)).slice(0, 20)) {
        try {
          const eps = await this.api(`/shows/${sh.id}/episodes?limit=5&market=from_token`);
          for (const ep of (eps?.items || []).filter(Boolean)) {
            const published = ep.release_date ? new Date(ep.release_date.length === 10 ? ep.release_date + 'T06:00:00Z' : ep.release_date).toISOString() : null;
            if (published && Date.now() - new Date(published) > 21 * 864e5) continue;
            out.episodes.push({ id: 'sp:' + ep.id, type: 'episode', title: ep.name, url: ep.external_urls?.spotify || `https://open.spotify.com/episode/${ep.id}`,
              uri: ep.uri, source: sh.name, showId: sh.id, published, durationSec: Math.round((ep.duration_ms || 0) / 1000) || undefined,
              duration: ep.duration_ms ? mmss(Math.round(ep.duration_ms / 1000)) : undefined, summary: String(ep.description || '').slice(0, 240),
              tags: (spset().showTags || {})[sh.id] || ['podcast'], played: !!ep.resume_point?.fully_played, score: 1 });
          }
        } catch (e) { out.error = out.error || `${sh.name}: ${e.message}`; }
      }
      const pl = await this.api('/me/playlists?limit=50');
      out.playlists = (pl?.items || []).filter(Boolean).map(p => ({ id: p.id, name: p.name, uri: p.uri, url: p.external_urls?.spotify, count: p.items?.total ?? p.tracks?.total ?? null }));
    } catch (e) { out.error = e.needAuth ? 'needs sign-in' : e.message; }
    C.spotify = { ...(C.spotify || {}), ...out }; saveCache();
    this.busy = false;
    await this.nowPlaying(); render();
  },
  async nowPlaying() {
    if (!this.connected() || !navigator.onLine) return;
    try {
      const j = await this.api('/me/player/currently-playing?additional_types=episode');
      const it = j?.item;
      C.spotify = { ...(C.spotify || {}), now: it ? { title: it.name, by: (it.artists || []).map(a => a.name).join(', ') || it.show?.name || '', playing: !!j.is_playing, at: Date.now() } : null };
      saveCache();
    } catch (e) {}
  },
  /** Start something on a Spotify device. Prefers a phone; returns the device name, or null if none is awake. */
  async play(uri) {
    const d = await this.api('/me/player/devices');
    const devs = d?.devices || [];
    const pick = devs.find(x => x.type === 'Smartphone' && x.is_active) || devs.find(x => x.type === 'Smartphone') || devs.find(x => x.is_active) || devs[0];
    if (!pick) return null;
    const body = /^spotify:(episode|track):/.test(uri) ? { uris: [uri] } : { context_uri: uri };
    await this.api(`/me/player/play?device_id=${encodeURIComponent(pick.id)}`, { method: 'PUT', body });
    return pick.name;
  },
  playlistsTagged(tag) { const tags = spset().playlistTags || {}; return (C.spotify?.playlists || []).filter(p => (tags[p.id] || []).includes(tag)); },
};
/** Spotify episodes in digest-item form (used by the digest and the Listen queue). */
function spotifyItems() { return (C.spotify?.episodes || []).filter(e => !e.played && !(spset().hiddenShows || []).includes(e.showId)); }

/** Play something: Spotify Connect first (stays in this app), else open the Spotify app. */
async function spPlayUri(uri, url, title) {
  if (Spotify.connected() && navigator.onLine) {
    try {
      const dev = await Spotify.play(uri);
      if (dev) { toast(`▶ Playing on ${dev}`); setTimeout(() => Spotify.nowPlaying().then(render), 1500); render(); return; }
      toast('No Spotify device awake — opening Spotify…');
    } catch (e) { if (e.reason === 'PREMIUM_REQUIRED') toast('Remote play needs Spotify Premium — opening Spotify instead.'); else toast('Spotify: ' + e.message + ' — opening the app instead.'); }
  }
  const a = Object.assign(document.createElement('a'), { href: ytOpenUrl(url) }); if (!a.href.startsWith('intent:')) a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
}

function spotifySectionHtml() {
  const sp = spset(), cid = Spotify.clientId(), c = C.spotify || {};
  const fromConfig = !sp.clientId && C.config?.spotifyClientId;
  let h = `<p class="small muted">Podcasts you follow go into your Listen queue with exact lengths; tagged playlists become focus audio; Play starts it on your phone. Setup: Help → Spotify (5 min).</p>
    <label class="f">Spotify client ID ${fromConfig ? '<span class="tag">from config.json</span>' : ''}</label>
    <input type="text" id="spClientId" value="${esc(cid)}" placeholder="32-character client ID" autocomplete="off">
    <div class="actions"><button class="btn sm" data-act="spSaveClient">Save client ID</button>
      <button class="btn sm primary" data-act="spConnect">${Spotify.connected() ? 'Reconnect' : 'Connect Spotify'}</button>
      ${Spotify.connected() ? '<button class="btn sm" data-act="spRefresh">Refresh</button><button class="btn sm ghost danger" data-act="spDisconnect">Disconnect</button>' : ''}</div>
    <p class="small muted">Redirect URI to register in the Spotify dashboard: <code>${esc(Spotify.redirectUri())}</code></p>`;
  if (Spotify.connected()) {
    const by = Spotify.reauthBy();
    h += `<p class="small muted">Connected${c.fetchedAt ? ` · updated ${ago(c.fetchedAt)}` : ''}${by ? ` · Spotify will ask you to sign in again around ${by.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}` : ''}.</p>`;
    if (c.error) h += `<p class="small warnchip">⚠ ${esc(c.error)}</p>`;
    const hidden = new Set(sp.hiddenShows || []);
    h += `<label class="f">Podcasts (${(c.shows || []).length})</label><ul class="list">${(c.shows || []).map(s => {
      const n = (c.episodes || []).filter(e => e.showId === s.id && !e.played).length;
      return `<li><span class="grow" data-act="spShowEdit" data-id="${esc(s.id)}">${esc(s.name)}${hidden.has(s.id) ? ' <span class="tag">hidden</span>' : ''}<br><span class="small">${((sp.showTags || {})[s.id] || ['podcast']).map(t => `<span class="kw">${esc(t)}</span>`).join('')}</span></span><span class="tag">${n} new</span></li>`;
    }).join('') || '<li class="empty">No followed podcasts found.</li>'}</ul>
    <div class="actions"><button class="btn sm" data-act="spAddShow">+ Add a podcast by link</button></div>
    <label class="f">Playlists (${(c.playlists || []).length}) — tag them, e.g. “focus, lo-fi”</label><ul class="list">${(c.playlists || []).map(p => `<li>
      <span class="grow" data-act="spPlTags" data-id="${esc(p.id)}">${esc(p.name)}${p.count != null ? ` <span class="small muted">· ${p.count}</span>` : ''}<br><span class="small">${((sp.playlistTags || {})[p.id] || []).map(t => `<span class="kw">${esc(t)}</span>`).join('') || '<span class="muted">tap to tag</span>'}</span></span>
      <button class="icon" data-act="spPlayPl" data-id="${esc(p.id)}" aria-label="Play">▶</button></li>`).join('') || '<li class="empty">No playlists.</li>'}</ul>`;
  }
  return h;
}

const ACT7 = {
  spSaveClient() { const v = $('#spClientId').value.trim(); if (v && !/^[0-9a-f]{32}$/i.test(v)) return toast('A Spotify client ID is 32 letters/digits.'); spset().clientId = v; save(); toast('Saved.'); render(); },
  spConnect() { Spotify.connect(); },
  spRefresh() { Spotify.refresh(true); toast('Refreshing Spotify…'); },
  spDisconnect() { if (!confirm('Disconnect Spotify on this device?')) return; setSecret({ spToken: null }); delete C.spotify; saveCache(); render(); },
  async spShowEdit(el) {
    const id = el.dataset.id, name = (C.spotify?.shows || []).find(s => s.id === id)?.name || 'Podcast';
    const v = await formSheet(name, [{ name: 'tags', label: 'Tags (topics, genres, activities)', value: ((spset().showTags || {})[id] || ['podcast']).join(', ') },
      { name: 'hide', label: '', type: 'checkbox', value: (spset().hiddenShows || []).includes(id), hint: 'Hide this podcast from the Listen queue' }], { note: tagHintText() });
    if (!v) return;
    spset().showTags = { ...(spset().showTags || {}), [id]: parseTags(v.tags).length ? parseTags(v.tags) : ['podcast'] };
    const h = new Set(spset().hiddenShows || []); v.hide ? h.add(id) : h.delete(id); spset().hiddenShows = [...h];
    (C.spotify?.episodes || []).forEach(e => { if (e.showId === id) e.tags = spset().showTags[id]; }); saveCache();
    save(); render();
  },
  async spAddShow() {
    const v = await formSheet('Add a podcast', [{ name: 'link', label: 'Spotify podcast link (Share → Copy link)' }]);
    const m = v?.link?.match(/show[/:]([A-Za-z0-9]{22})/); if (!v) return;
    if (!m) return toast('That isn’t a Spotify podcast (show) link.');
    spset().extraShows = [...new Set([...(spset().extraShows || []), m[1]])]; save(); Spotify.refresh(true);
  },
  async spPlTags(el) {
    const id = el.dataset.id, p = (C.spotify?.playlists || []).find(x => x.id === id);
    const v = await formSheet(p?.name || 'Playlist', [{ name: 'tags', label: 'Tags — e.g. focus, lo-fi · chill, jazz · workout', value: ((spset().playlistTags || {})[id] || []).join(', ') }],
      { note: 'Tag a playlist “focus” and Deep work blocks will offer it as focus audio.<br>' + tagHintText() });
    if (!v) return;
    spset().playlistTags = { ...(spset().playlistTags || {}), [id]: parseTags(v.tags) }; save(); render();
  },
  spPlayPl(el) { const p = (C.spotify?.playlists || []).find(x => x.id === el.dataset.id); if (p) spPlayUri(p.uri, p.url, p.name); },
  spPlay(el) { const it = Listen.find(el.dataset.key); if (!it) return; S.listening = { key: it.key, title: it.title, durationSec: it.durationSec || null, startedAt: Date.now(), spotify: true }; save(); spPlayUri(it.uri, it.url, it.title); },
  spFocusPlay(el) { const p = (C.spotify?.playlists || []).find(x => x.id === el.dataset.id); if (p) { spPlayUri(p.uri, p.url, p.name); S.listening = { key: 'focus', focus: true, title: p.name, startedAt: Date.now() }; save(); render(); } },
  spFocusNext() { S.ui.focusPl = (S.ui.focusPl || 0) + 1; render(); },
};
</script>

<script>
/* =====================================================================
   PART 4h — HABITS (Stage 5). Engine: PART 1d.
   Design rules: nothing shows unless it's due *now* in *this* mode; one tap to tick;
   at most two in the Now strip; adding = pick a template; removing = pause or delete (undo).
   ===================================================================== */
const HABIT_TEMPLATES = [
  { icon: '🔋', name: 'Charge headphones', kind: 'interval', every: 5, learn: true, when: 'winddown' },
  { icon: '⌚', name: 'Charge watch', kind: 'interval', every: 3, learn: true, when: 'winddown' },
  { icon: '🏋️', name: 'Gym', kind: 'weekly', target: 3, when: 'life' },
  { icon: '🇩🇪', name: 'German practice', kind: 'weekly', target: 5, when: 'leisure' },
  { icon: '🧘', name: 'Class', kind: 'schedule', days: [2, 4], time: '19:00', dur: 60, lead: 25, alarm: true, when: 'any' },
  { icon: '🌱', name: 'Water plants', kind: 'interval', every: 4, learn: false, when: 'life' },
];
const HABIT_WHEN = [{ value: 'any', label: 'Any time' }, { value: 'work', label: 'Work' }, { value: 'life', label: 'Life' }, { value: 'leisure', label: 'Leisure' }, { value: 'winddown', label: 'Wind-down' }];
const HABIT_KIND_LABEL = { interval: 'every few days', weekly: 'times a week', schedule: 'fixed days & time' };
const minuteNow = (d = new Date()) => d.getHours() * 60 + d.getMinutes();
const habitStatus = h => Habit.status(h, S.habitLog, today(), minuteNow());
const habitById = id => S.habits.find(h => h.id === id);
const dots = week => `<span class="hdots" aria-label="this week">${week.map(b => `<i class="${b ? 'on' : ''}"></i>`).join('')}</span>`;

/** The quiet strip under the Now card. Empty → renders nothing at all. */
function habitStripHtml(mode) {
  const list = Habit.nudges(S.habits, S.habitLog, today(), minuteNow(), mode, S.ui.habitSnooze || {});
  if (!list.length) return '';
  const show = S.ui.habitMore ? list : list.slice(0, 2);
  return `<div class="hstrip">${show.map(({ h, s }) => `<div class="hrow ${s.urgency >= 2 ? 'hot' : ''}">
      <span class="hicon">${esc(h.icon || '•')}</span>
      <span class="grow"><b>${esc(h.name)}</b> <span class="small muted">${esc(s.text)}</span></span>
      <button class="icon" data-act="habitSnooze" data-id="${h.id}" aria-label="Not today" title="Not today">⏾</button>
      <button class="btn sm" data-act="habitTick" data-id="${h.id}" aria-label="Done">✓</button></div>`).join('')}
    ${list.length > 2 ? `<button class="linkish small muted" data-act="habitMore">${S.ui.habitMore ? 'show less' : `+${list.length - 2} more`}</button>` : ''}</div>`;
}

/** One-time-ish nudge to set habits up (the "remind me" ask). Snoozes for a week. */
function habitSetupPromptHtml() {
  if (S.habits.length || (S.ui.habitPromptUntil || '') > today()) return '';
  return `<div class="card" style="border-left:4px solid var(--accent)"><h3>Habits</h3>
    <p class="muted small">Want gentle nudges for things like charging your headphones or going to a class? Pick one or two — they only appear when due.</p>
    <div class="actions"><button class="btn primary" data-act="habitAdd">Set up habits</button><button class="btn ghost" data-act="habitPromptLater">Not now</button></div></div>`;
}

/** Tasks tab section: every habit with its tally, tick, and edit. */
function habitsManageHtml() {
  if (!S.habits.length) return `<div class="empty">No habits yet.</div><div class="actions"><button class="btn primary" data-act="habitAdd">+ Add a habit</button></div>`;
  return `<ul class="list">${S.habits.map(h => { const s = habitStatus(h); return `<li class="${h.paused ? 'muted' : ''}">
      <span class="hicon">${esc(h.icon || '•')}</span>
      <span class="grow" data-act="habitEdit" data-id="${h.id}" style="cursor:pointer"><b>${esc(h.name)}</b>${h.paused ? ' <span class="tag">paused</span>' : ''}<br>
        <span class="small muted">${esc(s.math || s.text)}</span></span>
      ${h.kind === 'interval' ? '' : dots(s.week)}
      <button class="icon ${s.doneToday ? 'on' : ''}" data-act="habitTick" data-id="${h.id}" aria-label="${s.doneToday ? 'Undo today' : 'Done today'}"><span class="chk"></span></button></li>`; }).join('')}</ul>
    <div class="actions"><button class="btn" data-act="habitAdd">+ Add a habit</button></div>
    <p class="small muted">Tap a habit to edit, pause or delete it. Ticking again undoes today.</p>`;
}

/** Wrap-up step 1: one quiet line per habit with a weekly picture. */
function habitWrapHtml() {
  const hs = S.habits.filter(h => !h.paused); if (!hs.length) return '';
  return `<p class="muted small" style="margin-top:12px">Habits this week</p><ul class="list">${hs.map(h => { const s = habitStatus(h);
    return `<li><span class="hicon">${esc(h.icon || '•')}</span><span class="grow">${esc(h.name)} <span class="small muted">${esc(h.kind === 'interval' ? s.text : s.math.split(' (')[0])}</span></span>${h.kind === 'interval' ? '' : dots(s.week)}</li>`; }).join('')}</ul>`;
}

/** Schedule habits as events, so a class shows on the Now card, Today/Tomorrow calendars and "Coming up". */
function habitEvents() {
  const from = Habit.addDays(today(), -1), to = Habit.addDays(today(), 8);
  return Habit.occurrences(S.habits, from, to).map(o => {
    const [hh, mm] = o.time.split(':').map(Number), s = localMidnight(o.day); s.setHours(hh, mm || 0, 0, 0);
    return { id: `habit|${o.h.id}|${o.day}`, title: `${o.h.icon || ''} ${o.h.name}`.trim(), start: s.toISOString(), end: new Date(+s + o.dur * 60000).toISOString(),
      allDay: false, source: 'habit', location: o.h.lead ? `leave ${fmtT(new Date(+s - o.h.lead * 60000))}` : '' };
  });
}

/** Phone alarms for schedule habits (Google reminders): keeps the next 7 days in the app's calendar. */
const HabitAlarms = {
  async sync() {
    if (!Google.ready('reminders')) return;
    const want = new Map();
    for (const o of Habit.occurrences(S.habits.filter(h => h.alarm), today(), Habit.addDays(today(), 6))) {
      const [hh, mm] = o.time.split(':').map(Number), at = localMidnight(o.day); at.setHours(hh, mm || 0, 0, 0);
      const ring = new Date(+at - (+o.h.lead || 0) * 60000);
      if (ring <= new Date()) continue;
      want.set(`${o.h.id}|${o.day}|${o.time}|${o.h.lead || 0}`, { title: `${o.h.icon || ''} ${o.h.name}${o.h.lead ? ' — leave now' : ''}`.trim(), at: ring });
    }
    for (const r of S.reminders.filter(r => r.kind === 'habit' && new Date(r.at) > new Date() && !want.has(r.ref))) await Remind.remove(r.id);
    let made = 0;
    for (const [ref, v] of want) {
      if (made >= 14) break;
      if (S.reminders.some(r => r.kind === 'habit' && r.ref === ref)) continue;
      await Remind.create({ title: v.title, at: v.at, minutes: 5, kind: 'habit', ref }); made++;
    }
  },
};

async function editHabit(h) {
  const isNew = !h.id, k = h.kind;
  const fields = [
    { name: 'icon', label: 'Icon (an emoji)', value: h.icon || '' },
    { name: 'name', label: 'Name', value: h.name || '' },
    ...(k === 'interval' ? [{ name: 'every', label: 'Roughly every … days', type: 'number', min: 1, max: 60, value: h.every || 5 },
      { name: 'learn', label: 'Learn the rhythm', type: 'checkbox', value: h.learn !== false, hint: 'Adjust to when I actually do it' }] : []),
    ...(k === 'weekly' ? [{ name: 'target', label: 'Times per week', type: 'number', min: 1, max: 7, value: h.target || 3 }] : []),
    ...(k === 'schedule' ? [{ name: 'days', label: 'Days (e.g. Tue, Thu · weekdays)', value: Habit.daysLabel(h.days || []) },
      { name: 'time', label: 'Starts at', type: 'time', value: h.time || '19:00' },
      { name: 'dur', label: 'Length (minutes)', type: 'number', min: 5, max: 600, value: h.dur || 60 },
      { name: 'lead', label: 'Leave / get ready … minutes before', type: 'number', min: 0, max: 180, value: h.lead ?? 25 },
      { name: 'alarm', label: 'Phone alarm', type: 'checkbox', value: h.alarm !== false, hint: 'Ring at “leave” time (needs Google reminders)' }] : []),
    { name: 'when', label: 'Nudge me during', type: 'select', options: HABIT_WHEN, value: h.when || 'any' },
    ...(isNew ? [] : [{ name: 'paused', label: 'Pause', type: 'checkbox', value: !!h.paused, hint: 'Hide it for now, keep the history' }]),
  ];
  const v = await formSheet(isNew ? `New habit · ${HABIT_KIND_LABEL[k]}` : h.name, fields, { deletable: !isNew, okLabel: isNew ? 'Add' : 'Save' });
  if (!v) return;
  if (v.__delete) {
    const before = JSON.stringify({ habits: S.habits, habitLog: S.habitLog });
    S.habits = S.habits.filter(x => x.id !== h.id); delete S.habitLog[h.id]; save(); render();
    return toast(`Deleted “${h.name}”.`, 'Undo', () => { Object.assign(S, JSON.parse(before)); save(); render(); });
  }
  const out = { ...h, icon: v.icon, name: v.name || h.name || 'Habit', when: v.when };
  if (k === 'interval') Object.assign(out, { every: Math.max(1, v.every || 5), learn: v.learn });
  if (k === 'weekly') out.target = Math.min(7, Math.max(1, v.target || 3));
  if (k === 'schedule') {
    const days = Habit.parseDays(v.days);
    if (!days.length) return toast('Couldn’t read the days — try “Tue, Thu” or “weekdays”.');
    Object.assign(out, { days, time: v.time || '19:00', dur: v.dur || 60, lead: v.lead || 0, alarm: v.alarm });
  }
  if (!isNew) out.paused = v.paused;
  if (isNew) { out.id = uid(); out.created = Date.now(); S.habits.push(out); }
  else S.habits[S.habits.findIndex(x => x.id === h.id)] = out;
  save(); render();
  if (k === 'schedule' && out.alarm) HabitAlarms.sync().catch(() => {});
  toast(isNew ? `Added “${out.name}”. It shows up only when it’s due.` : 'Saved.');
}

const ACT8 = {
  habitTick(el) {
    const id = el.dataset.id, d = today(), L = (S.habitLog[id] ||= {});
    if (L[d]) delete L[d]; else L[d] = Date.now();
    if (!Object.keys(L).length) delete S.habitLog[id];
    save(); render();
    if ($('#dlg').open && wrap) renderWrap();
  },
  habitSnooze(el) { (S.ui.habitSnooze ||= {})[el.dataset.id] = today(); save(); render(); toast('Hidden until tomorrow.'); },
  habitMore() { S.ui.habitMore = !S.ui.habitMore; save(); render(); },
  habitPromptLater() { S.ui.habitPromptUntil = Habit.addDays(today(), 7); save(); render(); toast('I’ll ask again in a week. Habits live on the Tasks tab.'); },
  async habitAdd() {
    const pick = await choose('Add a habit', [...HABIT_TEMPLATES.map((t, i) => ({ value: 't' + i, label: `${t.icon} ${t.name}`, tag: t.kind === 'interval' ? `every ~${t.every} days` : t.kind === 'weekly' ? `${t.target}× a week` : `${Habit.daysLabel(t.days)} ${t.time}` })),
      { value: 'interval', label: '✏️ Custom — every few days', tag: 'e.g. charge, clean' },
      { value: 'weekly', label: '✏️ Custom — times a week', tag: 'e.g. run 2×' },
      { value: 'schedule', label: '✏️ Custom — fixed days & time', tag: 'e.g. a class' }]);
    if (!pick) return;
    await editHabit(pick[0] === 't' ? { ...HABIT_TEMPLATES[+pick.slice(1)] } : { kind: pick, icon: '', name: '' });
  },
  habitEdit(el) { const h = habitById(el.dataset.id); if (h) editHabit(h); },
};

/* =====================================================================
   PART 4i — QUICK CALENDAR ADD + WEEK AHEAD
   Type "Drinks with Tom Sat 7pm" into Capture → it shows what it understood → one tap adds it.
   With Google connected (calwrite) it goes straight into your main calendar (undo-able).
   Without Google: on Android it opens your calendar app's "new event" screen pre-filled
   (one more tap: Save); elsewhere a pre-filled Google Calendar page.
   ===================================================================== */
const qaWhen = r => {
  const d = r.start.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  return r.allDay ? `${d} · all day` : `${d} · ${fmtT(r.start)}–${fmtT(r.end)}`;
};
const QuickCal = {
  canWrite() { return Google.ready('calwrite'); },
  /** Android calendar "insert" intent — opens Samsung/Google Calendar pre-filled, no sign-in needed. */
  intentUrl(r) {
    const e = s => encodeURIComponent(s);
    return `intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.item/event;S.title=${e(r.title)};l.beginTime=${+r.start};l.endTime=${+r.end};B.allDay=${r.allDay};end`;
  },
  webUrl(r) {
    const z = d => d.toISOString().replace(/[-:]|\.\d{3}/g, ''), ymd = d => Engine.dateKey(d).replace(/-/g, '');
    const dates = r.allDay ? `${ymd(r.start)}/${ymd(r.end)}` : `${z(r.start)}/${z(r.end)}`;
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(r.title)}&dates=${dates}`;
  },
  async add(r) {
    if (!this.canWrite()) {
      if (Google.everSignedIn() && Google.on('calwrite') && !Google.token()) toast('Google needs a refresh — opening your calendar app instead.');
      location.href = isAndroid() ? this.intentUrl(r) : this.webUrl(r);
      return 'handoff';
    }
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const body = r.allDay ? { summary: r.title, start: { date: Engine.dateKey(r.start) }, end: { date: Engine.dateKey(r.end) } }
      : { summary: r.title, start: { dateTime: r.start.toISOString(), timeZone: tz }, end: { dateTime: r.end.toISOString(), timeZone: tz } };
    const ev = await Google.api(`${GAPI.cal}/calendars/primary/events`, { method: 'POST', body });
    // show it immediately, before the next calendar refresh
    if (C.gcal) {
      const primary = (C.gcal.calendars || []).find(c => c.primary) || { id: 'primary', summary: 'Calendar' };
      const m = Cal.map(ev, primary); if (m) { C.gcal.events.push(m); saveCache(); }
    }
    return ev;
  },
  async remove(ev) {
    await Google.api(`${GAPI.cal}/calendars/primary/events/${encodeURIComponent(ev.id)}`, { method: 'DELETE' });
    if (C.gcal) { C.gcal.events = C.gcal.events.filter(e => !e.id.endsWith('|' + ev.id)); saveCache(); }
  },
};
/** Edit what the parser understood before adding. */
async function qaEdit(r) {
  const v = await formSheet('Calendar event', [
    { name: 'title', label: 'What', value: r.title },
    { name: 'date', label: 'Day', type: 'date', value: Engine.dateKey(r.start) },
    { name: 'allDay', label: 'All day', type: 'checkbox', value: r.allDay, hint: 'No times' },
    { name: 'start', label: 'Starts', type: 'time', value: r.allDay ? '19:00' : fmtT(r.start) },
    { name: 'end', label: 'Ends', type: 'time', value: r.allDay ? '20:00' : fmtT(r.end) },
  ], { okLabel: 'Add to calendar' });
  if (!v) return null;
  const base = localMidnight(v.date || Engine.dateKey(r.start));
  if (v.allDay) return { title: v.title || r.title, start: base, end: Engine.atDay(base, 1), allDay: true };
  const [sh, sm] = (v.start || '19:00').split(':').map(Number), [eh, em] = (v.end || '20:00').split(':').map(Number);
  const start = new Date(base); start.setHours(sh, sm, 0, 0);
  let end = new Date(base); end.setHours(eh, em, 0, 0); if (end <= start) end = new Date(+end + 864e5);
  return { title: v.title || r.title, start, end, allDay: false };
}
async function qaCommit(r) {
  try {
    const ev = await QuickCal.add(r);
    if (ev === 'handoff') return;
    render();
    toast(`Added: ${r.title} · ${qaWhen(r)}`, 'Undo', async () => { try { await QuickCal.remove(ev); render(); toast('Removed.'); } catch (e) { toast('Couldn’t undo: ' + e.message); } });
  } catch (e) { toast('Couldn’t add it: ' + e.message); }
}

/* ---- Week ahead: who you're seeing, birthdays, free evenings ---- */
const isBirthday = e => /#contacts@|birthday|geburtstag|bday/i.test((e.calId || '') + ' ' + e.title);
/** Is 18:00–23:00 on this day free of real (busy, timed) events? */
function eveningFree(ymd) {
  const s = localMidnight(ymd); s.setHours(18, 0, 0, 0); const e = new Date(s); e.setHours(23, 0, 0, 0);
  return !eventsOnDay(ymd).some(x => !x.allDay && !x.info && x.s < e && x.e > s);
}
function weekAheadHtml(fromDay, n) {
  let h = '<div class="week">';
  for (let i = 0; i < n; i++) {
    const k = Habit.addDays(fromDay, i), evs = eventsOnDay(k).filter(x => !(x.info && !x.allDay) && !(x.allDay && x.info && !isBirthday(x)));
    const d = localMidnight(k), weekend = [0, 6].includes(d.getDay()), free = eveningFree(k);
    const label = i === 0 && k === today() ? 'Today' : k === tomorrow() ? 'Tomorrow' : d.toLocaleDateString('en-GB', { weekday: 'long' });
    h += `<div class="wday ${weekend ? 'wkend' : ''}"><div class="row" style="justify-content:space-between"><b>${label} <span class="small muted">${d.getDate()} ${d.toLocaleDateString('en-GB', { month: 'short' })}</span></b>
        ${free ? '<span class="tag free">evening free</span>' : ''}</div>
      ${evs.length ? `<ul class="wlist">${evs.map(x => `<li>${isBirthday(x) ? '🎂' : x.allDay ? '<span class="small muted">all day</span>' : `<span class="num small muted">${fmtT(x.s)}</span>`} ${esc(x.title)}</li>`).join('')}</ul>` : '<div class="small muted">Nothing planned</div>'}</div>`;
  }
  return h + `</div><div class="actions"><button class="btn sm" data-act="capture">+ Add something</button></div>${calNoteHtml()}`;
}
/** Fri 12:00 → Sun: the coming/current weekend (Fri evening, Sat, Sun). */
function weekendHtml() {
  const d = localMidnight(today()), wd = d.getDay();
  const fri = Habit.addDays(today(), wd === 0 ? -2 : wd === 6 ? -1 : 5 - wd);
  const from = [5, 6, 0].includes(wd) ? today() : fri, n = Habit.diffDays(from, Habit.addDays(fri, 2)) + 1;
  return weekAheadHtml(from, n);
}
const showWeekend = () => { const n = new Date(), wd = n.getDay(); return wd === 6 || wd === 0 || (wd === 5) || (wd === 4 && n.getHours() >= 12); };

/* ---------------- Storage diagnostics + daily snapshots (More → Data) ---------------- */
let storagePersisted = null;
if (navigator.storage?.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).then(v => { storagePersisted = v; }).catch(() => {});
function storageDiagHtml() {
  const ua = navigator.userAgent, browser = /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /EdgA?\//.test(ua) ? 'Edge' : /Firefox/.test(ua) ? 'Firefox' : /Chrome/.test(ua) ? 'Chrome' : 'other browser';
  const where = matchMedia('(display-mode: standalone)').matches ? 'installed app' : 'browser tab';
  const started = S.createdAt ? new Date(S.createdAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'before 15 Oct';
  return `<div class="math">${browser} · ${where} · storage ${storagePersisted === true ? 'protected ✓' : storagePersisted === false ? 'not protected (browser may clear it if space runs low)' : 'checking…'}
data here started: ${started} · ${S.tasks.length} tasks · ${S.habits.length} habits · ${S.inbox.length} inbox</div>
    <p class="small muted">Each browser keeps its <b>own</b> copy: Chrome and Samsung Internet don't share data. If things look empty, check you opened the app from the same browser you used before.</p>`;
}
function snapshotsHtml() {
  let snaps = {}; try { snaps = JSON.parse(localStorage.getItem(SNAP_KEY) || '{}'); } catch (e) {}
  const days = Object.keys(snaps).sort().reverse(); if (!days.length) return '';
  return `<p class="muted small" style="margin-top:12px">Daily snapshots (this browser, last 7 days)</p><ul class="list">${days.map(d => { let n = '?'; try { const x = JSON.parse(snaps[d]); n = `${(x.tasks || []).length} tasks · ${(x.habits || []).length} habits`; } catch (e) {}
    return `<li><span class="grow">${new Date(d + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })} <span class="small muted">${n}</span></span><button class="btn sm" data-act="snapRestore" data-day="${d}">Restore</button></li>`; }).join('')}</ul>`;
}
const ACT9 = {
  snapRestore(el) {
    let snaps = {}; try { snaps = JSON.parse(localStorage.getItem(SNAP_KEY) || '{}'); } catch (e) {}
    const raw = snaps[el.dataset.day]; if (!raw) return;
    if (!confirm('Replace current data with the snapshot from ' + el.dataset.day + '? (Your current data becomes today’s snapshot first.)')) return;
    const before = JSON.stringify(S);
    S = migrate(JSON.parse(raw)); save(); applyTheme(); render();
    toast('Restored.', 'Undo', () => { S = migrate(JSON.parse(before)); save(); applyTheme(); render(); });
  },
};

/* =====================================================================
   PART 5 — RENDERING
   Each view is a function that returns HTML. Clicks are handled by one
   delegated listener reading data-act attributes (PART 6).
   ===================================================================== */
let R = null;                 // latest engine result
let currentView = 'now';
let focusWeekOffset = 0;      // weekly chart navigation
let routineTab = Engine.isWeekend(new Date()) ? 'weekend' : 'weekday';

function applyTheme() {
  let t = S.settings.theme;
  if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
const modeColor = m => `var(--m-${m})`;

/** A collapsible secondary section that remembers whether it was open. */
function sec(id, title, body, defOpen = false, right = '') {
  const open = S.ui.open[id] ?? defOpen;
  return `<details class="sec" data-sec="${id}" ${open ? 'open' : ''}><summary><span>${title}</span>${right}</summary><div class="body">${body}</div></details>`;
}

/* ---------------- header: clock + mode chips ---------------- */
function renderHeader() {
  const now = new Date();
  $('#clock').textContent = now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + fmtT(now);
  $('#modes').innerHTML = Engine.MODES.map(m =>
    `<button class="chip ${R.mode === m ? 'on' : ''}" style="--mode-c:${modeColor(m)}" data-act="setMode" data-mode="${m}">${MODE_LABEL[m]}</button>`).join('');
  $('#modeNote').innerHTML = R.overrideOn
    ? `manual until ${fmtT(new Date(S.modeOverride.until))} · <a href="#" data-act="clearMode" style="color:inherit">auto</a>`
    : 'auto by time';
  document.documentElement.style.setProperty('--mode-c', modeColor(R.mode));
  $('#gchip').innerHTML = gChipHtml();
  const n = S.inbox.length, b = $('#inboxBadge');
  b.textContent = n; b.classList.toggle('hidden', !n);
}

/* ---------------- NOW view ---------------- */
function renderNow() {
  const now = new Date(), c = R.current, p = S.pomo;
  let h = '';

  // Overrun nudge — "Next: X. Start?"
  if (R.overrun) {
    const target = c.type === 'gap' ? R.next : c;
    h += `<div class="nudge" role="alert"><b>${R.overrun.minutesOver} min over “${esc(R.overrun.active.title)}”.</b>
      <div>Next: <b>${esc(target?.title || 'free time')}</b>. Start?</div>
      <div class="actions"><button class="btn sm primary" data-act="nudgeStart">Start ${esc(target?.title || '')}</button>
      <button class="btn sm" data-act="nudgeSnooze">+10 min</button><button class="btn sm ghost" data-act="nudgeDismiss">Dismiss</button></div></div>`;
  }

  // ---- hero card ----
  const label = c.type === 'event' ? 'Calendar' : c.type === 'gap' ? 'Free' : (KIND_LABEL[c.kind] || 'Block');
  const range = c.start && c.end ? `${fmtT(c.start)}–${fmtT(c.end)}` : c.end ? `until ${fmtT(c.end)}` : '';
  h += `<article class="now" style="--mode-c:${modeColor(R.mode)}" aria-live="polite">
    <div class="label"><span>Now · ${esc(label)}</span><span class="num">${range}</span></div>
    <div class="title">${esc(c.title)}</div>`;
  if (c.type === 'event') {
    h += `<div class="sub">${c.location ? esc(c.location) + ' · ' : ''}${c.underlying ? 'then back to ' + esc(c.underlying.name) : ''}</div>`;
    if (c.also.length) h += `<div class="also">Also now: ${c.also.map(esc).join(', ')}</div>`;
  }
  if (c.type === 'gap') h += `<div class="sub">${c.end ? 'Nothing scheduled until ' + whenLabel(c.end) : 'Nothing scheduled'}</div>`;
  if (R.allDay.length) h += `<div class="sub">📅 ${R.allDay.map(esc).join(' · ')}</div>`;

  // time-left bar
  if (c.start && c.end) {
    const pct = Math.min(100, Math.max(0, (now - c.start) / (c.end - c.start) * 100));
    h += `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><div class="sub num">${fmtDur(c.end - now)} left</div>`;
  }

  // the task inside a work block
  if (c.pick) {
    const t = c.pick.task, src = (c.forcedWork ? 'Work mode (manual) · ' : '') + (c.pick.source === 'top3' ? 'Top 3' : c.pick.source === 'next' ? 'Next action' : 'Oldest open task');
    const proj = projById(t.projectId);
    h += `<div class="task"><div class="small muted">${src}${proj ? ' · ' + esc(proj.name) : ''}</div><div class="t">${esc(t.title)}</div></div>`;
  } else if (Engine.WORK_KINDS.has(c.kind)) {
    h += `<div class="task"><div class="t">No task picked</div><div class="small muted">Choose today's top 3 so this card knows what to show.</div></div>`;
  }

  // running pomodoro is shown right in the hero
  if (p.phase !== 'idle') {
    h += `<div class="timer num" id="heroTimer">${fmtClock(Pomo.remaining())}</div>
      <div class="sub">${p.phase === 'work' ? 'Focus' : 'Break'}${p.paused ? ' · paused' : ''}</div>`;
  }

  // primary actions depend on the kind of "now"
  h += `<div class="actions">`;
  const isActive = S.active && S.active.id === c.id;
  if (p.phase !== 'idle') {
    h += p.paused ? `<button class="btn primary" data-act="pomoResume">Resume</button>` : `<button class="btn primary" data-act="pomoPause">Pause</button>`;
    h += `<button class="btn" data-act="pomoStop">Stop</button>`;
    if (c.pick) h += `<button class="btn" data-act="taskDone" data-id="${c.pick.task.id}">✓ Done</button>`;
  } else if (c.pick) {
    h += `<button class="btn primary" data-act="startFocus">▶ Start focus · ${S.settings.pomoWork}m</button>
      <button class="btn" data-act="taskDone" data-id="${c.pick.task.id}">✓ Done</button>
      <button class="btn ghost" data-act="taskSkip" data-id="${c.pick.task.id}">Not now</button>`;
  } else if (Engine.WORK_KINDS.has(c.kind)) {
    h += `<button class="btn primary" data-act="go" data-view="tasks">Pick top 3</button>`;
  } else if ((c.kind === 'morning' || c.kind === 'wake') && !morningDone()) {
    h += `<button class="btn primary" data-act="morning">☀ Start morning sequence</button>`;
  } else if (c.kind === 'winddown') {
    h += `<button class="btn primary" data-act="wrapup">Start 2-min wrap-up</button>`;
  } else if (c.type === 'gap') {
    h += `<button class="btn primary" data-act="capture">Capture a thought</button>`;
  } else if (isActive) {
    h += `<button class="btn primary" data-act="finishActive">Finish ${esc(c.title)}</button>`;
  } else {
    h += `<button class="btn primary" data-act="startActive">Start ${esc(c.title)}</button>`;
  }
  h += `</div>`;

  // Next
  if (R.next) {
    const n = R.next;
    h += `<div class="next"><span class="muted">NEXT</span><span style="flex:1"><b>${esc(n.title)}</b>${n.resume ? ' <span class="muted small">(resume)</span>' : ''}</span>
      <span class="num muted">${whenLabel(n.at)} · in ${fmtDur(n.at - now)}</span></div>`;
  }
  h += `</article>`;
  h += listenCardHtml();                          // 🎧 listen while working (PART 4d)

  // ---- secondary sections: content changes with the mode ----
  h += modeSections(R.mode);
  $('#view-now').innerHTML = h;
}

/** Which secondary cards to show, per mode. Keep it short — the hero is the point. */
function modeSections(mode) {
  const parts = [habitStripHtml(mode)];
  if (mode === 'life' || mode === 'winddown') parts.push(habitSetupPromptHtml());
  const top3 = top3Html(true);
  const comingUp = R.agenda.length ? `<ul class="list">${R.agenda.map(a =>
    `<li><span class="num muted" style="width:96px">${whenLabel(a.at)}</span><span class="grow">${esc(a.title)}${a.type === 'event' ? ' <span class="tag">event</span>' : ''}</span></li>`).join('')}</ul>`
    : '<div class="empty">Nothing else scheduled.</div>';
  const minsToday = focusMinutes(today());
  // Calendar: "Today" in work/life; "Tomorrow" in leisure/wind-down, and in any mode from 17:00.
  const evening = new Date().getHours() >= 17 || new Date().getHours() < 4;
  const todayCal = sec('now-cal', 'Today’s calendar', todayCalHtml(), true, todayCalBadge());
  const tomCal = sec('now-tomcal', tomorrowTitle(), tomorrowCalHtml(), true, tomorrowCalBadge());
  if (mode === 'work') {
    parts.push(sec('now-top3', 'Today’s top 3', top3, true));
    parts.push(todayCal); if (evening) parts.push(tomCal);
    parts.push(sec('now-next', 'Next action per project', nextActionsHtml(), false));
    if (Google.on('gmail') && C.gmail) parts.push(sec('now-mail', 'Gmail', mailHtml(true), false, `<span class="tag num">${C.gmail.unread} unread</span>`));
    parts.push(sec('now-focus', 'Focus today', `<div class="kpi"><div><b class="num">${minsToday}</b>minutes</div><div><b class="num">${todaysSessions().length}</b>sessions</div></div>`, false, `<span class="tag num">${minsToday}m</span>`));
  } else if (mode === 'life') {
    parts.push(sec('now-weather', 'Weather', Weather.html(), false, `<span class="tag">${Weather.short() || '—'}</span>`));
    parts.push(todayCal); if (evening) parts.push(tomCal);
    parts.push(sec('now-top3', 'Today’s top 3', top3, false));
    parts.push(sec('now-inbox', `Inbox`, inboxHtml(true), S.inbox.length > 0, `<span class="tag">${S.inbox.length}</span>`));
    if (Google.on('gmail') && C.gmail) parts.push(sec('now-mail', 'Gmail', mailHtml(true), false, `<span class="tag num">${C.gmail.unread} unread</span>`));
    parts.push(showWeekend() ? sec('now-weekend', 'This weekend', weekendHtml(), true) : sec('now-week', 'Week ahead', weekAheadHtml(today(), 7), false));
  } else if (mode === 'leisure') {
    parts.push(watchCardHtml());                    // ▶ Watch next (PART 4f)
    if (showWeekend()) parts.push(sec('now-weekend', 'This weekend', weekendHtml(), false));
    parts.push(evening ? tomCal : todayCal);
    parts.push(sec('now-watch', 'Watch-later shelf', watchHtml(), true, `<span class="tag">${S.watch.length}</span>`));
    parts.push(digestCard());
    parts.push(freshPromptHtml());
  } else if (mode === 'winddown') {
    const w = S.wrapups[today()];
    parts.push(`<div class="card"><h3>Evening wrap-up</h3><p class="muted small">${w ? 'Done at ' + fmtT(new Date(w.at)) + '. You can run it again.' : 'Two minutes: what got done, what rolls over, tomorrow’s top 3.'}</p>
      <div class="actions"><button class="btn primary" data-act="wrapup">${w ? 'Redo wrap-up' : 'Start wrap-up'}</button></div></div>`);
    parts.push(tomCal);
    parts.push(sec('now-tom', 'Tomorrow’s top 3', listTop3(tomorrow()), true));
    parts.push(freshPromptHtml());
  }
  parts.push(sec('now-agenda', 'Coming up', comingUp, false));
  return parts.join('');
}

/* ---------------- shared bits for tasks ---------------- */
function top3Ids(dk = today()) { return (S.top3[dk] || []).filter(id => taskById(id)); }
function top3Html(compact = false) {
  const ids = top3Ids();
  let h = '';
  for (let i = 0; i < 3; i++) {
    const t = taskById(ids[i]);
    h += t ? `<div class="slot filled ${t.done ? 'done' : ''}"><span class="n">${i + 1}</span>
        <button class="icon" data-act="toggleDone" data-id="${t.id}" aria-label="Toggle done"><span class="chk"></span></button>
        <span class="grow" data-act="editTask" data-id="${t.id}">${esc(t.title)} <span class="tag">${esc(projById(t.projectId)?.name || '')}</span></span>
        <button class="icon" data-act="top3Remove" data-id="${t.id}" aria-label="Remove from top 3">✕</button></div>`
      : `<div class="slot" data-act="top3Pick"><span class="n">${i + 1}</span><span class="muted">Pick a task…</span></div>`;
  }
  if (!compact && !ids.length) {
    const y = Engine.dateKey(Engine.atDay(new Date(today()), -1));
    const carry = top3Ids(y).filter(id => !taskById(id).done);
    if (carry.length) h += `<button class="btn sm" data-act="carryYesterday">Carry over ${carry.length} from yesterday</button>`;
  }
  return h;
}
function listTop3(dk) {
  const ids = top3Ids(dk);
  return ids.length ? `<ol>${ids.map(id => `<li>${esc(taskById(id).title)}</li>`).join('')}</ol>` : '<div class="empty">Not picked yet.</div>';
}
function nextActionsHtml() {
  return `<ul class="list">${S.projects.map(p => {
    const t = taskById(p.nextId);
    return `<li><span class="grow"><b>${esc(p.name)}</b><br><span class="${t && !t.done ? '' : 'muted'}">${t && !t.done ? esc(t.title) : 'No next action set'}</span></span></li>`;
  }).join('')}</ul>`;
}
function inboxHtml(compact = false) {
  if (!S.inbox.length) return '<div class="empty">Inbox zero. Capture with the + button.</div>';
  return `<ul class="list">${S.inbox.map(i => `<li><span class="grow">${esc(i.text)}<br><span class="small muted">${new Date(i.created).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' })}</span></span>
    <button class="icon" data-act="inboxToTask" data-id="${i.id}" title="Make it a task" aria-label="Make task">✓</button>
    <button class="icon" data-act="inboxToWatch" data-id="${i.id}" title="Watch/read later" aria-label="Later">⏵</button>
    <button class="icon" data-act="inboxDelete" data-id="${i.id}" title="Delete" aria-label="Delete">✕</button></li>`).join('')}</ul>`;
}
function watchHtml() {
  if (!S.watch.length) return '<div class="empty">Empty. Tap the bookmark in the digest, or ⏵ on an inbox item, to save something here.</div>';
  return `<ul class="list">${[...S.watch].reverse().map(w => `<li><span class="grow">${w.url ? `<a href="${esc(w.url)}" target="_blank" rel="noopener">${w.type === 'video' ? '▶ ' : ''}${esc(w.title)}</a>` : esc(w.title)}
      <br><span class="small muted">${[w.source, w.category, w.duration].filter(Boolean).map(esc).join(' · ') || 'from inbox'}</span></span>
    <button class="icon" data-act="watchDone" data-id="${w.id}" title="Watched / done" aria-label="Done">✓</button></li>`).join('')}</ul>`;
}
/** Card offering a time-boxed digest session. */
function digestCard() {
  const lens = Digest.defaultLens('standalone'), n = Digest.unreadCount(lens);
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3>Digest · ${esc(lensName(lens))}</h3><span class="tag">${C.digest ? n + ' new' : '—'}</span></div>
    <p class="small muted">${C.digest ? `Updated ${ago(C.digest.fetchedAt)}. ` : ''}A ${S.settings.digestMin}-minute read that ends with “You’re caught up”.</p>
    <div class="actions"><button class="btn" data-act="digestStart">Read digest · ${S.settings.digestMin} min</button></div></div>`;
}

/* ---------------- TASKS view ---------------- */
let showDone = false;
function renderTasks() {
  let h = `<h2>Today’s top 3 <span class="muted small">${new Date(today()).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })}</span></h2>${top3Html()}`;
  h += sec('tasks-habits', 'Habits', habitsManageHtml(), !S.habits.length, `<span class="tag">${S.habits.filter(x => !x.paused).length}</span>`);
  h += `<h2>Projects</h2><p class="muted small">★ = in today’s top 3 · ➜ = this project’s next action (shown on the Now card when nothing is in the top 3).</p>`;
  for (const p of S.projects) {
    const tasks = S.tasks.filter(t => t.projectId === p.id && (showDone || !t.done));
    const ids = top3Ids();
    h += `<div class="card"><div class="row" style="justify-content:space-between"><h3 data-act="editProject" data-id="${p.id}" style="cursor:pointer">${esc(p.name)}</h3>
      <div class="row" style="gap:6px"><span class="tag">${S.tasks.filter(t => t.projectId === p.id && !t.done).length} open</span>
      <button class="icon" data-act="removeProject" data-id="${p.id}" aria-label="Remove project ${esc(p.name)}" title="Remove project">✕</button></div></div>
      <ul class="list">${tasks.map(t => `<li class="${t.done ? 'done' : ''}">
        <button class="icon" data-act="toggleDone" data-id="${t.id}" aria-label="Toggle done"><span class="chk"></span></button>
        <span class="grow" data-act="editTask" data-id="${t.id}">${esc(t.title)}</span>
        <button class="icon ${ids.includes(t.id) ? 'on' : ''}" data-act="toggleTop3" data-id="${t.id}" aria-label="Top 3">★</button>
        <button class="icon next ${p.nextId === t.id ? 'on' : ''}" data-act="setNext" data-id="${t.id}" aria-label="Next action">➜</button></li>`).join('') || '<li class="empty">No open tasks.</li>'}</ul>
      <form class="row" data-form="addTask" data-proj="${p.id}" style="margin-top:8px"><input type="text" placeholder="Add a task…" aria-label="New task in ${esc(p.name)}"><button class="btn sm">Add</button></form></div>`;
  }
  h += `<div class="actions"><button class="btn" data-act="addProject">+ Project</button>
    <button class="btn ghost" data-act="toggleShowDone">${showDone ? 'Hide' : 'Show'} done</button></div>`;
  $('#view-tasks').innerHTML = h;
}

/* ---------------- FOCUS view ---------------- */
const focusMinutes = dk => S.pomoLog.filter(l => Engine.dateKey(new Date(l.start)) === dk).reduce((a, l) => a + l.min, 0);
const todaysSessions = () => S.pomoLog.filter(l => Engine.dateKey(new Date(l.start)) === today());

function weekData(offset = 0) {
  // Monday of the selected week
  const now = new Date(); const dow = (now.getDay() + 6) % 7;
  const mon = Engine.atDay(now, -dow + offset * 7);
  return [...Array(7)].map((_, i) => {
    const d = Engine.atDay(mon, i), dk = Engine.dateKey(d);
    const logs = S.pomoLog.filter(l => Engine.dateKey(new Date(l.start)) === dk);
    return { d, dk, min: logs.reduce((a, l) => a + l.min, 0), n: logs.length };
  });
}
/** Hand-rolled SVG bar chart (no libraries → works offline). */
function weekChart(data) {
  const W = 340, H = 170, top = 22, bottom = 26, bw = 30, gap = (W - 7 * bw) / 8;
  const max = Math.max(60, ...data.map(d => d.min));
  const tk = Engine.dateKey(new Date());
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Focus minutes per day this week">`;
  s += `<line x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--border)"/>`;
  data.forEach((d, i) => {
    const x = gap + i * (bw + gap), h = (H - top - bottom) * d.min / max, y = H - bottom - h;
    const isT = d.dk === tk;
    s += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, d.min ? 2 : 0)}" rx="6" fill="${isT ? 'var(--accent)' : 'var(--m-work)'}" opacity="${isT ? 1 : .75}"><title>${d.min} min, ${d.n} sessions</title></rect>`;
    if (d.min) s += `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.min}</text>`;
    s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${isT ? 'var(--text)' : 'var(--muted)'}" font-weight="${isT ? 700 : 400}">${d.d.toLocaleDateString('en-GB', { weekday: 'narrow' })}</text>`;
  });
  return s + '</svg>';
}
function renderFocus() {
  const p = S.pomo, st = S.settings;
  const total = p.phase === 'idle' ? st.pomoWork * 60000 : p.planned * 60000;
  const rem = p.phase === 'idle' ? total : Pomo.remaining();
  const frac = Math.max(0, Math.min(1, 1 - rem / total)), C = 2 * Math.PI * 100;
  const t = taskById(p.taskId) || R.current.pick?.task;
  let h = `<h2>Focus</h2><div class="card" style="text-align:center">
    <div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--surface2)" stroke-width="12"/>
      <circle id="ringArc" cx="110" cy="110" r="100" fill="none" stroke="${p.phase === 'work' || p.phase === 'idle' ? 'var(--m-work)' : 'var(--m-life)'}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" transform="rotate(-90 110 110)"/></svg>
      <div class="in"><div class="timer num" id="focusTimer">${fmtClock(rem)}</div><div class="muted small">${p.phase === 'idle' ? 'Ready' : p.phase === 'work' ? 'Focus' : p.phase === 'long' ? 'Long break' : 'Break'}${p.paused ? ' · paused' : ''}</div></div></div>
    <div class="muted" style="margin-top:6px">${t ? 'On: <b>' + esc(t.title) + '</b>' : 'No task attached'} <button class="btn sm ghost" data-act="pomoPickTask">change</button></div>
    <div class="actions" style="justify-content:center">`;
  if (p.phase === 'idle') h += `<button class="btn primary" data-act="pomoStart">▶ Start ${st.pomoWork}m</button><button class="btn" data-act="pomoBreak">Break ${st.pomoBreak}m</button>`;
  else h += (p.paused ? `<button class="btn primary" data-act="pomoResume">Resume</button>` : `<button class="btn primary" data-act="pomoPause">Pause</button>`) + `<button class="btn" data-act="pomoStop">Stop</button>`;
  h += `</div><p class="small muted">Session ${((p.count || 0) % st.longEvery) + 1} of ${st.longEvery} before a long break</p></div>`;

  // Settings for lengths (inline, adjustable)
  h += sec('focus-set', 'Timer lengths', `<div class="row"><label class="f" style="flex:1">Work (min)<input type="number" min="5" max="120" value="${st.pomoWork}" data-setting="pomoWork"></label>
    <label class="f" style="flex:1">Break<input type="number" min="1" max="30" value="${st.pomoBreak}" data-setting="pomoBreak"></label></div>
    <div class="row"><label class="f" style="flex:1">Long break<input type="number" min="5" max="60" value="${st.pomoLong}" data-setting="pomoLong"></label>
    <label class="f" style="flex:1">Long every N<input type="number" min="2" max="8" value="${st.longEvery}" data-setting="longEvery"></label></div>
    <label class="row" style="min-height:44px"><input type="checkbox" data-setting="autoBreak" ${st.autoBreak ? 'checked' : ''} style="width:22px;height:22px"> Start breaks automatically</label>`);

  // Weekly chart + the maths behind the totals
  const wk = weekData(focusWeekOffset), sum = wk.reduce((a, d) => a + d.min, 0), n = wk.reduce((a, d) => a + d.n, 0);
  const daysWith = wk.filter(d => d.min).length;
  h += `<h2>Week ${focusWeekOffset ? `(${focusWeekOffset > 0 ? '+' : ''}${focusWeekOffset})` : ''}</h2><div class="card">
    <div class="row" style="justify-content:space-between"><button class="btn sm ghost" data-act="weekPrev">‹ Prev</button>
    <span class="muted small">${wk[0].d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} – ${wk[6].d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>
    <button class="btn sm ghost" data-act="weekNext" ${focusWeekOffset >= 0 ? 'disabled' : ''}>Next ›</button></div>
    ${weekChart(wk)}

function findOverlaps(blocks) {
  // turn each block into [s,e) minute ranges on a 0..2880 line (wrapping ones extend past 1440)
  const r = blocks.map(b => { const s = Engine.parseHM(b.start); let e = Engine.parseHM(b.end); if (e <= s) e += 1440; return { id: b.id, s, e }; });
  const out = new Set();
  for (let i = 0; i < r.length; i++) for (let j = i + 1; j < r.length; j++) {
    const a = r[i], b = r[j];
    const ov = (x, y) => x.s < y.e && y.s < x.e;
    if (ov(a, b) || ov(a, { s: b.s + 1440, e: b.e + 1440 }) || ov({ s: a.s + 1440, e: a.e + 1440 }, b)) { out.add(a.id); out.add(b.id); }
  }
  return out;
}
function helpHtml() {
  return `<div class="help">
  <h3>Install on Android</h3><p>Open the site in Chrome → ⋮ menu → <b>Add to home screen</b> / <b>Install app</b>. It then opens full-screen and works offline. Long-press the icon for a “Capture” shortcut.</p>

  <h3>Digest & lenses</h3><p>A fixed list (max ${S.settings.digestMax} items, keyword matches first) with a countdown. Pick a <b>lens</b> at the top (Laugh, Politics & debate, Gaming…) to see only those tags, and optionally just Videos / Reddit / News / Articles. Switching lens keeps the same time-box. The bookmark saves to the watch-later shelf, ✓ marks read, tapping a title opens it. When the list is empty you’re caught up — nothing more loads. Hover or long-press “score” to see how it was added up.</p>
  <h3>Weather</h3><p>From Open-Meteo (free, no account). Set your location under More → Morning sequence & weather. “Use my location” asks once for GPS; or search a city. Offline you’ll see the last forecast and when it was fetched.</p>
  <h3>What isn’t possible / reliable</h3>

  <li class="limit"><b>Voice capture</b> uses Chrome’s speech recognition, which sends audio to Google and needs a connection. Offline, type instead.</li>
  <li class="limit"><b>Your data lives in one browser.</b> Phone and desktop don’t share it until Drive sync (Stage 4). Use Export as a backup.</li></ul>
  <h3>Stage 3 setup — your own feeds (one-off, ~10 min)</h3>

    <li><b>Pages:</b> Settings → Pages → Build and deployment → Source: <b>GitHub Actions</b>.</li>

    <li><b>First run:</b> Actions tab → “Digest + deploy” → <b>Run workflow</b>. After ~2 minutes your site is live at <code>https://&lt;you&gt;.github.io/&lt;repo&gt;/</code> with a real digest. It then runs every 3 hours by itself.</li>
    <li><b>Check the watchlist:</b> More → Watchlist & lenses shows each feed’s health. YouTube names are found by search — check “found …” is the right channel; if not, edit the feed and paste its <code>@handle</code> or channel link.</li>
  </ol>
  <h3>Editing the watchlist</h3>
  <p>More → Watchlist & lenses: add feeds (YouTube channel, subreddit, Google News search, any RSS URL), give them tags, build lenses from tags, set keyword boosts. Edits are local until you <b>publish</b>:</p>
  <ul><li><b>Easiest:</b> “Download feeds.json”, then in the repo open feeds.json → ✎ edit → paste, or upload it (replace). The push rebuilds the digest.</li>
  <li><b>One tap (optional):</b> create a <b>fine-grained personal access token</b> (GitHub → Settings → Developer settings → Fine-grained tokens) with access to <i>only this repository</i>, permissions <b>Contents: Read and write</b> and <b>Actions: Read and write</b>. Paste it under “Publish to GitHub”. It’s stored only in this browser and never exported — but anyone using this browser profile could read it, so keep the scope that narrow, and set an expiry.</li></ul>
  <p>Every ${S.settings.freshDays || 30} days without a new feed, you’ll get a gentle “Time for something new?” card (change or switch off in the watchlist section).</p>

  <p>Video lengths: YouTube usually blocks GitHub’s servers from video pages, so for reliable lengths add a free YouTube Data API key as the repo secret <code>YT_API_KEY</code> (Settings → Secrets and variables → Actions). Without one, items may show no length and the pick falls back to queue order. Until phone–desktop sync (Stage 4), marking something done on one device doesn’t hide it on the other.</p>
  <h3>Stage 4 setup — Google (one-off, ~15 min, free)</h3>

  <h3>Google: what to expect</h3>

  <li class="limit"><b>Testing mode ≈ weekly re-approval.</b> While your Google project is in Testing, Google expires approvals after about 7 days, so roughly once a week the refresh will show the consent screen again. Publishing the app would avoid that but needs Google’s verification for Gmail access — not worth it for a personal app.</li>
  <li class="limit"><b>Reminders ring through your calendar app.</b> They’re events in a separate “The Natto App” calendar. Make sure that calendar is visible and has notifications on in Google Calendar (or Samsung Calendar). <b>Samsung battery tip:</b> Settings → Apps → Calendar (and Google Calendar if installed) → Battery → <b>Unrestricted</b>; and Settings → Battery → Background usage limits → make sure Calendar isn’t in “Sleeping apps”. Otherwise Samsung can delay the alerts.</li>

    <li>Go to <b>developer.spotify.com/dashboard</b> → <b>Create app</b>. Any name/description.</li>

    <li>In the app’s settings copy the <b>Client ID</b> (you don’t need the secret). Under <b>User Management</b> make sure your own Spotify account is listed.</li>
    <li>Paste the Client ID in More → Spotify (or send it to be added to <code>config.json</code>), then <b>Connect Spotify</b>. Do this once on each device.</li>
  </ol>

function render(full = true) {
  R = Engine.resolve(new Date(), engineState());

  if (morningOpen()) renderMorning();

  ({ tasks: renderTasks, focus: renderFocus, inbox: renderInbox, more: renderMore })[currentView]?.();

function go(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + view));
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  render(); scrollTo({ top: 0 });
  if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
}

<script>

const ACT = {

    const t = taskById(el.dataset.id); if (!t) return;
