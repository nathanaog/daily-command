<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets us paint under the Android/iOS system bars; we then pad with safe-area insets -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<meta name="description" content="The Natto App — what should I be doing right now?">
<title>The Natto App</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* =====================================================================
   DAILY COMMAND — STYLES
   Design rules: calm, glanceable, one thumb. The Now card is the hero;
   everything else is secondary and collapsible. All tap targets >= 44px.
   Themes are CSS custom properties switched with <html data-theme="...">.
   ===================================================================== */
:root{
  --bg:#12161b; --surface:#1a2027; --surface2:#222a32; --border:#2c353e;
  --text:#e6ebee; --muted:#93a0aa; --faint:#5f6b75;
  --accent:#7fc8a9; --accent-ink:#0d1a14; --warn:#e8b86d; --danger:#e07a6f;
  /* one hue per mode, used to tint the hero card */
  --m-work:#7aa7e0; --m-life:#7fc8a9; --m-leisure:#e3b26b; --m-winddown:#a99be0;
  --radius:18px; --gap:14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#f5f6f3; --surface:#ffffff; --surface2:#eef0ec; --border:#dfe3de;
  --text:#1c2227; --muted:#5d6872; --faint:#9aa4ac;
  --accent:#2f8a66; --accent-ink:#ffffff; --warn:#b07a1e; --danger:#b5483c;
  --m-work:#3c6fb4; --m-life:#2f8a66; --m-leisure:#b07a1e; --m-winddown:#6b5bb5;
  color-scheme: light;
}
:root[data-theme="sepia"]{
  --bg:#f1e7d3; --surface:#faf3e3; --surface2:#efe3cb; --border:#dccdb0;
  --text:#3a2f23; --muted:#76664f; --faint:#a8977b;
  --accent:#8a5a2b; --accent-ink:#fff8ec; --warn:#a0681c; --danger:#a3442f;
  --m-work:#4f6f8f; --m-life:#5f7d4e; --m-leisure:#a0681c; --m-winddown:#7a5d8a;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .hidden{display:none!important}

/* ---------- top bar: date/time + mode chips ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:10px 16px 8px;border-bottom:1px solid var(--border)}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top-row .clock{white-space:nowrap}
.clock{font-size:1.05rem;font-weight:600}
.mode-note{font-size:.8rem;color:var(--muted)}
.modes{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chip{min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);
  background:transparent;font-size:.88rem;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--mode-c,var(--accent));border-color:transparent;color:#10151a;font-weight:600}

/* ---------- layout ---------- */
/* overflow-anchor:none — views are re-rendered wholesale; the browser's scroll
   anchoring would otherwise scroll a newly inserted nudge out of sight. */
main{overflow-anchor:none;max-width:680px;margin:0 auto;
  padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.view{display:none} .view.on{display:block}
h2{font-size:1.1rem;margin:22px 0 10px} h3{font-size:1rem;margin:0}

/* ---------- the hero Now card ---------- */
.now{position:relative;background:var(--surface);border-radius:24px;padding:22px 18px 16px;
  border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden}
/* mode stripe across the top of the hero */
.now::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--mode-c,var(--accent))}
.now .label{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.now .title{font-size:1.65rem;line-height:1.2;font-weight:700;margin:8px 0 2px;word-break:break-word}
.now .sub{color:var(--muted);font-size:.95rem}
.now .task{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface2)}
.now .task .t{font-size:1.2rem;font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--surface2);margin:14px 0 6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mode-c,var(--accent));border-radius:6px}
.timer{font-size:2.6rem;font-weight:700;letter-spacing:.02em;margin:10px 0 0}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface2);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--mode-c,var(--accent));color:#10151a;border-color:transparent;flex:1 1 auto}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:44px;padding:8px 12px;font-size:.92rem}
.next{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;
  padding-top:12px;border-top:1px dashed var(--border);font-size:.95rem}
.next b{font-weight:600}
.also{margin-top:8px;font-size:.85rem;color:var(--warn)}

/* overrun nudge banner */
.nudge{background:color-mix(in srgb,var(--warn) 18%,var(--surface));border:1px solid var(--warn);
  border-radius:16px;padding:12px 14px;margin-bottom:12px}
.nudge .actions{margin-top:8px}

/* ---------- secondary, collapsible sections ---------- */
details.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-top:12px}
details.sec>summary{list-style:none;min-height:52px;padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;cursor:pointer;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"›";transform:rotate(90deg);transition:transform .15s;color:var(--muted);font-size:1.3rem}
details.sec[open]>summary::after{transform:rotate(-90deg)}
details.sec .body{padding:0 16px 14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:12px}

/* ---------- lists ---------- */
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:6px;min-height:48px;border-bottom:1px solid var(--border)}
ul.list li:last-child{border-bottom:0}
ul.list .grow{flex:1;min-width:0;padding:8px 2px;cursor:pointer;word-break:break-word}
.icon{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:0;background:transparent;
  display:grid;place-items:center;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.icon.on{color:var(--warn)} .icon.next.on{color:var(--accent)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);display:inline-block}
.done .chk{background:var(--accent);border-color:var(--accent)}
.done .grow{color:var(--faint);text-decoration:line-through}
.tag{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.warnchip{color:var(--warn)}
.slot{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 10px;border-radius:14px;
  border:1px dashed var(--border);margin-bottom:8px;cursor:pointer}
.slot.filled{border-style:solid;background:var(--surface2)}
.slot .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-weight:700;font-size:.85rem}
.row{display:flex;gap:8px;align-items:center}
.row>input,.row>select{flex:1}
.row>input[type=checkbox]{flex:0 0 22px}          /* checkboxes keep their size inside flex rows */
input[type=text],input[type=time],input[type=number],input[type=date],select,textarea{
  min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);width:100%}
textarea{min-height:110px;resize:vertical}
label.f{display:block;margin:10px 0 4px;font-size:.85rem;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:transparent;cursor:pointer}
.seg button.on{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{flex:1 1 90px;background:var(--surface2);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:1.35rem}
.math{font-size:.82rem;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px;margin-top:8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;white-space:pre-wrap}
.empty{color:var(--muted);padding:10px 0;font-size:.92rem}

/* pomodoro ring */
.ring{display:grid;place-items:center;margin:8px auto 0;width:220px;height:220px;position:relative}
.ring svg{position:absolute;inset:0}
.ring .in{text-align:center}
.ring .in .timer{margin:0}

/* ---------- Stage 2: full-screen morning flow ---------- */
.overlay{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding-top:env(safe-area-inset-top)}
.ov-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--border)}
.ov-head>div{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:6px;flex:1} .dots i{height:6px;flex:1;border-radius:3px;background:var(--surface2)}
.dots i.on{background:var(--accent)}
.ov-body{max-width:680px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.ov-foot{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--bg);border-top:1px solid var(--border);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.ov-foot>div{max-width:680px;margin:0 auto;display:flex;gap:10px}
.hello{font-size:1.7rem;font-weight:700;margin:4px 0 2px;line-height:1.2}
/* weather */
.wx-now{display:flex;gap:14px;align-items:center}
.wx-ic{font-size:2.6rem;line-height:1}
.wx-t{font-size:2rem;font-weight:700}
/* digest */
.dgclock{font-weight:700;font-size:1.05rem}
.dgclock.over{color:var(--warn)}
ul.dg li{align-items:flex-start;padding:8px 0}
ul.dg a{color:var(--text);font-weight:600;text-decoration:none}
ul.dg a:hover{text-decoration:underline}
.sum{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.kw{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;margin:3px 4px 0 0;
  background:color-mix(in srgb,var(--accent) 24%,transparent)}
.catname{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 2px}
.banner{padding:8px 12px;border-radius:12px;background:var(--surface2);font-size:.85rem;color:var(--muted);margin-bottom:10px}
.banner.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--text);border:1px solid var(--warn)}
.caught{text-align:center;padding:28px 8px}
.caught .big{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:2.8rem;margin:0 auto 14px}

a.btn{text-decoration:none;color:inherit} a.btn.primary{color:#10151a}
ul.list a{color:var(--text);text-decoration:none} ul.list a:hover{text-decoration:underline}
.card.listen{border-left:4px solid var(--mode-c,var(--accent))}
.ytbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;margin-bottom:10px}
.ytbox iframe,.ytbox #ytFrame{position:absolute;inset:0;width:100%;height:100%;border:0}
.qaprev{margin-top:10px;padding:10px 12px;border:1px solid var(--accent);border-radius:14px;background:var(--surface2)}
.week{display:flex;flex-direction:column;gap:8px}.wday{padding:8px 10px;border-radius:12px;background:var(--surface2)}.wday.wkend{border-left:3px solid var(--accent)}
.wlist{list-style:none;margin:4px 0 0;padding:0}.wlist li{padding:2px 0}.tag.free{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.hstrip{margin:10px 0 4px}.hrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:14px;margin-bottom:6px;background:var(--surface)}
.hrow.hot{border-color:var(--accent)}.hicon{font-size:1.15rem;width:26px;text-align:center;flex:0 0 26px}
.hdots{display:inline-flex;gap:3px;flex:0 0 auto}.hdots i{width:7px;height:7px;border-radius:50%;background:var(--surface2);border:1px solid var(--border)}.hdots i.on{background:var(--accent);border-color:var(--accent)}
.linkish{background:none;border:0;padding:4px 2px;cursor:pointer;min-height:32px}
.gchip{font-size:.75rem;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);white-space:nowrap;min-height:28px}
.gchip.ok{color:var(--accent)} button.gchip{cursor:pointer} .gchip.warn{color:var(--warn);border-color:var(--warn)}
.card.listen .math{margin-top:6px}

/* ---------- floating capture button + bottom nav ---------- */
.fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:6;
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);
  font-size:2rem;line-height:1;box-shadow:0 8px 20px rgba(0,0,0,.3);cursor:pointer}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;
  background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;min-height:62px;border:0;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer;position:relative}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--text);font-weight:600}
nav.bottom button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:8px;left:55%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--warn);color:#111;font-size:.68rem;font-weight:700;display:grid;place-items:center}

/* Desktop: nav becomes a left rail, content stays a calm single column */
@media (min-width:900px){
  nav.bottom{top:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;padding-top:80px;border-top:0;border-right:1px solid var(--border)}
  nav.bottom button{flex:0 0 76px}
  .modes{flex-wrap:wrap}                        /* plenty of room: lens chips wrap instead of scrolling */
  nav.bottom button.on::before{top:20%;bottom:20%;left:0;right:auto;width:3px;height:auto}
  body{padding-left:96px}                       /* room for the rail; main stays centred via margin:auto */
  .top{padding-inline:max(16px,calc((100% - 648px) / 2))}
  main{padding-bottom:60px}
  .fab{bottom:28px;right:28px}
}

/* ---------- dialogs as bottom sheets ---------- */
dialog{border:0;padding:0;background:transparent;max-width:100vw;width:100%;margin:auto auto 0;color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow:auto;max-width:680px;margin:0 auto}
@media (min-width:700px){dialog{margin:auto} .sheet{border-radius:24px}}
.sheet h3{font-size:1.15rem;margin-bottom:6px}
.sheet .actions{position:sticky;bottom:0;background:var(--surface);padding-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:20;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;display:flex;gap:12px;align-items:center;max-width:90vw}
.toast button{background:transparent;border:0;color:inherit;font-weight:700;min-height:36px;cursor:pointer}
.help p,.help li{font-size:.95rem} .help code{background:var(--surface2);padding:1px 5px;border-radius:5px}
.limit{border-left:3px solid var(--warn);padding-left:10px}
</style>
</head>
<body>

<!-- ============================ TOP BAR ============================ -->
<header class="top">
  <div class="top-row">
    <div class="clock num" id="clock">—</div>
    <span id="gchip"></span>
    <div class="mode-note" id="modeNote">auto</div>
  </div>
  <div class="modes" id="modes" role="group" aria-label="Mode"></div>
</header>

<main>
  <!-- NOW: the hero card + mode-dependent secondary sections -->
  <section class="view on" id="view-now" aria-label="Now"></section>
  <!-- TASKS: today's top 3 + projects with a "next action" each -->
  <section class="view" id="view-tasks" aria-label="Tasks"></section>
  <!-- FOCUS: pomodoro, session log, weekly chart -->
  <section class="view" id="view-focus" aria-label="Focus"></section>
  <!-- INBOX: quick-capture items waiting to be sorted -->
  <section class="view" id="view-inbox" aria-label="Inbox"></section>
  <!-- MORE: events, routine editor, settings, data, help -->
  <section class="view" id="view-more" aria-label="More"></section>
</main>

<button class="fab" data-act="capture" aria-label="Quick capture">+</button>

<nav class="bottom" id="nav">
  <button data-view="now" class="on" aria-label="Now">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now</button>
  <button data-view="tasks" aria-label="Tasks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tasks</button>
  <button data-view="focus" aria-label="Focus">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4M9 2h6"/></svg>Focus</button>
  <button data-view="inbox" aria-label="Inbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>Inbox<span class="badge hidden" id="inboxBadge">0</span></button>
  <button data-view="more" aria-label="More">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>

<!-- Stage 2: the guided morning sequence (and stand-alone digest sessions) -->
<section class="overlay hidden" id="morning" aria-label="Morning sequence" role="dialog" aria-modal="true"></section>
<!-- Stage 4.5: in-app YouTube player -->
<section class="overlay hidden" id="player" aria-label="Video player" role="dialog" aria-modal="true" style="z-index:16"></section>

<!-- One reusable dialog; its contents are rendered per use -->
<dialog id="dlg"><div class="sheet" id="dlgBody"></div></dialog>
<div class="toast hidden" id="toast"></div>

<script>
/* =====================================================================
   PART 1 — THE NOW/NEXT ENGINE
   Pure functions only: (time, state) -> what to do now / next.
   No DOM, no storage, no network — so it works offline by construction
   and can be unit-tested in Node (see tests/engine.test.cjs, which
   extracts everything between the ENGINE START/END markers).

   Rules, in priority order:
     1. A timed calendar event in progress overrides everything.
        Overlapping events: the one that started most recently wins
        (it's the more specific interruption); ties -> the one ending first.
        All-day events never override; they're shown as context. Neither do
        "info" events (Google Calendar events marked Free, working-location).
     2. Otherwise the current routine block. Blocks whose end <= start
        wrap past midnight, so at 00:15 Monday we still check Sunday's
        (weekend) template. Overlapping blocks: later start wins.
     3. Inside a work block (deep/admin), show the top task:
        today's top 3 -> a project's next action -> oldest open task.
   "Next" is found by stepping through every boundary (event/block
   start or end) and returning the first moment the answer changes,
   skipping free gaps. This handles every overlap shape uniformly.
   ===================================================================== */
// ==ENGINE START==
const Engine = (() => {
  const MIN = 60 * 1000;
  const WORK_KINDS = new Set(['deep', 'admin']);
  const MODES = ['work', 'life', 'leisure', 'winddown'];

  const pad = n => String(n).padStart(2, '0');
  /** Local calendar date as "YYYY-MM-DD" (never UTC, so no off-by-one at night). */
  const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  /** "07:30" -> 450 minutes since midnight; NaN if malformed. */
  function parseHM(s) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim());
    if (!m) return NaN;
    const h = +m[1], mi = +m[2];
    return (h > 23 || mi > 59) ? NaN : h * 60 + mi;
  }
  /** A Date at local midnight + offsetDays, + minutes. Built from local
      components so DST changes are handled by the JS Date itself. */
  const atDay = (base, offsetDays, minutes = 0) =>
    new Date(base.getFullYear(), base.getMonth(), base.getDate() + offsetDays, Math.floor(minutes / 60), minutes % 60);
  const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;

  /** The "logical day": before the cutoff hour (default 04:00) you're still in yesterday.
      Used for top 3, wrap-up and "done today" so 00:30 still counts as last night. */
  const logicalDay = (now, cutoffHour = 4) => atDay(now, now.getHours() < cutoffHour ? -1 : 0);

  /** Expand the weekday/weekend templates into concrete, dated block instances
      for yesterday..+2 days (yesterday is needed for blocks that wrap midnight). */
  function blockInstances(routine, now) {
    const out = [];
    for (const off of [-1, 0, 1, 2]) {
      const day = atDay(now, off);
      const tpl = (isWeekend(day) ? routine.weekend : routine.weekday) || [];
      for (const b of tpl) {
        const s = parseHM(b.start), e = parseHM(b.end);
        if (isNaN(s) || isNaN(e) || s === e) continue;          // ignore broken / zero-length blocks
        const start = atDay(now, off, s);
        const end = e > s ? atDay(now, off, e) : atDay(now, off + 1, e); // wraps past midnight
        out.push({ ...b, start, end, day: dateKey(day), key: `${dateKey(day)}|${b.id}` });
      }
    }
    return out.sort((a, b) => a.start - b.start);
  }

  /** Normalise events: Date objects; drop invalid; zero/negative length -> ignored. */
  function normEvents(events) {
    return (events || []).map(e => ({ ...e, s: new Date(e.start), e: new Date(e.end) }))
      .filter(e => !isNaN(e.s) && !isNaN(e.e) && (e.allDay || e.e > e.s));
  }

  /** Timed events in progress at `t`, best candidate first. */
  function activeEvents(evs, t) {
    return evs.filter(e => !e.allDay && !e.info && e.s <= t && t < e.e)
      .sort((a, b) => (b.s - a.s) || (a.e - b.e));
  }

  /** Choose the task to show inside a work block. */
  function pickTask(state, dKey) {
    const tasks = state.tasks || [];
    const byId = id => tasks.find(t => t.id === id);
    const skipped = new Set((state.skips || {})[dKey] || []);
    const cands = [];
    for (const id of (state.top3 || {})[dKey] || []) {
      const t = byId(id); if (t && !t.done) cands.push({ task: t, source: 'top3' });
    }
    for (const p of state.projects || []) {
      const t = byId(p.nextId); if (t && !t.done) cands.push({ task: t, source: 'next', project: p });
    }
    const open = tasks.filter(t => !t.done).sort((a, b) => (a.created || 0) - (b.created || 0));
    for (const t of open) cands.push({ task: t, source: 'oldest' });
    // de-duplicate, then honour "skip for today" — unless everything was skipped
    const seen = new Set(), uniq = cands.filter(c => !seen.has(c.task.id) && seen.add(c.task.id));
    const notSkipped = uniq.filter(c => !skipped.has(c.task.id));
    return (notSkipped[0] || uniq[0] || null);
  }

  /** Auto mode for a free gap: inherit the block that just ended (<3h ago),
      otherwise fall back to the hour of day. */
  function gapMode(t, inst) {
    const prev = inst.filter(b => b.end <= t).sort((a, b) => b.end - a.end)[0];
    if (prev && t - prev.end <= 3 * 60 * MIN) return prev.mode;
    const h = t.getHours();
    if (h < 5 || h >= 22) return 'winddown';
    if (h < 9) return 'life';
    if (h < 17 && !isWeekend(t)) return 'work';
    return h < 19 ? 'life' : 'leisure';
  }

  /** What is "now" at time t (no Next computation — avoids recursion). */
  function resolveAt(t, state, inst, evs) {
    const block = inst.filter(b => b.start <= t && t < b.end).sort((a, b) => b.start - a.start)[0] || null;
    const mode = block ? block.mode : gapMode(t, inst);
    const act = activeEvents(evs, t);
    if (act.length) {
      const ev = act[0];
      return { type: 'event', id: 'ev:' + ev.id, title: ev.title, location: ev.location || '',
        start: ev.s, end: ev.e, mode, kind: 'event', underlying: block,
        also: act.slice(1).map(e => e.title) };
    }
    if (block) {
      const item = { type: 'block', id: block.key, key: block.key, blockId: block.id, title: block.name,
        start: block.start, end: block.end, mode: block.mode, kind: block.kind, day: block.day };
      if (WORK_KINDS.has(block.kind)) item.pick = pickTask(state, block.day);
      return item;
    }
    // free gap: bounded by the latest thing that ended and the earliest thing that starts
    const timed = evs.filter(e => !e.allDay && !e.info);
    const ends = [...inst.map(b => b.end), ...timed.map(e => e.e)].filter(x => x <= t);
    const starts = [...inst.map(b => b.start), ...timed.map(e => e.s)].filter(x => x > t);
    return { type: 'gap', id: 'gap', title: 'Free time', kind: 'gap', mode,
      start: ends.length ? new Date(Math.max(...ends)) : null,
      end: starts.length ? new Date(Math.min(...starts)) : null };
  }

  /** Every moment within the horizon where the answer might change. */
  function boundaries(t, inst, evs, horizonH = 40) {
    const lim = t.getTime() + horizonH * 60 * MIN, set = new Set();
    for (const b of inst) [b.start, b.end].forEach(x => { const v = x.getTime(); if (v > t && v <= lim) set.add(v); });
    for (const e of evs) if (!e.allDay && !e.info) [e.s, e.e].forEach(x => { const v = x.getTime(); if (v > t && v <= lim) set.add(v); });
    return [...set].sort((a, b) => a - b).map(v => new Date(v));
  }

  /** Upcoming distinct items (skipping gaps). Next = agenda(...)[0]. */
  function agenda(t, state, max = 6, horizonH = 40) {
    const inst = blockInstances(state.routine, t), evs = normEvents(state.events);
    const out = []; let lastId = resolveAt(t, state, inst, evs).id;
    for (const b of boundaries(t, inst, evs, horizonH)) {
      const it = resolveAt(b, state, inst, evs);
      if (it.id !== lastId && it.type !== 'gap') {
        // "resume": we return to a block that had already started (e.g. after a meeting)
        out.push({ ...it, at: b, resume: it.type === 'block' && it.start < b });
        if (out.length >= max) break;
      }
      lastId = it.id;
    }
    return out;
  }

  /** Overrun nudge: you pressed Start on something, its planned end passed
      `overrunMin` ago, and the schedule has moved on. */
  function overrun(t, state, current, overrunMin = 20) {
    const a = state.active;
    if (!a || !a.plannedEnd) return null;
    if (current && current.id === a.id) return null;               // still the same thing: no nudge
    if (a.snoozeUntil && t < new Date(a.snoozeUntil)) return null;
    const over = (t - new Date(a.plannedEnd)) / MIN;
    return over >= overrunMin ? { active: a, minutesOver: Math.floor(over) } : null;
  }

  /** Main entry point used by the UI. */
  function resolve(t, state) {
    const inst = blockInstances(state.routine, t), evs = normEvents(state.events);
    let current = resolveAt(t, state, inst, evs);
    const ag = agenda(t, state, 6);
    const ld = logicalDay(t, (state.settings || {}).dayCutoff ?? 4);
    const allDay = evs.filter(e => (e.allDay && e.s <= atDay(ld, 1) && e.e > ld) || (e.info && e.s <= t && t < e.e)).map(e => e.title);
    const autoMode = current.mode;
    const ov = state.modeOverride;
    const overrideOn = !!(ov && MODES.includes(ov.mode) && t < new Date(ov.until));
    // Rule 3b: if you've manually switched to Work (e.g. "Start work" at 08:40, before
    // the first work block), show your top task even though the routine says otherwise.
    // Calendar events still win — you can't do deep work in a meeting.
    if (overrideOn && ov.mode === 'work' && current.type !== 'event' && !current.pick) {
      current = { ...current, pick: pickTask(state, current.day || dateKey(ld)), forcedWork: true };
    }
    return {
      now: t, current, next: ag[0] || null, agenda: ag, allDay,
      autoMode, mode: overrideOn ? ov.mode : autoMode, overrideOn,
      overrun: overrun(t, state, current, (state.settings || {}).overrunMin ?? 20),
      logicalDay: dateKey(ld),
    };
  }

  return { resolve, agenda, overrun, pickTask, blockInstances, logicalDay, dateKey, parseHM, atDay, isWeekend, MODES, WORK_KINDS };
})();
// ==ENGINE END==
</script>

<script>
/* =====================================================================
   PART 1b — SYNC MERGE ENGINE (pure; tested in tests/sync.test.cjs)
   Phone and desktop each keep a full copy of your data. When they sync
   through Google Drive we do a THREE-WAY MERGE:
     base   = what both sides last agreed on (stored locally after each sync)
     local  = this device now
     remote = what's in Drive now
   For every field: if only one side changed it since `base`, that change
   wins. If both changed it differently, the side saved most recently wins.
   - Lists of things with an `id` (tasks, inbox, events, pomodoro log…) are
     merged item by item, so adding a task on the phone and another on the
     desktop keeps both. Deleting on one side deletes, unless the other side
     edited that item meanwhile (an edit beats a delete).
   - Plain objects (settings, top3 by day…) are merged key by key.
   - Everything else (numbers, strings, lists of ids) is one value.
   First sync on a device (no base yet): lists are unioned, objects merged,
   and for single values the copy in Drive wins — so a fresh desktop picks
   up your phone's settings instead of overwriting them with defaults.
   ===================================================================== */
// ==SYNC START==
const Sync = (() => {
  const LOCAL_ONLY = new Set(['ui', 'savedAt', 'syncedAt', 'deviceId']);   // never synced
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
  const isIdList = x => Array.isArray(x) && x.length > 0 && x.every(i => isObj(i) && i.id != null);
  const idListLike = (...xs) => xs.some(isIdList) && xs.every(x => x === undefined || (Array.isArray(x) && x.every(i => isObj(i) && i.id != null)));

  /** One value. `first` = no base (first sync). `preferLocal` breaks true conflicts. */
  function scalar(base, local, remote, ctx) {
    if (same(local, remote)) return local;
    if (ctx.first) return remote === undefined ? local : remote;
    if (same(local, base)) return remote;          // only remote changed
    if (same(remote, base)) return local;          // only local changed
    ctx.conflicts++;
    return ctx.preferLocal ? local : remote;       // both changed: newest save wins
  }

  function list(base = [], local = [], remote = [], ctx) {
    const B = new Map(base.map(i => [i.id, i])), L = new Map(local.map(i => [i.id, i])), R = new Map(remote.map(i => [i.id, i]));
    const ids = [...new Set([...local.map(i => i.id), ...remote.map(i => i.id)])];  // local order first, then remote-only
    const out = [];
    for (const id of ids) {
      const b = B.get(id), l = L.get(id), r = R.get(id);
      if (l && r) { out.push(merge(b, l, r, ctx)); continue; }
      const only = l || r, other = l ? 'remote' : 'local';
      if (ctx.first || !b) { out.push(only); continue; }              // new on one side → keep
      // existed at base, now missing on one side = deleted there; keep only if this side edited it since
      if (!same(only, b)) { ctx.conflicts++; out.push(only); }       // edit beats delete
      // else: unchanged here, deleted on the other side → drop
      void other;
    }
    return out;
  }

  function object(base, local, remote, ctx) {
    base = isObj(base) ? base : undefined;
    const keys = [...new Set([...Object.keys(local || {}), ...Object.keys(remote || {})])];
    const out = {};
    for (const k of keys) {
      if (ctx.depth === 0 && LOCAL_ONLY.has(k)) { if (local && k in local) out[k] = local[k]; continue; }
      const b = base ? base[k] : undefined, l = local ? local[k] : undefined, r = remote ? remote[k] : undefined;
      const inL = !!local && k in local, inR = !!remote && k in remote, inB = !!base && k in base;
      if (inL && inR) { ctx.depth++; out[k] = merge(b, l, r, ctx); ctx.depth--; continue; }
      const v = inL ? l : r;
      if (ctx.first || !inB) { out[k] = v; continue; }               // added on one side
      if (!same(v, b)) { ctx.conflicts++; out[k] = v; }               // removed on one side, edited on the other → keep
      // else removed on one side and unchanged on the other → drop
    }
    return out;
  }

  function merge(base, local, remote, ctx) {
    if (idListLike(base, local, remote)) return list(base, local, remote, ctx);
    if (isObj(local) && isObj(remote)) return object(base, local, remote, ctx);
    return scalar(base, local, remote, ctx);
  }

  /** Public: merge whole app states. Returns {state, conflicts, changedLocal, changedRemote}. */
  function mergeStates(base, local, remote) {
    if (!remote) return { state: local, conflicts: 0, changedLocal: false, changedRemote: true };
    const ctx = { first: !base, preferLocal: (local.savedAt || '') >= (remote.savedAt || ''), conflicts: 0, depth: 0 };
    const state = merge(base || undefined, local, remote, ctx);
    const strip = s => { const o = { ...s }; LOCAL_ONLY.forEach(k => delete o[k]); return o; };
    return { state, conflicts: ctx.conflicts, changedLocal: !same(strip(state), strip(local)), changedRemote: !same(strip(state), strip(remote)) };
  }
  /** What gets uploaded / stored as the base (device-only fields removed). */
  function shareable(s) { const o = { ...s }; LOCAL_ONLY.forEach(k => delete o[k]); return o; }

  return { mergeStates, shareable, LOCAL_ONLY };
})();
// ==SYNC END==
</script>

<script>
/* =====================================================================
   PART 1c — LENS ENGINE (pure; tested in tests/lens.test.cjs)
   Tags live in GROUPS:
     topic    — what it's about (politics, gaming, trash…). Any tag not
                listed in another group counts as a topic.
     genre    — what kind of thing (debates, standup, documentary, lo-fi…)
     activity — what you'd use it for (focus, chill, workout…)
   plus HOW you'd consume it, worked out automatically per item:
     watch  — YouTube videos
     listen — Spotify episodes, and videos from feeds marked "fine to just listen to"
     read   — articles, news, Reddit
   A LENS picks items. Within a group it's "any of these"; across groups
   it's "and". So {topic:[politics], genre:[debates], how:[watch]} means
   "a politics debate I can watch" — never a listen-only podcast.
   Older lenses that are a plain list of tags keep their old meaning
   ("any of these tags").
   ===================================================================== */
// ==LENS START==
const Lens = (() => {
  const GROUPS = ['topic', 'genre', 'activity'];
  const HOW = ['watch', 'listen', 'read'];
  const lc = s => String(s).toLowerCase();

  /** Which group a tag belongs to (topic unless listed elsewhere). `listen` is a hint, not a category. */
  function groupOf(tag, groups = {}) {
    const t = lc(tag);
    if (t === 'listen') return 'hint';
    for (const g of ['genre', 'activity']) if ((groups[g] || []).map(lc).includes(t)) return g;
    return 'topic';
  }
  /** How an item can be consumed. */
  function howOf(item) {
    const type = item.type || 'article';
    const tags = (item.tags || []).map(lc);
    if (type === 'episode') return ['listen'];
    if (type === 'video') return tags.includes('listen') ? ['watch', 'listen'] : ['watch'];
    return ['read'];                                              // article, news, post
  }
  /** Normalise any lens shape to {any, topic, genre, activity, how}. A plain array = legacy "any of". */
  function normalize(lens) {
    const empty = { any: [], topic: [], genre: [], activity: [], how: [] };
    if (!lens) return empty;
    if (Array.isArray(lens)) return { ...empty, any: lens.map(lc) };
    const out = { ...empty };
    for (const k of Object.keys(empty)) out[k] = (lens[k] || []).map(lc);
    return out;
  }
  const isEmpty = l => Object.values(normalize(l)).every(a => !a.length);
  /** Does an item fit a lens? `extraHow` = an extra Watch/Listen/Read filter (e.g. chips in the digest). */
  function matches(item, lens, groups = {}, extraHow = []) {
    const L = normalize(lens), tags = (item.tags || []).map(lc), how = howOf(item);
    if (L.any.length && !tags.some(t => L.any.includes(t))) return false;
    for (const g of GROUPS) {
      if (!L[g].length) continue;
      if (!tags.some(t => L[g].includes(t))) return false;
    }
    if (L.how.length && !how.some(h => L.how.includes(h))) return false;
    if (extraHow.length && !how.some(h => extraHow.includes(h))) return false;
    return true;
  }
  /** Human summary of a lens, e.g. "politics · debates · watch". */
  function describe(lens) {
    const L = normalize(lens);
    return [L.any.join(' or '), ...GROUPS.map(g => L[g].join(' or ')), L.how.join('/')].filter(Boolean).join(' · ') || 'everything';
  }
  /** Tags of a group actually used by feeds, for chips/suggestions. */
  function tagsByGroup(feeds = [], groups = {}) {
    const out = { topic: new Set(), genre: new Set(), activity: new Set() };
    for (const f of feeds) for (const t of f.tags || []) { const g = groupOf(t, groups); if (out[g]) out[g].add(lc(t)); }
    for (const g of ['genre', 'activity']) (groups[g] || []).forEach(t => out[g].add(lc(t)));   // listed but unused = suggestions
    return Object.fromEntries(Object.entries(out).map(([k, v]) => [k, [...v].sort()]));
  }
  return { GROUPS, HOW, groupOf, howOf, normalize, matches, describe, tagsByGroup, isEmpty };
})();
// ==LENS END==

/* =====================================================================
   PART 1d — HABIT ENGINE (pure; tested by tests/habit.test.cjs)
   Three kinds, each nudged differently:
     interval  "every ~N days"  (charge headphones) — due when it's been long enough;
               optionally learns N from the gaps between your actual ticks.
     weekly    "N times a week" (gym 3×) — a Mon–Sun tally, never a breakable daily streak.
     schedule  fixed days + time (a class Tue/Thu 19:00) — also becomes a calendar
               event in the app, so it shows on the Now card and can ring your phone.
   Ticks live in log[habitId]["YYYY-MM-DD"] = timestamp: an object, so two devices
   ticking on different days merge cleanly in sync.
   ===================================================================== */
// ==HABIT START==
const Habit = (() => {
  const DAY = 864e5;
  const toUTC = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const keyOf = t => new Date(t).toISOString().slice(0, 10);
  const addDays = (k, n) => keyOf(toUTC(k) + n * DAY);
  const diffDays = (a, b) => Math.round((toUTC(b) - toUTC(a)) / DAY);        // b − a
  const weekday = k => new Date(toUTC(k)).getUTCDay();                       // 0 = Sun
  const monday = k => addDays(k, -((weekday(k) + 6) % 7));
  const median = xs => { const s = [...xs].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2); };
  const fmt = k => new Date(toUTC(k)).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const DAYNAMES = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const DE = { so: 0, mo: 1, di: 2, mi: 3, do: 4, fr: 5, sa: 6, sonntag: 0, montag: 1, dienstag: 2, mittwoch: 3, donnerstag: 4, freitag: 5, samstag: 6 };

  /** "Tue, Thu" / "tu th" / "Di Do" / "weekdays" → [2,4] (0 = Sun). */
  function parseDays(s) {
    const t = String(s || '').toLowerCase();
    if (/weekdays?|werktag/.test(t)) return [1, 2, 3, 4, 5];
    if (/weekends?|wochenende/.test(t)) return [0, 6];
    if (/every ?day|daily|täglich/.test(t)) return [0, 1, 2, 3, 4, 5, 6];
    const out = new Set();
    for (const w of t.split(/[^a-zäöü]+/).filter(Boolean)) {
      const i = DAYNAMES.findIndex(d => w.startsWith(d.slice(0, 2)) && d.startsWith(w.slice(0, 3)));
      if (i >= 0) out.add(i); else if (w in DE) out.add(DE[w]);                 // German: exact ("Di", "Dienstag") so "someday" ≠ Sonntag
    }
    return [...out].sort();
  }
  const daysLabel = ds => ds.length === 7 ? 'every day' : ds.join() === '1,2,3,4,5' ? 'weekdays' : ds.join() === '0,6' ? 'weekends'
    : ds.map(d => DAYNAMES[d][0].toUpperCase() + DAYNAMES[d].slice(1)).join(', ');
  const doneKeys = (log, id) => Object.keys((log || {})[id] || {}).sort();

  /** How often an interval habit really happens: median of the last ≤5 gaps (needs 2+). */
  function usualEvery(h, keys) {
    const every = Math.max(1, +h.every || 7);
    if (h.learn === false || keys.length < 3) return { every, learned: false, gaps: [] };
    const recent = keys.slice(-6), gaps = recent.slice(1).map((k, i) => diffDays(recent[i], k)).filter(g => g > 0);
    if (gaps.length < 2) return { every, learned: false, gaps };
    return { every: Math.min(60, Math.max(1, median(gaps))), learned: true, gaps };
  }

  /** Status of one habit on day `day` ("YYYY-MM-DD", the app's logical day) at minute-of-day `min`.
      → {due, doneToday, urgency 0..2, text, math, week:[7 bools Mon..Sun], count, target} */
  function status(h, log, day, min = 720) {
    const keys = doneKeys(log, h.id), doneToday = keys.includes(day);
    const mon = monday(day), week = [0, 1, 2, 3, 4, 5, 6].map(i => keys.includes(addDays(mon, i)));
    const base = { id: h.id, doneToday, week, due: false, urgency: 0, text: '', math: '' };
    if (h.paused) return { ...base, text: 'paused' };

    if (h.kind === 'interval') {
      const last = keys.filter(k => k <= day).pop();
      const u = usualEvery(h, keys);
      const dueAt = Math.max(1, u.every >= 4 ? u.every - 1 : u.every);    // a day early for longer gaps, so it never runs flat
      if (!last) return { ...base, due: true, urgency: 1, text: 'not done yet', math: '' };
      const since = diffDays(last, day);
      const usual = u.learned ? `usually every ${u.every} (median of ${u.gaps.join(', ')})` : `every ${u.every} days`;
      const math = `${fmt(day)} − ${fmt(last)} = ${since} day${since === 1 ? '' : 's'} · ${usual}${dueAt < u.every ? ` → nudge from day ${dueAt}` : ''}`;
      const text = doneToday ? 'done today' : since === 0 ? 'done today' : `last ${since} day${since === 1 ? '' : 's'} ago`;
      return { ...base, due: !doneToday && since >= dueAt, urgency: since >= u.every ? 2 : since >= dueAt ? 1 : 0, text, math, every: u.every, since };
    }

    if (h.kind === 'weekly') {
      const target = Math.min(7, Math.max(1, +h.target || 3));
      const count = week.filter(Boolean).length, left = 7 - ((weekday(day) + 6) % 7);   // days left incl. today
      const need = Math.max(0, target - count);
      const math = `${count} of ${target} this week${need ? ` · ${need} more in ${left} day${left === 1 ? '' : 's'}` : ' ✓'}`;
      const urgency = need === 0 ? 0 : need >= left ? 2 : need / left >= 0.5 ? 1 : 0.5;
      return { ...base, due: !doneToday && need > 0, urgency, text: math, math, count, target };
    }

    if (h.kind === 'schedule') {
      const days = h.days || [], todayIs = days.includes(weekday(day));
      const [hh, mm] = String(h.time || '19:00').split(':').map(Number), start = hh * 60 + (mm || 0);
      const lead = Math.max(0, +h.lead || 0), showFrom = start - lead - 60;
      const ds = days.length ? daysLabel(days) : 'no days set';
      const count = days.filter(d => week[(d + 6) % 7]).length, planned = days.filter(d => (d + 6) % 7 <= (weekday(day) + 6) % 7).length;
      const math = `${count} of ${days.length} this week (${ds} ${h.time || '19:00'})`;
      if (!todayIs) return { ...base, text: ds + ' ' + (h.time || ''), math, count, target: days.length };
      const t = String(h.time || '19:00'), leave = lead ? `${String(Math.floor((start - lead) / 60)).padStart(2, '0')}:${String((start - lead) % 60).padStart(2, '0')}` : '';
      const text = min < start ? `${t}${leave ? ' · leave ' + leave : ''}` : 'did you go?';
      // time-bound beats an overdue chore: 2 in the hour before leaving, 3 from leave time on
      return { ...base, due: !doneToday && min >= showFrom, urgency: min >= start - lead ? 3 : 2, text, math, count, target: days.length, planned };
    }
    return base;
  }

  /** Which habits to show now: due, matching the current mode (or "any"), not snoozed today. Most urgent first. */
  function nudges(habits, log, day, min, mode, snoozed = {}) {
    return (habits || []).filter(h => !h.paused && (!h.when || h.when === 'any' || h.when === mode) && snoozed[h.id] !== day)
      .map(h => ({ h, s: status(h, log, day, min) })).filter(x => x.s.due)
      .sort((a, b) => (b.s.urgency - a.s.urgency) || ((b.h.kind === 'schedule') - (a.h.kind === 'schedule')));   // ties: time-bound first
  }

  /** Occurrences of schedule habits as calendar-like events between two day keys (inclusive). */
  function occurrences(habits, fromDay, toDay) {
    const out = [];
    for (const h of habits || []) {
      if (h.kind !== 'schedule' || h.paused || !(h.days || []).length) continue;
      for (let k = fromDay; k <= toDay; k = addDays(k, 1)) if (h.days.includes(weekday(k))) out.push({ h, day: k, time: h.time || '19:00', dur: +h.dur || 60 });
    }
    return out;
  }

  return { status, nudges, occurrences, parseDays, daysLabel, usualEvery, addDays, diffDays, monday, weekday };
})();
// ==HABIT END==

/* =====================================================================
   PART 1e — QUICK-ADD PARSER (pure; tests/quickadd.test.cjs)
   "Drinks with Tom Sat 7pm" → {title:"Drinks with Tom", start: Sat 19:00, end: 20:00}.
   Understands: today/tonight/tomorrow (+ heute/morgen), weekdays (EN/DE, "next fri"),
   dates (24/10, 24.10., 24 Oct, Oct 24th), times (7pm, 19:00, 7.30, noon, "at 7"),
   ranges (7-9pm, 19:00–21:30), durations ("for 2h", "for 90 min"), parts of day
   (morning, lunch, afternoon, evening, dinner) and "all day". A date without a time
   (or anything called a birthday) becomes an all-day event. Nothing found → null.
   ===================================================================== */
// ==QUICKADD START==
const QuickAdd = (() => {
  const WD = { sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, wednesday: 3, thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, sat: 6, saturday: 6,
    sonntag: 0, montag: 1, dienstag: 2, mittwoch: 3, donnerstag: 4, freitag: 5, samstag: 6, so: 0, mo: 1, di: 2, mi: 3, do: 4, fr: 5, sa: 6 };
  const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, sept: 8, oct: 9, nov: 10, dec: 11, mär: 2, mai: 4, okt: 9, dez: 11 };
  const PART = { morning: [9, 0], breakfast: [9, 0], brunch: [11, 0], noon: [12, 0], midday: [12, 0], lunch: [12, 30], afternoon: [15, 0], evening: [19, 0], dinner: [19, 30], tonight: [19, 0], abends: [19, 0], mittags: [12, 0] };
  const at = (base, d, h = 0, m = 0) => { const x = new Date(base); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() + d); x.setHours(h, m, 0, 0); return x; };
  const to24 = (h, m, ap) => { h = +h; m = +(m || 0); if (ap) { ap = ap.toLowerCase(); if (ap.startsWith('p') && h < 12) h += 12; if (ap.startsWith('a') && h === 12) h = 0; } return [h, m]; };

  function parse(input, now = new Date()) {
    let t = ' ' + String(input || '').replace(/\s+/g, ' ').trim() + ' ';
    const cut = re => { const m = t.match(re); if (m) t = t.replace(m[0], ' '); return m; };
    let day = null, time = null, endTime = null, durMin = null, allDay = false, m;

    if (cut(/\s(all[- ]day|ganztägig)\s/i)) allDay = true;
    // duration: "for 2h", "for 90 min", "for 1.5 hours"
    if ((m = cut(/\s(?:for|für)\s(\d+(?:[.,]\d+)?)\s?(h|hrs?|hours?|std|stunden?|m|mins?|minutes?|minuten)\s/i)))
      durMin = Math.round(parseFloat(m[1].replace(',', '.')) * (/^h|^s/i.test(m[2]) ? 60 : 1));
    // time range: "7-9pm", "7pm-9pm", "19:00–21:30", "from 7 to 9pm"
    if ((m = cut(/\s(?:from\s|von\s)?(\d{1,2})(?:[:.](\d{2}))?\s?(am|pm)?\s?(?:-|–|to|bis)\s?(\d{1,2})(?:[:.](\d{2}))?\s?(am|pm|uhr)?\s/i))) {
      const ap2 = /am|pm/i.test(m[6] || '') ? m[6] : null, ap1 = m[3] || ap2;
      time = to24(m[1], m[2], ap1); endTime = to24(m[4], m[5], ap2);
      if (!ap1 && !ap2 && time[0] < 8) { time[0] += 12; endTime[0] += 12; }            // "7-9" with nothing else = evening
      if (endTime[0] * 60 + endTime[1] <= time[0] * 60 + time[1] && endTime[0] < 12) endTime[0] += 12;
    }
    // single time: "7pm", "7:30 pm", "19:00", "19.30", "19 uhr", "at 7"
    if (!time && (m = cut(/\s(?:at\s|um\s|@)?(\d{1,2})(?:[:.](\d{2}))?\s?(am|pm|uhr)\s/i))) time = to24(m[1], m[2], /uhr/i.test(m[3]) ? null : m[3]);
    if (!time && (m = cut(/\s(?:at\s|um\s|@)?(\d{1,2})[:.](\d{2})\s/i))) time = to24(m[1], m[2]);
    if (!time && (m = cut(/\s(?:at|um|@)\s?(\d{1,2})\s/i))) { time = to24(m[1], 0); if (time[0] < 8) time[0] += 12; }   // "at 7" → 19:00
    // relative days
    if ((m = cut(/\s(today|heute)\s/i))) day = 0;
    else if ((m = cut(/\s(day after tomorrow|übermorgen)\s/i))) day = 2;
    else if ((m = cut(/\s(tomorrow|tmrw|tmr|morgen)\s/i))) day = 1;
    else if ((m = cut(/\s(tonight|heute abend)\s/i))) { day = 0; time = time || PART.tonight; }
    // weekday: "sat", "next friday", "on thursday", "this weekend"
    if (day == null && (m = cut(/\s(?:on\s|am\s)?(next\s|nächsten?\s|this\s)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sonntag|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sun|mon|tues?|wed|thur?s?|fri|sat)\s/i))) {
      const want = WD[m[2].toLowerCase()];
      let d = (want - now.getDay() + 7) % 7;
      if (m[1] && /next|nächst/i.test(m[1]) && d === 0) d = 7;
      day = d;
    }
    if (day == null && (m = cut(/\s(?:this\s)?weekend\s/i))) day = (6 - now.getDay() + 7) % 7;
    // dates: 24/10, 24.10., 24.10.2026, 24 Oct, 24th October, Oct 24
    const dateFrom = (dd, mm, yy) => {
      let y = yy ? (+yy < 100 ? 2000 + +yy : +yy) : now.getFullYear();
      let x = new Date(y, mm, +dd);
      if (!yy && x < at(now, 0)) x = new Date(y + 1, mm, +dd);                          // already passed → next year
      return Math.round((at(x, 0) - at(now, 0)) / 864e5);
    };
    if (day == null && (m = cut(/\s(?:on\s|am\s)?(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?\.?\s/))) day = dateFrom(m[1], +m[2] - 1, m[3]);
    if (day == null && (m = cut(/\s(?:on\s|am\s)?(\d{1,2})(?:st|nd|rd|th|\.)?\s(jan|feb|mar|mär|apr|may|mai|jun|jul|aug|sept?|oct|okt|nov|dec|dez)[a-zä]*\.?\s/i))) day = dateFrom(m[1], MON[m[2].toLowerCase()]);
    if (day == null && (m = cut(/\s(?:on\s)?(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s(\d{1,2})(?:st|nd|rd|th)?\s/i))) day = dateFrom(m[2], MON[m[1].toLowerCase()]);
    // part of day words, only if no explicit time ("lunch with Sam" keeps "lunch" in the title)
    let partWord = null;
    if (!time && (m = t.match(/\s(morning|breakfast|brunch|noon|midday|lunch|afternoon|evening|dinner|abends|mittags)\s/i))) { time = PART[m[1].toLowerCase()]; partWord = m[1]; }

    if (day == null && !time && !allDay) return null;
    if (day == null) {                                                                  // only a time: today if still ahead, else tomorrow
      day = time && at(now, 0, time[0], time[1]) <= now ? 1 : 0;
    }
    let title = t.replace(/\s(on|at|um|am|from|von|this|next)\s*$/i, ' ').replace(/^\s*(on|at|um|am)\s/i, ' ')
      .replace(/\s(on|at|um|from|von)(?=\s(on|at|um|from|von)?\s*$)/gi, ' ').replace(/\s+/g, ' ').trim();
    title = title.replace(/\s(on|at|um)$/i, '').trim();
    if (!title) title = partWord ? partWord[0].toUpperCase() + partWord.slice(1) : 'Event';
    title = title[0].toUpperCase() + title.slice(1);
    if (/birthday|geburtstag|bday/i.test(title) && !time) allDay = true;
    if (!time && !allDay) allDay = true;                                                // a date with no time = all day

    if (allDay) { const s = at(now, day); return { title, start: s, end: at(now, day + 1), allDay: true }; }
    const start = at(now, day, time[0], time[1]);
    let end = endTime ? at(now, day, endTime[0], endTime[1]) : new Date(+start + (durMin || (/drinks|dinner|party|bbq|film|movie|kino|concert|konzert/i.test(title) ? 120 : 60)) * 60000);
    if (end <= start) end = new Date(+end + 864e5);
    return { title, start, end, allDay: false };
  }
  return { parse };
})();
// ==QUICKADD END==
</script>



<script>
/* =====================================================================
   PART 2 — STATE & PERSISTENCE
   Everything lives in one JSON object in localStorage (small, sync,
   survives offline). Export/import is the same JSON. Later stages sync
   this same object to Google Drive's appDataFolder.
   ===================================================================== */
const STORE_KEY = 'dailycommand.v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/** Default routine. Blocks: kind = what it is, mode = which dashboard it implies. */

    ],

}

function defaultState() {

      // Stage 2 — morning sequence, weather, digest

      digestVideoDays: 14,     // …and videos older than this many days
      location: null,          // {name, lat, lon} for Open-Meteo
      // Stage 3 — lenses, fresh-content reminder, optional GitHub publishing
      morningLens: 'Morning',  // lens used by the morning sequence's digest

      focusAudio: null,        // {label, url} e.g. an instrumental YouTube playlist
      // Stage 4 — Google (PART 4e). clientId can also come from config.json in the repo.
      google: { clientId: '', on: { calendar: true, calwrite: true, reminders: true, gmail: true, sync: true, youtube: false },
        calOff: [], appCalId: null, focusAlarm: true, blockAlarms: false, ytPlaylistId: null, ytCount: 8 },
      // Stage 4.5 — Spotify (PART 4g). clientId can also come from config.json.
      spotify: { clientId: '', showTags: {}, hiddenShows: [], extraShows: [], playlistTags: {} } },
    routine: defaultRoutine(),
    events: [],            // {id,title,start,end,allDay,location,source:'manual'|'google'}
    projects: [
      { id: 'p-yt', name: 'YouTube channel', nextId: null },
      { id: 'p-wed', name: 'Wedding', nextId: null },
      { id: 'p-pm', name: 'PM learning', nextId: null },
      { id: 'p-admin', name: 'Admin', nextId: null },
    ],
    tasks: [],             // {id,title,projectId,done,doneAt,created}
    createdAt: new Date().toISOString(),   // when this browser's data started — shown in More → Data (diagnostics)
    habits: [],            // Stage 5: {id,name,icon,kind:'interval'|'weekly'|'schedule',every,learn,target,days,time,dur,lead,alarm,when,paused,created}

    digestSession: null,   // {day, lens, types, ids:[...], startedAt, endsAt, built} — the frozen, finite list being read

    freshSnoozeUntil: null,// "add something fresh" snoozed until
    listening: null,       // {key, title, durationSec, startedAt} — what you last pressed Play on
    listenSkip: {},        // {"YYYY-MM-DD": [queue keys]} skipped for today
    pomoLog: [],           // {id,start,end,min,taskId,taskTitle,partial}
    pomo: { phase: 'idle', count: 0 },

}

let S = load();
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    return migrate(JSON.parse(raw));
  } catch (e) { console.warn('Load failed, starting fresh', e); return defaultState(); }
}
/** Fill in anything missing from older versions / partial imports. */
function migrate(d) {
  const def = defaultState();
  const out = { ...def, ...d };
  out.settings = { ...def.settings, ...(d.settings || {}) };
  out.ui = { ...def.ui, ...(d.ui || {}) };
  out.pomo = { ...def.pomo, ...(d.pomo || {}) };
  const dg = (d.settings || {}).google || {};
  out.settings.google = { ...def.settings.google, ...dg, on: { ...def.settings.google.on, ...(dg.on || {}) } };
  out.settings.spotify = { ...def.settings.spotify, ...((d.settings || {}).spotify || {}) };
  out.createdAt = d.createdAt || (d.savedAt ? '' : def.createdAt);   // '' = data from before this field existed
  if (!out.routine || !Array.isArray(out.routine.weekday)) out.routine = def.routine;
  return out;
}
/* Safety net: before each save, the previous copy is kept as that day's snapshot (last 7 days,
   empty states never overwrite a real one). Restore from More → Data. Doesn't survive "clear site
   data" or a different browser — Drive sync is the off-device copy. */
const SNAP_KEY = 'dailycommand.snapshots';
function snapshotPrevious() {
  try {
    const prev = localStorage.getItem(STORE_KEY); if (!prev) return;
    const d = JSON.parse(prev), day = (d.savedAt || '').slice(0, 10);
    if (!day || !((d.tasks || []).length || (d.habits || []).length || (d.inbox || []).length)) return;
    const snaps = JSON.parse(localStorage.getItem(SNAP_KEY) || '{}');
    snaps[day] = prev;
    const keys = Object.keys(snaps).sort(); while (keys.length > 7) delete snaps[keys.shift()];
    localStorage.setItem(SNAP_KEY, JSON.stringify(snaps));
  } catch (e) { /* snapshots are best-effort */ }
}
function save(opts = {}) {
  snapshotPrevious();
  S.savedAt = new Date().toISOString();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save — storage full?'); }
  if (!opts.fromSync && window.dcAfterSave) window.dcAfterSave();   // Stage 4: schedule a Drive sync
}
</script>

<script>
/* =====================================================================
   PART 3 — SMALL HELPERS (formatting, escaping, toast, dialogs)
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtT = d => d ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
function fmtDur(ms) {
  const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60);
  return h ? `${h}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`;
}
const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
/** "tomorrow 07:30", "Sat 10:00" or "11:30" relative to now. */
function whenLabel(d, now = new Date()) {
  const dk = Engine.dateKey;
  if (dk(d) === dk(now)) return fmtT(d);
  if (dk(d) === dk(Engine.atDay(now, 1))) return 'tomorrow ' + fmtT(d);
  return d.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + fmtT(d);

const today = () => Engine.dateKey(Engine.logicalDay(new Date(), S.settings.dayCutoff));
const tomorrow = () => Engine.dateKey(Engine.atDay(Engine.logicalDay(new Date(), S.settings.dayCutoff), 1));

const MODE_LABEL = { work: 'Work', life: 'Life', leisure: 'Leisure', winddown: 'Wind-down' };

  lunch: 'Lunch', life: 'Life', leisure: 'Leisure', winddown: 'Wind-down', other: 'Other' };

let toastTimer;

/** Generic form sheet. fields: [{name,label,type,value,options}] -> Promise<values|null>.
    Returns {__delete:true} if the optional delete button is used. */
function formSheet(title, fields, { okLabel = 'Save', deletable = false, note = '' } = {}) {
  return new Promise(resolve => {
    const dlg = $('#dlg');
    const inp = f => {
      const id = 'f_' + f.name, v = f.value ?? '';
      if (f.type === 'select') return `<select id="${id}">${f.options.map(o => `<option value="${esc(o.value)}" ${o.value === v ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
      if (f.type === 'checkbox') return `<label class="row" style="min-height:44px"><input type="checkbox" id="${id}" ${v ? 'checked' : ''} style="width:22px;height:22px"> ${esc(f.hint || '')}</label>`;
      if (f.type === 'textarea') return `<textarea id="${id}">${esc(v)}</textarea>`;
      return `<input type="${f.type || 'text'}" id="${id}" value="${esc(v)}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''}>`;
    };
    $('#dlgBody').innerHTML = `<h3>${esc(title)}</h3>${note ? `<p class="muted small">${note}</p>` : ''}
      ${fields.map(f => `<label class="f" for="f_${f.name}">${esc(f.label)}</label>${inp(f)}`).join('')}

      if (r === 'cancel') return done(null);
      if (r === 'del') return done({ __delete: true });
      const out = {};
      for (const f of fields) {
        const el = document.getElementById('f_' + f.name);
        out[f.name] = f.type === 'checkbox' ? el.checked : f.type === 'number' ? Number(el.value) : el.value.trim();
      }
      done(out);
    };
    dlg.onclose = () => { if (!dlg.open) resolve(null); };   // ignore a late "close" from the previous sheet (we may already be reopened)
    dlg.showModal();
    const first = $('#dlgBody input[type=text], #dlgBody textarea'); if (first) setTimeout(() => first.focus(), 50);
  });
}

/** Pick one option from a list -> Promise<value|null> */
function choose(title, options) {
  return new Promise(resolve => {
    const dlg = $('#dlg');
    $('#dlgBody').innerHTML = `<h3>${esc(title)}</h3><ul class="list">${options.length ? options.map((o, i) =>
      `<li><div class="grow" data-i="${i}">${esc(o.label)} ${o.tag ? `<span class="tag">${esc(o.tag)}</span>` : ''}</div></li>`).join('')
      : '<li class="empty">Nothing to choose from yet.</li>'}</ul>
      <div class="actions"><button class="btn ghost" data-r="cancel" style="flex:1">Cancel</button></div>`;
    $('#dlgBody').onclick = e => {
      const i = e.target.closest('[data-i]')?.dataset.i;
      if (i != null) { dlg.close(); resolve(options[+i].value); }
      else if (e.target.closest('[data-r]')) { dlg.close(); resolve(null); }
    };
    dlg.onclose = () => { if (!dlg.open) resolve(null); };   // ignore a late "close" from the previous sheet (we may already be reopened)
    dlg.showModal();
  });
}

/** Little chime + vibration for timer ends (only while the page is alive). */
function chime() {
  try { navigator.vibrate?.([200, 100, 200]); } catch (e) {}
  if (!S.settings.sound) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      const t0 = ctx.currentTime + i * 0.22;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2); o.start(t0); o.stop(t0 + 0.22);
    });
  } catch (e) {}
}
/** System notification if permitted (via the service worker so it works on Android). */
async function notify(title, body) {
  chime();
  if (!('Notification' in window) || Notification.permission !== 'granted') return toast(title);
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) reg.showNotification(title, { body, tag: 'daily-command', icon: 'icons/icon-192.png', badge: 'icons/icon-192.png' });
    else new Notification(title, { body });
  } catch (e) { toast(title); }
}
